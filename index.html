    <!-- SIMPLE APK STARTUP -->
    <script>
        function updateStatus(msg) {
            var status = document.getElementById('loader-status');
            if (status) status.textContent = msg;
        }
        
        function removeLoader() {
            var loader = document.getElementById('apk-loader');
            if (loader) {
                loader.classList.add('hidden');
                setTimeout(function() { loader.remove(); }, 500);
            }
        }
        
        // DOMContentLoaded ile başlat
        document.addEventListener('DOMContentLoaded', function() {
            updateStatus('Hazırlanıyor...');
            
            // Script'lerin yüklenmesini bekle
            var checkInterval = setInterval(function() {
                if (typeof React !== 'undefined' && typeof ReactDOM !== 'undefined' && typeof Babel !== 'undefined') {
                    clearInterval(checkInterval);
                    updateStatus('Başlatılıyor...');
                    
                    setTimeout(function() {
                        startApp();
                    }, 500);
                }
            }, 100);
            
            // 10 saniye timeout
            setTimeout(function() {
                clearInterval(checkInterval);
                if (!window.appStarted) {
                    if (typeof React !== 'undefined' && typeof ReactDOM !== 'undefined') {
                        updateStatus('Timeout - Başlatılıyor...');
                        startApp();
                    } else {
                        updateStatus('HATA: React yüklenemedi. İnternet bağlantısını kontrol edin.');
                    }
                }
            }, 10000);
        });
        
        function startApp() {
            if (window.appStarted) return;
            window.appStarted = true;
            updateStatus('React App başlatılıyor...');
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const safeGet = (key, def) => { 
            try { 
                const val = localStorage.getItem(key);
                return val ? JSON.parse(val) : def; 
            } catch (e) { return def; } 
        };

        // ============ BİLDİRİM SİSTEMİ ============
        const NOTIF_MINUTES_BEFORE = 5; // Kaç dakika önce bildirim gelsin
        let notifTimers = {}; // Aktif zamanlayıcılar

        // Service Worker kodu (blob olarak)
        const swCode = `
            const CACHE_NAME = 'akademik-asistan-v1';
            
            self.addEventListener('install', (e) => { self.skipWaiting(); });
            self.addEventListener('activate', (e) => { e.waitUntil(self.clients.claim()); });
            
            // Push notification event
            self.addEventListener('push', (e) => {
                const data = e.data ? e.data.json() : { title: 'Hatırlatıcı', body: 'Yaklaşan etkinlik!' };
                e.waitUntil(
                    self.registration.showNotification(data.title, {
                        body: data.body,
                        icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">📚</text></svg>',
                        badge: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🔔</text></svg>',
                        vibrate: [200, 100, 200, 100, 200],
                        tag: data.tag || 'reminder',
                        requireInteraction: true,
                        actions: [{ action: 'open', title: 'Aç' }, { action: 'dismiss', title: 'Kapat' }]
                    })
                );
            });

            // Message from main thread - show notification
            self.addEventListener('message', (e) => {
                if (e.data && e.data.type === 'SHOW_NOTIFICATION') {
                    e.waitUntil(
                        self.registration.showNotification(e.data.title, {
                            body: e.data.body,
                            icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">📚</text></svg>',
                            vibrate: [200, 100, 200, 100, 200],
                            tag: e.data.tag || 'reminder-' + Date.now(),
                            requireInteraction: true,
                            data: { url: self.location.origin }
                        })
                    );
                }
                
                // Periodic check for reminders
                if (e.data && e.data.type === 'CHECK_REMINDERS') {
                    const tasks = e.data.tasks || [];
                    const now = new Date();
                    const nowMs = now.getTime();
                    
                    tasks.forEach(task => {
                        if (!task.date || !task.time) return;
                        const [h, m] = task.time.split(':').map(Number);
                        const taskDate = new Date(task.date);
                        taskDate.setHours(h, m, 0, 0);
                        const triggerMs = taskDate.getTime() - (${NOTIF_MINUTES_BEFORE} * 60 * 1000);
                        const diff = triggerMs - nowMs;
                        
                        if (diff > 0 && diff < 60000) {
                            setTimeout(() => {
                                self.registration.showNotification('⏰ ' + task.title, {
                                    body: task.time + ' - ' + (task.desc || 'Yaklaşan etkinlik!'),
                                    vibrate: [200, 100, 200, 100, 200],
                                    tag: 'task-' + task.id,
                                    requireInteraction: true
                                });
                            }, Math.max(0, diff));
                        }
                    });
                }
            });

            // Notification click
            self.addEventListener('notificationclick', (e) => {
                e.notification.close();
                if (e.action === 'dismiss') return;
                e.waitUntil(
                    self.clients.matchAll({ type: 'window' }).then(clients => {
                        if (clients.length > 0) { clients[0].focus(); }
                        else { self.clients.openWindow('/'); }
                    })
                );
            });
        `;

        // Service Worker'ı blob URL ile kaydet
        let swRegistration = null;
        const registerServiceWorker = async () => {
            if (!('serviceWorker' in navigator)) {
                console.warn('Service Worker desteklenmiyor');
                return null;
            }
            try {
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                const reg = await navigator.serviceWorker.register(swUrl, { scope: '/' });
                swRegistration = reg;
                console.log('Service Worker kaydedildi');
                return reg;
            } catch (err) {
                console.warn('SW kayıt hatası (normal, blob URL kısıtlaması):', err.message);
                return null;
            }
        };

        // Bildirim izni iste
        const requestNotificationPermission = async () => {
            if (!('Notification' in window)) {
                console.warn('Notification API desteklenmiyor');
                return false;
            }
            if (Notification.permission === 'granted') return true;
            if (Notification.permission === 'denied') return false;
            const result = await Notification.requestPermission();
            return result === 'granted';
        };

        // Bildirim zamanla
        const scheduleNotification = (task) => {
            if (!task.date || !task.time) return;
            if (Notification.permission !== 'granted') return;

            const [h, m] = task.time.split(':').map(Number);
            const taskDate = new Date(task.date);
            taskDate.setHours(h, m, 0, 0);
            const triggerTime = taskDate.getTime() - (NOTIF_MINUTES_BEFORE * 60 * 1000);
            const now = Date.now();
            const delay = triggerTime - now;

            if (delay <= 0) return; // Geçmiş event
            if (delay > 7 * 24 * 60 * 60 * 1000) return; // 7 günden fazla ileri

            // Varsa önceki zamanlayıcıyı temizle
            if (notifTimers[task.id]) clearTimeout(notifTimers[task.id]);

            notifTimers[task.id] = setTimeout(() => {
                // Service Worker üzerinden bildirim gönder
                if (swRegistration && swRegistration.active) {
                    swRegistration.active.postMessage({
                        type: 'SHOW_NOTIFICATION',
                        title: '⏰ ' + task.title,
                        body: task.time + ' - ' + (task.desc || 'Yaklaşan etkinlik!'),
                        tag: 'task-' + task.id
                    });
                } else {
                    // Fallback: doğrudan Notification API
                    try {
                        new Notification('⏰ ' + task.title, {
                            body: task.time + ' - ' + (task.desc || 'Yaklaşan etkinlik!'),
                            icon: '📚',
                            vibrate: [200, 100, 200, 100, 200],
                            requireInteraction: true
                        });
                    } catch (e) { console.warn('Bildirim hatası:', e); }
                }
                delete notifTimers[task.id];
            }, delay);

            console.log(`Bildirim zamanlandı: "${task.title}" - ${Math.round(delay/60000)} dk sonra`);
        };

        // Tüm görevler için bildirimleri zamanla
        const scheduleAllNotifications = (tasks) => {
            // Önceki tüm zamanlayıcıları temizle
            Object.values(notifTimers).forEach(t => clearTimeout(t));
            notifTimers = {};
            
            tasks.forEach(task => scheduleNotification(task));
            
            // Service Worker'a da gönder (arka plan kontrolü için)
            if (swRegistration && swRegistration.active) {
                swRegistration.active.postMessage({
                    type: 'CHECK_REMINDERS',
                    tasks: tasks
                });
            }
        };

        // Periyodik kontrol - Service Worker'a görevleri gönder (her 30 saniye)
        const startPeriodicCheck = (getTasks) => {
            setInterval(() => {
                const tasks = getTasks();
                if (swRegistration && swRegistration.active) {
                    swRegistration.active.postMessage({
                        type: 'CHECK_REMINDERS',
                        tasks: tasks
                    });
                }
                // Yakın zamanlı görevleri yeniden zamanla
                scheduleAllNotifications(tasks);
            }, 30000);
        };

        // Başlangıçta SW ve bildirim izni
        registerServiceWorker();
        // ============ BİLDİRİM SİSTEMİ SONU ============

            // Bildirim dakikası kaydet
            useEffect(() => { localStorage.setItem('notif_min_before_v46', JSON.stringify(notifMinBefore)); }, [notifMinBefore]);

            const getMinutes = (timeStr) => { if(!timeStr) return 0; const [h, m] = timeStr.split(':').map(Number); return h * 60 + m; };
            const getDayKey = (dateStr) => { const d = new Date(dateStr); const map = ["Pazar", "Pazartesi", "Sali", "Carsamba", "Persembe", "Cuma", "Cumartesi"]; return map[d.getDay()]; };

            const checkConflict = (date, time) => {
                const taskExists = tasks.find(t => t.date === date && t.time === time && t.id !== editingTask?.id);
                if (taskExists) return `Çakışma: "${taskExists.title}"`;
                const dayKey = getDayKey(date);
                const daySchedule = schedule[dayKey];
                if (daySchedule) {
                    const taskMin = getMinutes(time);
                    for(let i=0; i<daySchedule.length; i++) {
                        if(daySchedule[i]) {
                            const slotTime = timeSlots[i];
                            const slotMin = getMinutes(slotTime);
                            const duration = daySchedule[i].duration ? parseInt(daySchedule[i].duration) : 1;
                            const lessonEndMin = slotMin + (duration * 60);
                            if (taskMin >= slotMin && taskMin < lessonEndMin) return `Çakışma: "${daySchedule[i].name}" dersi!`;
                        }
                    }
                }
                return null;
            };

            const getTimeline = useCallback(() => {
                const todayStr = new Date().toISOString().split('T')[0];
                let list = tasks.filter(t => t.date === todayStr).map(t => ({ ...t, sortTime: t.time, displayType: t.category }));
                if (prayerTimes && user?.enablePrayer) {
                    const map = { Fajr: "İmsak", Sunrise: "Güneş", Dhuhr: "Öğle", Asr: "İkindi", Maghrib: "Akşam", Isha: "Yatsı" };
                    Object.keys(map).forEach(k => {
                        if(prayerTimes[k]) list.push({ id: `p-${k}`, title: map[k], time: prayerTimes[k], type: "prayer", displayType: "prayer", desc: "Vakit", sortTime: prayerTimes[k] });
                    });
                }
                const dayKey = getDayKey(todayStr);
                const dayLessons = schedule[dayKey];
                if (dayLessons) {
                    dayLessons.forEach((l, i) => {
                        if (l && l.name) {
                            const tStr = timeSlots[i] || "00:00";
                            list.push({ id: `l-${i}`, title: l.name, time: tStr, type: "class", displayType: "class", lType: l.type, desc: LESSON_TYPES[l.type].label, classroom: l.classroom, sortTime: tStr });
                        }
                    });
                }
                return list.sort((a, b) => a.sortTime.localeCompare(b.sortTime));
            }, [tasks, prayerTimes, user, schedule, timeSlots]);

            // PANORAMIC TIMELINE - DEĞİŞİKLİK: 6 Saat Geri / 18 Saat İleri
            const getTimelineEvents = useCallback(() => {
                const now = new Date();
                const nowMinTotal = now.getHours() * 60 + now.getMinutes();
                const windowStart = nowMinTotal - (6 * 60); 
                const windowEnd = nowMinTotal + (18 * 60);
                let events = [];
                tasks.forEach(t => {
                    const tDate = new Date(t.date); const tMin = getMinutes(t.time); const diffDays = Math.round((tDate.setHours(0,0,0,0) - new Date().setHours(0,0,0,0)) / (1000*60*60*24));
                    let relativeMin = tMin + (diffDays * 1440);
                    if (relativeMin >= windowStart && relativeMin <= windowEnd) {
                        events.push({ ...t, relativeMin, displayType: t.category });
                    }
                });
                if (prayerTimes && user?.enablePrayer) {
                    const map = { Fajr: "İmsak", Sunrise: "Güneş", Dhuhr: "Öğle", Asr: "İkindi", Maghrib: "Akşam", Isha: "Yatsı" };
                    [-1, 0, 1].forEach(dayOffset => {
                        Object.keys(map).forEach(k => {
                            if(prayerTimes[k]) {
                                const tMin = getMinutes(prayerTimes[k]) + (dayOffset * 1440);
                                if (tMin >= windowStart && tMin <= windowEnd) {
                                    events.push({ id: `p-${k}-${dayOffset}`, title: map[k], time: prayerTimes[k], relativeMin: tMin, displayType: "prayer", desc: dayOffset === 0 ? "Bugün" : (dayOffset === 1 ? "Yarın" : "Dün") });
                                }
                            }
                        });
                    });
                }
                [-1, 0, 1].forEach(dayOffset => {
                    const d = new Date(); d.setDate(d.getDate() + dayOffset);
                    const dayKey = ["Pazar", "Pazartesi", "Sali", "Carsamba", "Persembe", "Cuma", "Cumartesi"][d.getDay()];
                    const dayLessons = schedule[dayKey];
                    if (dayLessons) {
                        dayLessons.forEach((l, i) => {
                            if (l) {
                                const tMin = getMinutes(timeSlots[i]) + (dayOffset * 1440);
                                if (tMin >= windowStart && tMin <= windowEnd) events.push({ id: `l-${dayOffset}-${i}`, title: l.name, time: timeSlots[i], relativeMin: tMin, displayType: "class", lType: l.type, desc: LESSON_TYPES[l.type].label, classroom: l.classroom });
                            }
                        });
                    }
                });
                return events.sort((a, b) => a.relativeMin - b.relativeMin);
            }, [tasks, prayerTimes, user, schedule, timeSlots]);

            // LIST VIEW - DEĞİŞİKLİK: Geçmiş eventleri de dahil et (sönük göstermek için)
             const getTimelineList = () => {
                const events = getTimelineEvents();
                // Eski filtreyi kaldırdım, sadece sayı limiti koydum
                return events.slice(0, 25); 
            };

            useEffect(() => {
                const tick = () => {
                    const now = new Date(); setCurrentTime(now);
                    setCurrentTimeStr(now.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'}));
                    
                    const events = getTimelineEvents();
                    const nowTotalMin = now.getHours() * 60 + now.getMinutes();

                    // Cursor Color
                    const nextEvent = events.find(ev => ev.relativeMin > nowTotalMin && ev.displayType !== 'prayer');
                    if (nextEvent) {
                        const diff = nextEvent.relativeMin - nowTotalMin;
                        if (diff <= 60) setCursorColor("bg-red-500 shadow-[0_0_15px_red]");
                        else if (diff <= 120) setCursorColor("bg-yellow-500 shadow-[0_0_10px_yellow]");
                        else setCursorColor("bg-emerald-500 shadow-[0_0_10px_#10b981]");
                    } else setCursorColor("bg-emerald-500 shadow-[0_0_10px_#10b981]");

                    setProgress(50); 

                    // Alarm
                    const upcoming = events.find(ev => {
                        const diff = ev.relativeMin - nowTotalMin;
                        return diff > 0 && diff <= 5 && ev.displayType !== 'prayer';
                    });
                    if (upcoming && !dismissedAlerts.includes(upcoming.id)) {
                        if (!alertState || alertState.id !== upcoming.id) {
                            setAlertState(upcoming);
                            try{ audioRef.current.play(); } catch(e){}
                        }
                    } else { if(alertState) setAlertState(null); }

                    if(pomodoro.active && pomodoro.time > 0) setPomodoro(prev => ({...prev, time: prev.time - 1}));
                    else if (pomodoro.active && pomodoro.time === 0) { setPomodoro({active: false, time: 25 * 60}); alert("Odaklanma Bitti!"); }
                };
                tick(); const timer = setInterval(tick, 1000); 
                if (user?.enablePrayer && user?.city && !prayerTimes) fetchPrayerTimes(user.city);
                return () => clearInterval(timer);
            }, [getTimelineEvents, alertState, pomodoro.active, user, dismissedAlerts]);
            
            // BUKALEMUN İMLEÇ - Yaklaşan göreve göre renk değişir
            useEffect(() => {
                const events = getTimelineEvents();
                const nowMin = currentTime.getHours() * 60 + currentTime.getMinutes();
                
                // Yaklaşan görevleri bul (4 saat = 240 dakika içinde)
                const upcoming = events.filter(ev => {
                    const diff = ev.relativeMin - nowMin;
                    return diff > 0 && diff <= 240 && ev.displayType !== 'prayer';
                });
                
                if (upcoming.length === 0) {
                    // Yaklaşan görev yok veya 4+ saat sonra - YEŞİL
                    setCursorColor("bg-emerald-500 shadow-[0_0_15px_#10b981]");
                } else {
                    const closestTask = upcoming[0];
                    const minutesUntil = closestTask.relativeMin - nowMin;
                    
                    if (minutesUntil < 60) {
                        // 1 saat altı - KIRMIZI (acil!)
                        setCursorColor("bg-red-500 shadow-[0_0_20px_#ef4444] animate-pulse");
                    } else if (minutesUntil < 240) {
                        // 1-4 saat arası - SARI (dikkat!)
                        setCursorColor("bg-yellow-400 shadow-[0_0_18px_#fbbf24]");
                    } else {
                        // 4+ saat - YEŞİL (rahat)
                        setCursorColor("bg-emerald-500 shadow-[0_0_15px_#10b981]");
                    }
                }
            }, [currentTime, getTimelineEvents]);

            const dismissAlert = () => { if (alertState) { setDismissedAlerts(prev => [...prev, alertState.id]); setAlertState(null); if(audioRef.current) { audioRef.current.pause(); audioRef.current.currentTime = 0; } } };
            const fetchPrayerTimes = async (city) => { try { const d = new Date(); const res = await fetch(`https://api.aladhan.com/v1/timingsByCity/${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()}?city=${city}&country=Turkey&method=13`); const json = await res.json(); if(json.data) setPrayerTimes(json.data.timings); } catch (e) { console.error(e); } };
            const updateAcademicCalendar = (uniName) => { const newData = ACADEMIC_DATA[uniName] || ACADEMIC_DATA['default']; setCalendarEvents(newData); };
            const handleUpdateUser = (e) => { e.preventDefault(); const fd = new FormData(e.target); const u = UNIVERSITIES.find(x => x.name === fd.get('uni')); if (!u) return; updateAcademicCalendar(u.name); setUser({ ...user, title: fd.get('title'), name: fd.get('name'), uni: u.name, city: u.city, url: u.url, enablePrayer: fd.get('enablePrayer') === 'on' }); setActiveModal(null); };
            
            const handleAddTask = () => { 
                if(!newTask.title || !newTask.date) return;
                
                if (!conflictWarn) {
                    let msg = checkConflict(newTask.date, newTask.time);
                    if (isRecurring && !editingTask) { 
                        const d = new Date(newTask.date);
                        const check = checkConflict(d.toISOString().split('T')[0], newTask.time);
                        if(check) msg = "Rutin Başlangıcında: " + check;
                    }
                    if (msg) { setConflictWarn(msg); return; }
                }

                if (editingTask) {
                    setTasks(prev => prev.map(t => t.id === editingTask.id ? { ...newTask, id: t.id, completed: t.completed || false } : t));
                    setEditingTask(null);
                } else {
                    let newTasks = []; 
                    if (isRecurring) { 
                        let currentDate = new Date(newTask.date);
                        let increment = recurringPeriod === "weekly" ? 7 : recurringPeriod === "biweekly" ? 14 : 30;
                        for(let i=0; i<recurringWeeks; i++) { 
                            newTasks.push({...newTask, id: Date.now()+i, date: currentDate.toISOString().split('T')[0], category: newTask.category, title: newTask.title, time: newTask.time, desc: newTask.desc, completed: false }); 
                            currentDate.setDate(currentDate.getDate() + increment);

                                                    key={k} 
                                                    onClick={() => setNewLesson({...newLesson, type: k})} 
                                                    className={`p-2 rounded border text-xs font-bold transition ${newLesson.type === k ? 'ring-2 ring-white scale-105' : 'opacity-70'} ${v.btnClass}`}
                                                >
                                                    {v.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Gün ve Saat Aralıkları */}
                                    <div>
                                        <div className="flex items-center justify-between mb-2">
                                            <label className="text-xs text-slate-400 font-bold">Ders Programı *</label>
                                            <button 
                                                onClick={addDaySchedule}
                                                className="bg-blue-600 text-white px-3 py-1 rounded text-xs font-bold hover:bg-blue-500 flex items-center gap-1"
                                            >
                                                <i className="fas fa-plus"></i> Gün Ekle
                                            </button>
                                        </div>
                                        
                                        {newLesson.daySchedules.length === 0 ? (
                                            <div className="text-center py-8 border border-dashed border-slate-600 rounded text-slate-500 text-sm">
                                                <i className="fas fa-calendar-plus text-2xl mb-2 block"></i>
                                                Lütfen en az bir gün ekleyin
                                            </div>
                                        ) : (
                                            <div className="space-y-3">
                                                {newLesson.daySchedules.map((ds, index) => (
                                                    <div key={index} className="bg-slate-900/50 p-3 rounded border border-slate-600">
                                                        <div className="flex items-center justify-between mb-2">
                                                            <select 
                                                                value={ds.day}
                                                                onChange={e => updateDaySchedule(index, 'day', e.target.value)}
                                                                className="input-dark p-2 rounded text-xs flex-1 mr-2"
                                                            >
                                                                {DAYS_TR.map(day => (
                                                                    <option key={day} value={day}>{day}</option>
                                                                ))}
                                                            </select>
                                                            <button 
                                                                onClick={() => removeDaySchedule(index)}
                                                                className="text-red-400 hover:text-red-300 w-8 h-8 rounded hover:bg-red-900/20"
                                                            >
                                                                <i className="fas fa-trash-alt"></i>
                                                            </button>
                                                        </div>
                                                        <div className="grid grid-cols-2 gap-2 mb-2">
                                                            <div>
                                                                <label className="text-[10px] text-slate-500 block mb-1">Başlangıç</label>
                                                                <input 
                                                                    type="time"
                                                                    value={ds.startTime}
                                                                    onChange={e => updateDaySchedule(index, 'startTime', e.target.value)}
                                                                    className="w-full input-dark p-2 rounded text-xs"
                                                                />
                                                            </div>
                                                            <div>
                                                                <label className="text-[10px] text-slate-500 block mb-1">Bitiş</label>
                                                                <input 
                                                                    type="time"
                                                                    value={ds.endTime}
                                                                    onChange={e => updateDaySchedule(index, 'endTime', e.target.value)}
                                                                    className="w-full input-dark p-2 rounded text-xs"
                                                                />
                                                            </div>
                                                        </div>
                                                        <div>
                                                            <label className="text-[10px] text-slate-500 block mb-1">Sınıf/Derslik</label>
                                                            <input 
                                                                type="text"
                                                                placeholder="örn: A101"
                                                                value={ds.classroom || ""}
                                                                onChange={e => updateDaySchedule(index, 'classroom', e.target.value)}
                                                                className="w-full input-dark p-2 rounded text-xs"
                                                            />
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                        
                                        <div className="mt-2 text-xs text-slate-500 italic">
                                            💡 Her gün için farklı saat ve sınıf belirleyebilirsiniz
                                        </div>
                                    </div>
                                </div>

                                <div className="flex gap-2 mt-6">
                                    <button 
                                        onClick={() => {
                                            setActiveModal(null);
                                            setNewLesson({ name: "", classroom: "", type: "lisans", daySchedules: [] });
                                        }} 
                                        className="flex-1 py-3 rounded bg-slate-700 text-slate-400 hover:bg-slate-600"
                                    >
                                        İptal
                                    </button>
                                    <button 
                                        onClick={handleAddNewLesson} 
                                        className="flex-1 py-3 rounded bg-emerald-600 text-white font-bold hover:bg-emerald-500"
                                    >
                                        <i className="fas fa-check mr-2"></i>
                                        Dersi Ekle
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeModal === 'settings' && (<div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[70] flex items-center justify-center p-4 animate-enter no-screenshot"><div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl relative max-h-[90vh] overflow-y-auto"><button onClick={() => setActiveModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-white"><i className="fas fa-times"></i></button><h3 className="text-white font-bold mb-4">Ayarlar</h3><form onSubmit={handleUpdateUser} className="space-y-4"><div><label className="text-xs text-slate-400">Ad Soyad</label><input name="name" defaultValue={user.name} required className="w-full input-dark p-3 rounded-lg" /></div><div><label className="text-xs text-slate-400">Üniversite</label><select name="uni" defaultValue={user.uni} className="w-full input-dark p-3 rounded-lg">{UNIVERSITIES.map(u => <option key={u.name} value={u.name}>{u.name}</option>)}</select></div><div className="flex items-center gap-3 pt-2"><input type="checkbox" name="enablePrayer" defaultChecked={user.enablePrayer} className="w-5 h-5 accent-blue-500" /><span className="text-sm text-slate-300">Namaz Vakitlerini Göster</span></div><button className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-500">Kaydet</button></form>

                    {/* BİLDİRİM AYARLARI */}
                    <div className="mt-4 p-4 bg-slate-900/50 rounded-xl border border-slate-700">
                        <h4 className="text-sm font-bold text-white mb-3 flex items-center gap-2">
                            <i className="fas fa-bell text-yellow-400"></i> Bildirim Ayarları
                        </h4>
                        <div className="space-y-3">
                            <div className="flex items-center justify-between">
                                <span className="text-xs text-slate-300">Bildirim Durumu</span>
                                <span className={`text-xs font-bold px-2 py-1 rounded ${
                                    notifPermission === 'granted' ? 'bg-green-900 text-green-300' :
                                    notifPermission === 'denied' ? 'bg-red-900 text-red-300' :
                                    'bg-yellow-900 text-yellow-300'
                                }`}>
                                    {notifPermission === 'granted' ? '✅ Aktif' :
                                     notifPermission === 'denied' ? '❌ Engelli' : '⏳ Bekliyor'}
                                </span>
                            </div>
                            
                            {notifPermission !== 'granted' && (
                                <button 
                                    onClick={async () => {
                                        const granted = await requestNotificationPermission();
                                        setNotifPermission(Notification.permission);
                                        if (granted) scheduleAllNotifications(tasks);
                                    }}
                                    className="w-full bg-yellow-600 text-white py-2 rounded-lg text-xs font-bold hover:bg-yellow-500 transition flex items-center justify-center gap-2"
                                >
                                    <i className="fas fa-bell"></i> Bildirimleri Etkinleştir
                                </button>
                            )}
                            
                            {notifPermission === 'granted' && (
                                <>
                                    <div className="flex items-center justify-between">
                                        <span className="text-xs text-slate-300">Kaç dk önce hatırlat</span>
                                        <select 
                                            value={notifMinBefore}
                                            onChange={(e) => setNotifMinBefore(parseInt(e.target.value))}
                                            className="input-dark px-2 py-1 rounded text-xs w-20 text-center"
                                        >
                                            <option value="1">1 dk</option>
                                            <option value="3">3 dk</option>
                                            <option value="5">5 dk</option>
                                            <option value="10">10 dk</option>
                                            <option value="15">15 dk</option>
                                            <option value="30">30 dk</option>
                                        </select>
                                    </div>
                                    <button 
                                        onClick={() => {
                                            new Notification('🔔 Test Bildirimi', {
                                                body: 'Bildirimler çalışıyor! Uygulama kapalıyken de hatırlatıcılar gelecek.',
                                                icon: '📚'
                                            });
                                        }}
                                        className="w-full bg-slate-700 text-slate-300 py-2 rounded-lg text-xs hover:bg-slate-600 transition flex items-center justify-center gap-2"
                                    >
                                        <i className="fas fa-vial"></i> Test Bildirimi Gönder
                                    </button>
                                </>
                            )}
                            
                            {notifPermission === 'denied' && (
                                <p className="text-[10px] text-red-400">
                                    Bildirimler engellendi. Tarayıcı/uygulama ayarlarından izin verin.
                                </p>
                            )}
                        </div>
                    </div>

                    <hr className="border-slate-700 my-4" />
                    <div className="space-y-2">
                        <div className="flex gap-2">
                            <button onClick={exportData} className="flex-1 bg-green-900/50 border border-green-800 text-green-100 text-xs py-2 rounded hover:bg-green-800">
                                📦 Yedek (.txt)
                            </button>
                            <button onClick={importData} className="flex-1 bg-blue-900/50 border border-blue-800 text-blue-100 text-xs py-2 rounded hover:bg-blue-800">
                                📂 Yükle
                            </button>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={exportToPDF} className="flex-1 bg-red-900/50 border border-red-800 text-red-100 text-xs py-2 rounded hover:bg-red-800">
                                📄 Renkli PDF
                            </button>
                            <button onClick={exportToICS} className="flex-1 bg-purple-900/50 border border-purple-800 text-purple-100 text-xs py-2 rounded hover:bg-purple-800">
                                📅 Takvim
                            </button>
                        </div>
                    </div></div></div>)}
                    {activeModal === 'task' && (<div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4 animate-enter no-screenshot"><div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl max-h-[90vh] overflow-y-auto"><h3 className="text-white font-bold mb-4">{editingTask ? 'Görevi Düzenle' : 'Yeni Hatırlatıcı'}</h3><div className="space-y-3"><input className="w-full input-dark p-3 rounded" placeholder="Başlık" value={newTask.title} onChange={e=>{setNewTask({...newTask,title:e.target.value}); setConflictWarn(null);}} /><div className="grid grid-cols-2 gap-2"><select className="w-full input-dark p-3 rounded" value={newTask.category} onChange={e=>setNewTask({...newTask,category:e.target.value})}><option value="daily">Gündelik İş (Mavi)</option><option value="official">Resmi Toplantı (Sarı)</option><option value="special">Özel Gün (Pembe)</option></select><input type="time" className="w-full input-dark p-3 rounded" value={newTask.time} onChange={e=>{setNewTask({...newTask,time:e.target.value}); setConflictWarn(null);}} /></div><input type="date" className="w-full input-dark p-3 rounded" value={newTask.date} onChange={e=>{setNewTask({...newTask,date:e.target.value}); setConflictWarn(null);}} /><textarea className="w-full input-dark p-3 rounded h-20 resize-none" placeholder="Açıklama..." value={newTask.desc} onChange={e=>setNewTask({...newTask,desc:e.target.value})}></textarea><div className="bg-slate-900/50 p-3 rounded-lg border border-slate-700"><div className="flex items-center justify-between mb-2"><span className="text-xs text-slate-300">Rutin Tekrar?</span><input type="checkbox" checked={isRecurring} onChange={e=>setIsRecurring(e.target.checked)} className="w-4 h-4 accent-blue-500" disabled={!!editingTask} /></div>{isRecurring && (<div className="space-y-2 animate-enter"><div className="flex items-center gap-2"><span className="text-[10px] text-slate-400">Periyot:</span><select value={recurringPeriod} onChange={e=>setRecurringPeriod(e.target.value)} className="flex-1 bg-slate-900 border border-slate-600 rounded p-1 text-center text-white text-xs"><option value="weekly">Her Hafta</option><option value="biweekly">2 Haftada Bir</option><option value="monthly">Her Ay</option></select></div><div className="flex items-center gap-2"><span className="text-[10px] text-slate-400">Kaç Kez?</span><input type="number" value={recurringWeeks} onChange={e=>setRecurringWeeks(parseInt(e.target.value))} className="w-16 bg-slate-900 border border-slate-600 rounded p-1 text-center text-white text-xs" /></div></div>)}</div></div><div className="flex gap-2 mt-4"><button onClick={()=>setActiveModal(null)} className="flex-1 py-3 rounded bg-slate-700 text-slate-400 hover:bg-slate-600">İptal</button><button onClick={handleAddTask} className={`flex-1 py-3 rounded text-white font-bold transition ${conflictWarn ? 'bg-red-600 hover:bg-red-700 animate-pulse' : 'bg-blue-600 hover:bg-blue-500'}`}>{conflictWarn ? '⚠️ Yine de Ekle?' : (editingTask ? 'Güncelle' : 'Kaydet')}</button></div>{conflictWarn && <div className="mt-2 text-center text-xs text-red-300 bg-red-900/20 p-2 rounded">{conflictWarn}</div>}</div></div>)}
                    {activeModal === 'notes' && (<div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4 animate-enter no-screenshot"><div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl h-[60vh] flex flex-col"><div className="flex justify-between mb-4"><h3 className="text-white font-bold">Not Defteri</h3><button onClick={()=>setActiveModal(null)}><i className="fas fa-times text-slate-400"></i></button></div><div className="flex gap-2 mb-4"><input className="flex-1 input-dark p-2 rounded" placeholder="Notunuz..." value={newNote} onChange={e=>setNewNote(e.target.value)} /><button onClick={handleAddNote} className="bg-blue-600 px-4 rounded text-white"><i className="fas fa-plus"></i></button></div><div className="flex-1 overflow-y-auto space-y-2">{notes.map(n=><div key={n.id} className="bg-slate-700 p-3 rounded flex justify-between items-start"><div><p className="text-sm text-white">{n.text}</p><p className="text-[10px] text-slate-400">{n.date}</p></div><button onClick={()=>setNotes(notes.filter(x=>x.id!==n.id))} className="text-red-400"><i className="fas fa-trash"></i></button></div>)}</div></div></div>)}
                    
                    {/* DERS DÜZENLEME MODALI - GÜNCELLENDİ */}
                    {activeModal === 'lesson' && editingLesson && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4 animate-enter no-screenshot">
                            <div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl max-h-[90vh] overflow-y-auto">
                                <h3 className="text-white font-bold mb-4">Ders Düzenle</h3>
                                
                                <div className="space-y-4">
                                    {/* Ders Adı */}
                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">Ders Adı</label>
                                        <input 
                                            className="w-full input-dark p-3 rounded" 
                                            value={editingLesson.data.name} 
                                            onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,name:e.target.value}})} 
                                        />
                                    </div>

                                    {/* Başlangıç ve Bitiş Saati */}
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-xs text-slate-400 block mb-1">Başlangıç</label>
                                            <input 
                                                type="time" 
                                                className="w-full input-dark p-3 rounded" 
                                                value={editingLesson.data.startTime || ""} 
                                                onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,startTime:e.target.value}})} 
                                            />
                                        </div>
                                        <div>
                                            <label className="text-xs text-slate-400 block mb-1">Bitiş</label>
                                            <input 
                                                type="time" 
                                                className="w-full input-dark p-3 rounded" 
                                                value={editingLesson.data.endTime || ""} 
                                                onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,endTime:e.target.value}})} 
                                            />
                                        </div>
                                    </div>

                                    {/* Sınıf/Derslik */}
                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">Sınıf/Derslik</label>
                                        <input 
                                            className="w-full input-dark p-3 rounded" 
                                            placeholder="örn: A101" 
                                            value={editingLesson.data.classroom || ""} 
                                            onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,classroom:e.target.value}})} 
                                        />
                                    </div>

                                    {/* Süre (Saat) */}
                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">Süre (Saat)</label>
                                        <input 
                                            type="number" 
                                            min="1" 
                                            max="8" 
                                            className="w-full input-dark p-3 rounded" 
                                            value={editingLesson.data.duration || ""} 
                                            onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,duration:e.target.value}})} 
                                        />
                                    </div>

                                    {/* Tür (Renk Seçimi) */}
                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">Tür (Renk Seçimi)</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            {Object.entries(LESSON_TYPES).map(([k,v])=>(
                                                <button 
                                                    key={k} 
                                                    onClick={()=>setEditingLesson({...editingLesson,data:{...editingLesson.data,type:k}})} 
                                                    className={`p-2 rounded border text-xs font-bold transition ${editingLesson.data.type===k?'ring-2 ring-white scale-105':'opacity-80'} ${v.btnClass}`}
                                                >
                                                    {v.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <div className="flex gap-2 mt-6">
                                    <button 
                                        onClick={() => setActiveModal(null)} 
                                        className="flex-1 py-3 rounded bg-slate-700 text-slate-400 hover:bg-slate-600"
                                    >
                                        Vazgeç
                                    </button>
                                    <button 
                                        onClick={deleteLesson} 
                                        className="flex-1 py-3 rounded bg-red-900/50 text-red-400 hover:bg-red-900/70 border border-red-700"
                                    >
                                        Sil
                                    </button>
                                    <button 
                                        onClick={saveLesson} 
                                        className="flex-1 py-3 rounded bg-blue-600 text-white font-bold hover:bg-blue-500"
                                    >
                                        Kaydet
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {activeModal === 'dayDetail' && dayDetailData && (<div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[70] flex items-center justify-center p-4 animate-enter no-screenshot"><div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl max-h-[80vh] overflow-y-auto"><div className="flex justify-between items-center mb-4"><h3 className="text-white font-bold">{dayDetailData.date} Detayı</h3><button onClick={() => { setActiveModal(null); setDayDetailData(null); }} className="text-slate-400 hover:text-white"><i className="fas fa-times"></i></button></div><div className="space-y-3">{dayDetailData.events.map((ev, i) => (<div key={i} className={`p-3 rounded border-l-4 flex justify-between items-center ${ev.category==='academic'?'bg-red-900/30 border-red-500': ev.category==='official'?'bg-amber-900/30 border-amber-500': ev.category==='special'?'bg-pink-900/30 border-pink-500':'bg-blue-900/30 border-blue-500'}`} onClick={() => { if(ev.origin === 'personal' && !ev.isRecurring) { openEditTask(ev); setDayDetailData(null); } }}><div><div className="text-sm font-bold text-white">{ev.event}{ev.isRecurring && <span className="text-[10px] ml-2 bg-pink-600 px-2 py-0.5 rounded">Döngüsel</span>}</div>{ev.time && <div className="text-xs text-slate-400 mt-1"><i className="far fa-clock mr-1"></i>{ev.time}</div>}<div className="text-[10px] text-slate-500 mt-1 uppercase">{ev.origin}</div></div>{ev.origin === 'personal' && !ev.isRecurring && <button onClick={(e) => deleteTask(e, ev.id)} className="text-red-400 hover:text-red-300 px-2 ml-2"><i className="fas fa-trash"></i></button>}</div>))}</div><div className="mt-6 pt-4 border-t border-slate-700"><button onClick={() => { setNewTask({ title: "", date: dayDetailData.date, time: "09:00", desc: "", type: "task", category: "daily" }); setActiveModal('task'); }} className="w-full bg-slate-700 text-white py-2 rounded-lg text-sm hover:bg-slate-700 transition flex items-center justify-center gap-2"><i className="fas fa-plus"></i> Bu Güne Hatırlatıcı Ekle</button></div></div></div>)}
                </div>
            );
        };
        
        // APP BAŞLATMA - React 17 render
        ReactDOM.render(<App />, document.getElementById('root'));
        removeLoader();
    </script>
</body>
</html>
