            // --- UI STATES ---

            const [newTask, setNewTask] = useState({ title: "", date: "", time: "", desc: "", type: "task", category: "daily" });

            // --- GÜVENLİ VERİ YÜKLEME (AÇILIŞ KİLİTLENMESİNİ ÖNLER) ---
            useEffect(() => {
                const loadData = () => {
                    try {
                        const safeParse = (key, def) => {
                            const val = localStorage.getItem(key);
                            return val ? JSON.parse(val) : def;
                        };
                        // vFINAL: Temiz başlangıç anahtarları
                        setUser(safeParse('user_vFINAL', null));
                        setAcademicCalendarLink(safeParse('calendar_link_vFINAL', ''));
                        setTasks(safeParse('tasks_vFINAL', []));
                        setNotes(safeParse('notes_vFINAL', []));
                        setSchedule(safeParse('schedule_vFINAL', {
                            Pazartesi: Array(13).fill(null), Sali: Array(13).fill(null), Carsamba: Array(13).fill(null), Persembe: Array(13).fill(null), Cuma: Array(13).fill(null), Cumartesi: Array(13).fill(null), Pazar: Array(13).fill(null)
                        }));
                        setTimeSlots(safeParse('timeslots_vFINAL', ["08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00"]));
                        setCustomScores(safeParse('scores_vFINAL', [{ id: 1, name: "Makale", value: 20, count: 0 }]));
                        setTargetScore(safeParse('target_score_vFINAL', 100));
                    } catch (e) {
                        console.error("Veri yükleme hatası:", e);
                    } finally {
                        // Veriler yüklendikten sonra loader'ı kaldır
                        setTimeout(() => {
                            const loader = document.getElementById('loader');
                            if(loader) {
                                loader.style.opacity = '0';
                                setTimeout(() => { loader.style.display = 'none'; setIsLoaded(true); }, 500);
                            } else {
                                setIsLoaded(true);
                            }
                        }, 1000); // 1 Saniye güvenli bekleme
                    }
                };
                loadData();
            }, []);

            // --- KAYDETME (OTOMATİK) ---
            useEffect(() => { if(isLoaded && user) localStorage.setItem('user_vFINAL', JSON.stringify(user)); }, [user, isLoaded]);
            useEffect(() => { if(isLoaded) localStorage.setItem('tasks_vFINAL', JSON.stringify(tasks)); }, [tasks, isLoaded]);
            useEffect(() => { if(isLoaded) localStorage.setItem('schedule_vFINAL', JSON.stringify(schedule)); }, [schedule, isLoaded]);
            useEffect(() => { if(isLoaded) localStorage.setItem('notes_vFINAL', JSON.stringify(notes)); }, [notes, isLoaded]);
            useEffect(() => { if(isLoaded) localStorage.setItem('scores_vFINAL', JSON.stringify(customScores)); }, [customScores, isLoaded]);
            useEffect(() => { if(isLoaded) localStorage.setItem('target_score_vFINAL', JSON.stringify(targetScore)); }, [targetScore, isLoaded]);
            useEffect(() => { if(isLoaded) localStorage.setItem('timeslots_vFINAL', JSON.stringify(timeSlots)); }, [timeSlots, isLoaded]);
            useEffect(() => { if(isLoaded) localStorage.setItem('calendar_link_vFINAL', JSON.stringify(academicCalendarLink)); }, [academicCalendarLink, isLoaded]);

            // --- BİLDİRİM (SERVICE WORKER YERİNE GÜVENLİ INTERVAL) ---
            useEffect(() => {
                const checkNotifications = () => {
                    if (!tasks.length) return;
                    const now = new Date();
                    tasks.forEach(task => {
                        if (!task.date || !task.time) return;
                        const [h, m] = task.time.split(':').map(Number);
                        const tDate = new Date(task.date);
                        tDate.setHours(h, m, 0, 0);
                        const diff = tDate - now;
                        // 5 dakika kala bildirim (bir kez çalması için basit kontrol)
                        if (diff > 0 && diff < 60000 * 5 && diff > 60000 * 4.9) {
                            if (Notification.permission === 'granted') {
                                new Notification(`Hatırlatıcı: ${task.title}`, { body: task.desc || "Zaman yaklaşıyor!" });
                            }
                        }
                    });
                };
                const interval = setInterval(checkNotifications, 10000); // Her 10 sn kontrol
                if ('Notification' in window && Notification.permission !== 'granted') Notification.requestPermission();
                return () => clearInterval(interval);
            }, [tasks]);

            // --- SAAT VE RENDER DÖNGÜSÜ ---
            useEffect(() => {
                const tick = () => {
                    const now = new Date();
                    setCurrentTimeStr(now.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'}));
                    if(pomodoro.active && pomodoro.time > 0) setPomodoro(prev => ({...prev, time: prev.time - 1}));
                    else if (pomodoro.active && pomodoro.time === 0) { setPomodoro({active: false, time: 25 * 60}); alert("Süre Doldu!"); }
                };
                const timer = setInterval(tick, 1000);
                if (user?.enablePrayer && user?.city && !prayerTimes) fetchPrayerTimes(user.city);
                return () => clearInterval(timer);
            }, [pomodoro.active, user]);

            const fetchPrayerTimes = async (city) => { 
                try { 
                    const d = new Date(); 
                    const res = await fetch(`https://api.aladhan.com/v1/timingsByCity/${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()}?city=${city}&country=Turkey&method=13`); 
                    const json = await res.json(); 
                    if(json.data) setPrayerTimes(json.data.timings); 
                } catch (e) { console.warn("Namaz vakitleri alınamadı"); } 
            };

            // --- TIMELINE MANTIĞI (ORİJİNAL) ---
            const getTimelineEvents = useCallback(() => {
                const now = new Date();
                const nowMinTotal = now.getHours() * 60 + now.getMinutes();
                const windowStart = nowMinTotal - (6 * 60); 
                const windowEnd = nowMinTotal + (18 * 60);
                let events = [];

                tasks.forEach(t => {
                    if(!t.date || !t.time) return;
                    const tDate = new Date(t.date); 
                    const [h, m] = t.time.split(':').map(Number);
                    const tMin = h*60 + m;
                    const diffDays = Math.round((tDate.setHours(0,0,0,0) - new Date().setHours(0,0,0,0)) / (1000*60*60*24));
                    let relativeMin = tMin + (diffDays * 1440);
                    if (relativeMin >= windowStart && relativeMin <= windowEnd) {
                        events.push({ ...t, relativeMin, displayType: t.category });
                    }
                });
                
                if (prayerTimes && user?.enablePrayer) {
                    const map = { Fajr: "İmsak", Sunrise: "Güneş", Dhuhr: "Öğle", Asr: "İkindi", Maghrib: "Akşam", Isha: "Yatsı" };
                    [-1, 0, 1].forEach(dayOffset => {
                        Object.keys(map).forEach(k => {
                            if(prayerTimes[k]) {
                                const [h, m] = prayerTimes[k].split(':').map(Number);
                                const tMin = (h*60+m) + (dayOffset * 1440);
                                if (tMin >= windowStart && tMin <= windowEnd) {
                                    events.push({ id: `p-${k}-${dayOffset}`, title: map[k], time: prayerTimes[k], relativeMin: tMin, displayType: "prayer" });
                                }
                            }
                        });
                    });
                }
                return events.sort((a, b) => a.relativeMin - b.relativeMin);
            }, [tasks, prayerTimes, user]);

            // --- FONKSİYONLAR ---
            const handleAddTask = () => { 
                if(!newTask.title) return; 
                setTasks([...tasks, { ...newTask, id: Date.now() }]); 
                setActiveModal(null); 
                setNewTask({ title: "", date: "", time: "", desc: "", type: "task", category: "daily" }); 
            };
            const handleAddNote = () => { 
                if(!newNote) return; 
                setNotes([{id: Date.now(), text: newNote, date: new Date().toLocaleDateString()}, ...notes]); 
                setNewNote(""); 
            };
            
            const handleAddLesson = () => {
                if(!newLesson.name || newLesson.daySchedules.length === 0) return alert("Ders adı ve günü giriniz.");
                const newSchedule = {...schedule};
                const batchId = Date.now();
                newLesson.daySchedules.forEach(ds => {
                    const startIdx = timeSlots.findIndex(t => t >= ds.startTime);
                    const endIdx = timeSlots.findIndex(t => t >= ds.endTime);
                    if(startIdx === -1) return;
                    const duration = (endIdx === -1 ? timeSlots.length : endIdx) - startIdx;
                    for(let i=0; i<duration; i++) {
                        if(startIdx+i < 13) newSchedule[ds.day][startIdx+i] = {
                            name: newLesson.name, type: newLesson.type, classroom: ds.classroom, batchId,
                            startTime: ds.startTime, endTime: ds.endTime
                        };
                    }
                });
                setSchedule(newSchedule);
                setActiveModal(null);
                setNewLesson({ name: "", type: "lisans", daySchedules: [] });
            };

            const exportData = () => {
                const data = JSON.stringify({ version: "3.6", user, tasks, schedule, timeSlots, customScores, targetScore, notes, academicCalendarLink }, null, 2); 
                const blob = new Blob([data], {type: "text/plain"}); 
                const url = URL.createObjectURL(blob); 
                const a = document.createElement('a'); a.href = url; a.download = `akademik_yedek_${new Date().toISOString().split('T')[0]}.txt`; a.click(); 
            };
            
            const importData = () => {
                const input = document.createElement('input'); input.type = 'file'; input.accept = '.txt,.json'; 
                input.onchange = (e) => { 
                    const file = e.target.files[0]; 
                    const reader = new FileReader(); 
                    reader.onload = (ev) => { 
                        try { 
                            const data = JSON.parse(ev.target.result); 
                            if(data.user) setUser(data.user); 
                            if(data.tasks) setTasks(data.tasks); 
                            if(data.schedule) setSchedule(data.schedule);
                            if(data.notes) setNotes(data.notes); 
                            if(data.academicCalendarLink) setAcademicCalendarLink(data.academicCalendarLink);
                            alert("Yedek başarıyla yüklendi!"); 
                        } catch(err) { alert("Dosya bozuk."); } 
                    }; 
                    reader.readAsText(file); 
                }; 
                input.click(); 
            };

            const exportToPDF = () => {
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    doc.setFontSize(16); doc.text(`${user.name} - Haftalık Program`, 105, 15, { align: 'center' });
                    doc.setFontSize(10); doc.text(`${user.uni}`, 105, 22, { align: 'center' });
                    let yPos = 35; const colWidth = 24; const rowHeight = 12;
                    doc.setFontSize(8); doc.text('Saat', 15, yPos);
                    Object.keys(schedule).forEach((day, i) => doc.text(day.substring(0, 3), 42 + (i * colWidth), yPos));
                    yPos += 6;
                    timeSlots.forEach((time, slotIndex) => {
                        doc.text(time, 15, yPos);
                        Object.keys(schedule).forEach((day, dayIndex) => {
                            const lesson = schedule[day][slotIndex];
                            if (lesson) {
                                const x = 40 + (dayIndex * colWidth);
                                const y = yPos - 4;
                                if (lesson.type === 'lisans') doc.setFillColor(13, 148, 136);
                                else if (lesson.type === 'yuksek') doc.setFillColor(79, 70, 229);
                                else if (lesson.type === 'doktora') doc.setFillColor(147, 51, 234);
                                else doc.setFillColor(245, 158, 11);
                                doc.rect(x, y, colWidth - 2, rowHeight - 2, 'F');
                                doc.setTextColor(255, 255, 255); doc.setFontSize(7);
                                doc.text(lesson.name.substring(0, 10), x + 1, yPos);
                            }
                        });
                        yPos += rowHeight;
                        if (yPos > 270) { doc.addPage(); yPos = 20; }
                    });
                    doc.save(`${user.name}_program.pdf`);
                } catch (err) { alert('PDF hatası: ' + err.message); }
            };

            // --- RENDER START ---
            if (!isLoaded) return null; // Loader HTML'de var, React render etmesin

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-[#0f172a]">
                        <div className="w-full max-w-md glass p-8 rounded-2xl shadow-2xl">
                            <h1 className="text-2xl font-bold text-white mb-2 text-center">Akademik Asistan</h1>
                            <p className="text-center text-slate-400 mb-6 text-sm">V3.6 FINAL • Tüm Özellikler Aktif</p>
                            <form onSubmit={(e) => { e.preventDefault(); const fd = new FormData(e.target); const u = UNIVERSITIES.find(x => x.name === fd.get('uni')); if (!u) return; setUser({ title: fd.get('title'), name: fd.get('name'), uni: u.name, city: u.city, url: u.url, enablePrayer: fd.get('enablePrayer') === 'on' }); }} className="space-y-4">
                                <select name="title" className="w-full input-dark p-3 rounded-lg">{TITLES.map(t=><option key={t} value={t}>{t}</option>)}</select>
                                <input name="name" required placeholder="Ad Soyad" className="w-full input-dark p-3 rounded-lg" />
                                <select name="uni" className="w-full input-dark p-3 rounded-lg">{UNIVERSITIES.map(u => <option key={u.name} value={u.name}>{u.name}</option>)}</select>
                                <div className="flex items-center gap-3 pt-2"><input type="checkbox" name="enablePrayer" defaultChecked className="w-5 h-5 accent-blue-500" /><span className="text-sm text-slate-300">Namaz Vakitlerini Göster</span></div>
                                <button className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl mt-2 hover:bg-blue-500 transition">BAŞLAT</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className={isScreenshotMode ? "screenshot-mode p-4" : "max-w-md mx-auto min-h-screen bg-[#0f172a] pb-24 relative shadow-2xl overflow-hidden text-slate-100"}>

                            </div>
                        </div>

                                    const windowStart = nowMin - (6 * 60);
                                    const positionPct = ((ev.relativeMin - windowStart) / 1440) * 100;
                                    if (positionPct < 0 || positionPct > 100) return null;
                                    let nodeColor = "bg-gray-500"; 
                                    if (ev.displayType === 'prayer') nodeColor = "bg-white w-0.5 h-full rounded-none top-0";
                                    else if (ev.displayType === 'daily') nodeColor = "bg-blue-500 w-3 h-3 rounded-full border-2 border-slate-900"; 
                                    return (<div key={ev.id} className={`absolute top-1/2 -translate-y-1/2 z-20 ${nodeColor}`} style={{left: `${positionPct}%`}}></div>);
                                })}
                            </div>
                        </div>
                    </div>

                        {view === 'flow' && (

                                {getTimelineEvents().slice(0, 15).map((item, i) => (
                                    <div key={i} className={`glass rounded-lg flex overflow-hidden border-l-4 ${item.displayType==='prayer'?'border-white opacity-60':'border-blue-500'}`}>
                                        <div className="flex-1 p-3 flex items-center gap-3">
                                            <div className="text-center min-w-[50px] font-mono font-bold text-lg text-slate-300">{item.time}</div>
                                            <div className="flex-1"><div className="font-bold text-sm text-white">{item.title}</div></div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* VIEW: HOME */}
                        {view === 'home' && (
                            <div className="animate-enter space-y-4">
                                <button 
                                    onClick={() => {
                                        if (!academicCalendarLink) {
                                            const link = prompt("Akademik Takvim Linki:", "https://");
                                            if (link) { setAcademicCalendarLink(link); alert("Kaydedildi!"); }
                                        } else {
                                            if(confirm("Takvime gitmek için TAMAM, linki düzenlemek için İPTAL")) window.open(academicCalendarLink, '_blank');
                                            else { const l = prompt("Yeni Link:", academicCalendarLink); if(l) setAcademicCalendarLink(l); }
                                        }

                                    className="w-full bg-slate-800 border border-slate-600 text-blue-300 p-4 rounded-xl flex items-center justify-between hover:bg-slate-700 transition shadow-lg"
                                >
                                    <div className="flex items-center gap-4">
                                        <i className="fas fa-calendar-alt text-2xl text-red-400"></i>
                                        <div className="text-left"><div className="text-xs text-slate-400">{academicCalendarLink ? 'Link Kayıtlı' : 'Link Ekle'}</div><div className="text-base font-bold text-white">Akademik Takvim</div></div>
                                    </div>
                                </button>
                                <div className="grid grid-cols-2 gap-4">
                                    <button onClick={() => setActiveModal('task')} className="bg-gradient-to-br from-blue-600 to-blue-700 text-white p-6 rounded-xl flex flex-col items-center justify-center gap-2 shadow-lg"><i className="fas fa-bell text-2xl"></i><span className="font-bold text-xs">HATIRLATICI</span></button>
                                    <button onClick={() => setActiveModal('notes')} className="bg-slate-700 text-white p-6 rounded-xl flex flex-col items-center justify-center gap-2 border border-slate-600 shadow-lg"><i className="fas fa-sticky-note text-2xl text-yellow-400"></i><span className="font-bold text-xs">NOTLAR</span></button>
                                </div>
                                <button onClick={() => setActiveModal('addLesson')} className="w-full bg-gradient-to-r from-emerald-600 to-emerald-700 p-4 rounded-xl flex items-center justify-center gap-3 hover:from-emerald-700 transition shadow-lg"><i className="fas fa-plus-circle text-xl"></i><span className="font-bold text-sm">YENİ DERS EKLE</span></button>
                            </div>
                        )}

                        {/* VIEW: SCHEDULE */}
                        {view === 'schedule' && (
                            <div className="animate-enter glass rounded-xl overflow-hidden border border-slate-700">
                                <div className="p-3 bg-slate-800/50 flex justify-between items-center no-screenshot">
                                    <div className="text-xs font-bold text-slate-400 uppercase">Haftalık Program</div>
                                    <button onClick={() => setIsScreenshotMode(!isScreenshotMode)} className="bg-blue-600 text-white px-3 py-1.5 rounded text-[10px] font-bold">Ekran Görüntüsü</button>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-xs border-collapse">
                                        <thead className="bg-slate-900 text-slate-400"><tr><th className="p-2 w-16 border border-slate-800 text-center">Saat</th>{Object.keys(schedule).map(d=><th key={d} className="p-2 min-w-[80px] border border-slate-800 text-center">{d.substring(0,3)}</th>)}</tr></thead>
                                        <tbody>
                                            {timeSlots.map((t, i) => (
                                                <tr key={i} className="hover:bg-white/5">
                                                    <td className="p-1 border border-slate-800 text-center"><input className="w-full bg-transparent text-center text-slate-500 font-mono" value={t} onChange={e=>{const n=[...timeSlots];n[i]=e.target.value;setTimeSlots(n)}} /></td>
                                                    {Object.keys(schedule).map(d => { 
                                                        const l = schedule[d][i]; 
                                                        return (
                                                            <td key={d} className="p-1 border border-slate-800 h-12 relative cursor-pointer" onClick={()=>{ setEditingLesson({day:d, index:i, data: l || {name:"",type:"lisans"}}); setActiveModal('lesson'); }}>
                                                                {l && <div className={`w-full h-full rounded flex flex-col items-center justify-center text-center p-1 text-[9px] font-bold shadow-sm ${LESSON_TYPES[l.type].className}`}>{l.name}<br/>{l.classroom}</div>}
                                                            </td>
                                                        )
                                                    })}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                         {/* VIEW: PROMOTION */}
                         {view === 'promotion' && (
                            <div className="animate-enter glass p-4 rounded-xl border border-blue-500/20">
                                <div className="flex justify-between items-center mb-4"><h3 className="font-bold text-slate-300 text-sm">PUAN CETVELİ</h3><button onClick={() => setCustomScores([...customScores, {id:Date.now(), name:"", value:0, count:0}])} className="text-[10px] bg-blue-600 text-white px-3 py-1.5 rounded">Ekle</button></div>
                                <div className="space-y-2">
                                    {customScores.map(s => (
                                        <div key={s.id} className="grid grid-cols-12 gap-2 items-center bg-slate-900/50 p-2 rounded border border-slate-700">
                                            <div className="col-span-5"><input className="w-full bg-transparent text-sm" placeholder="Faaliyet" value={s.name} onChange={e=>setCustomScores(customScores.map(x=>x.id===s.id?{...x,name:e.target.value}:x))} /></div>
                                            <div className="col-span-2"><input type="number" className="w-full bg-slate-900 text-center text-xs" value={s.value} onChange={e=>setCustomScores(customScores.map(x=>x.id===s.id?{...x,value:e.target.value}:x))} /></div>
                                            <div className="col-span-2"><input type="number" className="w-full bg-slate-900 text-center text-xs text-white font-bold" value={s.count} onChange={e=>setCustomScores(customScores.map(x=>x.id===s.id?{...x,count:e.target.value}:x))} /></div>
                                            <div className="col-span-2 text-center text-xs font-bold text-blue-400">{(parseInt(s.value)||0) * (parseInt(s.count)||0)}</div>
                                            <div className="col-span-1 text-right"><button onClick={()=>setCustomScores(customScores.filter(x=>x.id!==s.id))} className="text-red-400"><i className="fas fa-trash-alt"></i></button></div>
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-6 bg-slate-900 p-4 rounded-xl border border-slate-700 shadow-xl">
                                    <div className="flex justify-between items-center mb-4"><span className="text-xs text-slate-400 uppercase font-bold">Hedef Puan:</span><input type="number" className="w-20 bg-slate-900 border border-slate-600 rounded p-1 text-center text-sm font-bold text-white" value={targetScore} onChange={e => setTargetScore(parseInt(e.target.value)||0)} /></div>
                                    <div className="h-3 bg-slate-900 rounded-full overflow-hidden mb-2 border border-slate-700/50"><div className="h-full bg-emerald-500" style={{width: `${Math.min((customScores.reduce((a,b)=>a+((b.value||0)*(b.count||0)),0)/targetScore)*100, 100)}%`}}></div></div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Navigation */}
                    <div className="fixed bottom-0 w-full max-w-md bg-slate-900/95 backdrop-blur border-t border-slate-800 flex justify-around py-4 z-50 no-screenshot">
                        {[{id: 'flow', icon: 'stream', label: 'Akış'},{id: 'home', icon: 'home', label: 'Ev'},{id: 'schedule', icon: 'table', label: 'Ders'},{id: 'promotion', icon: 'chart-pie', label: 'Puan'}].map(t => (<button key={t.id} onClick={() => setView(t.id)} className={`flex flex-col items-center gap-1 ${view === t.id ? 'text-blue-400' : 'text-slate-500'}`}><i className={`fas fa-${t.icon} text-lg`}></i><span className="text-[10px] uppercase font-bold">{t.label}</span></button>))}
                    </div>

                    {/* Pomodoro */}
                    {!isScreenshotMode && <button onClick={() => setPomodoro(prev => ({...prev, active: !prev.active}))} className={`fixed bottom-24 left-4 z-50 w-12 h-12 rounded-full flex items-center justify-center shadow-lg border border-slate-700 ${pomodoro.active ? 'bg-yellow-400 animate-pulse text-black' : 'bg-slate-800 text-slate-400'}`}>{pomodoro.active ? <span className="text-xs font-bold">{Math.floor(pomodoro.time/60)}:{String(pomodoro.time%60).padStart(2,'0')}</span> : <i className="fas fa-stopwatch text-xl"></i>}</button>}

                    {/* Modals */}
                    {activeModal === 'task' && (
                        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-800 w-full max-w-sm rounded-xl p-6 shadow-2xl">
                                <h3 className="font-bold mb-4">Yeni Görev</h3>

                                    <input type="date" className="input-dark p-2 rounded flex-1" value={newTask.date} onChange={e=>setNewTask({...newTask,date:e.target.value})} />
                                    <input type="time" className="input-dark p-2 rounded flex-1" value={newTask.time} onChange={e=>setNewTask({...newTask,time:e.target.value})} />
                                </div>
                                <select className="w-full input-dark p-2 mb-4 rounded" value={newTask.category} onChange={e=>setNewTask({...newTask,category:e.target.value})}>

                                </select>
                                <div className="flex gap-2"><button onClick={()=>setActiveModal(null)} className="flex-1 bg-slate-600 py-2 rounded">İptal</button><button onClick={handleAddTask} className="flex-1 bg-blue-600 py-2 rounded font-bold">Ekle</button></div>

                    {activeModal === 'notes' && (

                                        <div key={i} className="bg-slate-900 p-2 mb-1 rounded text-xs space-y-1">
                                            <div className="flex justify-between"><select value={ds.day} onChange={e=>{const n=[...newLesson.daySchedules];n[i].day=e.target.value;setNewLesson({...newLesson,daySchedules:n})}} className="bg-slate-800 rounded">{DAYS_TR.map(d=><option key={d}>{d}</option>)}</select><button onClick={()=>{const n=[...newLesson.daySchedules];n.splice(i,1);setNewLesson({...newLesson,daySchedules:n})}} className="text-red-400">Sil</button></div>
                                            <div className="flex gap-1"><input type="time" value={ds.startTime} onChange={e=>{const n=[...newLesson.daySchedules];n[i].startTime=e.target.value;setNewLesson({...newLesson,daySchedules:n})}} className="bg-slate-800 w-16" /><input type="time" value={ds.endTime} onChange={e=>{const n=[...newLesson.daySchedules];n[i].endTime=e.target.value;setNewLesson({...newLesson,daySchedules:n})}} className="bg-slate-800 w-16" /><input placeholder="Sınıf" value={ds.classroom} onChange={e=>{const n=[...newLesson.daySchedules];n[i].classroom=e.target.value;setNewLesson({...newLesson,daySchedules:n})}} className="bg-slate-800 flex-1" /></div>
                                        </div>
                                    ))}
                                </div>
                                <div className="flex gap-2"><button onClick={()=>setActiveModal(null)} className="flex-1 bg-slate-600 py-2 rounded">İptal</button><button onClick={handleAddLesson} className="flex-1 bg-emerald-600 py-2 rounded font-bold">Kaydet</button></div>
                            </div>
                        </div>
                    )}
                    
                    {activeModal === 'settings' && (
                        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-800 w-full max-w-sm rounded-xl p-6">
                                <div className="flex justify-between mb-4"><h3 className="font-bold">Ayarlar</h3><button onClick={()=>setActiveModal(null)}>X</button></div>
                                <div className="space-y-2">
                                    <button onClick={exportData} className="w-full bg-green-800 py-2 rounded text-xs">Yedek Al (.txt)</button>
                                    <div className="relative"><button className="w-full bg-blue-800 py-2 rounded text-xs">Yedek Yükle</button><input type="file" onChange={importData} className="absolute inset-0 opacity-0" /></div>
                                    <button onClick={exportToPDF} className="w-full bg-red-800 py-2 rounded text-xs">Renkli PDF İndir</button>
                                    <button onClick={()=>{localStorage.clear(); location.reload();}} className="w-full bg-slate-700 py-2 rounded text-xs text-red-400">Verileri Sıfırla (Reset)</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
