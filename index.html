<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APK Test - Minimal</title>
    <script crossorigin src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            background: #1e293b;
            border-radius: 10px;
        }
        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background: #3b82f6;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:active {
            background: #2563eb;
        }
        #loader {
            position: fixed;
            inset: 0;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #94a3b8;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="loader">Yükleniyor...</div>
    <div id="root"></div>

    <script>
        // BABEL YOK - Sadece vanilla React.createElement
        
        function App() {
            const [count, setCount] = React.useState(0);
            
            return React.createElement('div', { className: 'container' },
                React.createElement('h1', null, '✅ APK ÇALIŞIYOR!'),
                React.createElement('p', null, 'React başarıyla yüklendi.'),
                React.createElement('p', null, 'Sayaç: ' + count),
                React.createElement('button', {
                    onClick: function() { setCount(count + 1); }
                }, 'Artır'),
                React.createElement('button', {
                    onClick: function() { setCount(0); }
                }, 'Sıfırla'),
                React.createElement('p', { style: { fontSize: '12px', marginTop: '20px', opacity: 0.6 }}, 
                    'Eğer bunu görüyorsanız, APK çalışıyor demektir.')
            );
        }
        
        // Başlat
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM Ready');
            
            setTimeout(function() {
                try {
                    if (typeof React !== 'undefined' && typeof ReactDOM !== 'undefined') {
                        console.log('React yüklendi, başlatılıyor...');
                        ReactDOM.render(
                            React.createElement(App, null),
                            document.getElementById('root')
                        );
                        
                        // Loader'ı kaldır
                        document.getElementById('loader').classList.add('hidden');
                        console.log('App başarıyla render edildi');
                    } else {
                        console.error('React yüklenemedi');
                        document.getElementById('loader').textContent = 'HATA: React yüklenemedi';
                    }
                } catch(err) {
                    console.error('Başlatma hatası:', err);
                    document.getElementById('loader').textContent = 'HATA: ' + err.message;
                }
            }, 1000);
        });
    </script>
</body>
</html>
