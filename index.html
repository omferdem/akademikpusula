    <script>
    // ============================================================
    // EXPO NATIVE BRIDGE - React Native WebView ile haberleşme
    // ============================================================
    
    // Listen for native messages - both methods for Android
    function handleNativeMessage(event) {
        try {
            var msg = JSON.parse(event.data);
            if (msg.type === 'IMPORT_DATA' && msg.data) {
                // Native dosya seçiminden gelen veriyi işle
                try {
                    var data = JSON.parse(msg.data);
                    if(data.user) { localStorage.setItem('user_v48', JSON.stringify(data.user)); }
                    if(data.tasks) { localStorage.setItem('tasks_v48', JSON.stringify(data.tasks)); }
                    if(data.completedTasks) { localStorage.setItem('completed_tasks_v48', JSON.stringify(data.completedTasks)); }
                    if(data.schedule) { localStorage.setItem('schedule_v49', JSON.stringify(data.schedule)); }
                    if(data.customScores) { localStorage.setItem('scores_v48', JSON.stringify(data.customScores)); }
                    if(data.notes) { localStorage.setItem('notes_v48', JSON.stringify(data.notes)); }
                    if(data.academicCalendarUrl) { localStorage.setItem('academic_calendar_url_v48', JSON.stringify(data.academicCalendarUrl)); }
                    alert("✅ Backup loaded successfully! Reloading app...");
                    setTimeout(function() { window.location.reload(); }, 1000);
                } catch(err) {
                    alert("❌ Error: File corrupted or invalid format.");
                }
            } else if (msg.type === 'IMPORT_ERROR') {
                alert("❌ Could not open file: " + (msg.error || 'Unknown error'));
            } else if (msg.type === 'EXPORT_SUCCESS') {
                alert("✅ Backup saved and share menu opened.");
            } else if (msg.type === 'PHOTO_SELECTED' && msg.images) {
                if (window.__addPhotos) window.__addPhotos(msg.images);
            }
        } catch(e) { console.error('Bridge hata:', e); }
    }
    
    // Android ve iOS için her iki event dinleyiciyi ekle
    window.addEventListener('message', handleNativeMessage);
    document.addEventListener('message', handleNativeMessage);
    
    // Native'e mesaj gönder (güvenli wrapper)
    function sendToNative(message) {
        try {
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify(message));
                return true;
            }
            return false;
        } catch(e) {
            return false;
        }
    }
    
    // Uygulama yüklenince tüm bildirimleri planla
    window.addEventListener('load', function() {
        setTimeout(function() {
            sendToNative({ type: 'APP_READY' });
            scheduleAllNotifications();
        }, 2000);
    });
    
    // Geri tuşu native'den gelince React'a ilet
    window.addEventListener('popstate', function() {
        if (window.__reactNavigateBack) window.__reactNavigateBack();
    });

    // Tüm görev bildirimlerini planla (10 dk önce)
    function scheduleAllNotifications() {
        try {
            var tasks = JSON.parse(localStorage.getItem('tasks_v48') || '[]');
            var schedule = JSON.parse(localStorage.getItem('schedule_v49') || '{}');
            var now = new Date();
            var minTime = new Date(now.getTime() + 11 * 60 * 1000); // en az 11 dk sonrası
            
            // Filter only genuinely future tasks (date + time based)
            var upcoming = tasks.filter(function(t) {
                if (!t.date || !t.time || !t.title) return false;
                var parts = t.time.split(':');
                var taskDate = new Date(t.date + 'T00:00:00');
                taskDate.setHours(parseInt(parts[0]), parseInt(parts[1]), 0, 0);
                return taskDate.getTime() > minTime.getTime();
            });
            
            // Build notifications from weekly schedule (7 days)
            var dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
            var timeSlots = JSON.parse(localStorage.getItem('timeslots_v49') || '["08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00","21:00","22:00","23:00"]');
            
            for (var dayOffset = 0; dayOffset < 7; dayOffset++) {
                var d = new Date(now);
                d.setDate(d.getDate() + dayOffset);
                var dayKey = dayNames[d.getDay()];
                var dateStr = d.toISOString().split('T')[0];
                var dayLessons = schedule[dayKey];
                if (dayLessons) {
                    dayLessons.forEach(function(lesson, i) {
                        if (lesson && lesson.name && timeSlots[i]) {
                            var lessonTime = lesson.startTime || timeSlots[i];
                            upcoming.push({
                                id: 'lesson-' + dayOffset + '-' + i,
                                title: '📚 ' + lesson.name + (lesson.classroom ? ' (' + lesson.classroom + ')' : ''),
                                date: dateStr,
                                time: lessonTime
                            });
                        }
                    });
                }
            }
            
            // Namaz vakitlerini de ekle (bugün ve yarın)
            try {
                var prayerData = localStorage.getItem('prayer_cache_v48');
                var prayerMap = {'Fajr':'Fajr','Sunrise':'Sunrise','Dhuhr':'Dhuhr','Asr':'Asr','Maghrib':'Maghrib','Isha':'Isha'};
                if (prayerData) {
                    var pt = JSON.parse(prayerData);
                    var todayStr = now.toISOString().split('T')[0];
                    var tomorrow = new Date(now); tomorrow.setDate(tomorrow.getDate() + 1);
                    var tomorrowStr = tomorrow.toISOString().split('T')[0];
                    Object.keys(prayerMap).forEach(function(k) {
                        if (pt[k]) {
                            var time = pt[k].substring(0, 5); // HH:MM
                            upcoming.push({ id: 'prayer-today-' + k, title: '🕌 ' + prayerMap[k] + ' Prayer', date: todayStr, time: time });
                            upcoming.push({ id: 'prayer-tmrw-' + k, title: '🕌 ' + prayerMap[k] + ' Prayer', date: tomorrowStr, time: time });
                        }
                    });
                }
            } catch(pe) {}
            
            if (upcoming.length > 0) {
                sendToNative({ type: 'SCHEDULE_FUTURE_NOTIFICATIONS', tasks: upcoming, sound: localStorage.getItem('notif_sound_v48') ? JSON.parse(localStorage.getItem('notif_sound_v48')) : 'default' });
            }
        } catch(e) { console.error('scheduleAllNotifications hata:', e); }
    }
    </script>

                                            className="w-full input-dark p-3 rounded" 
                                            placeholder="e.g. Algorithms & Data Structures"
                                            value={lessonName} 
                                            onChange={e => setLessonName(e.target.value)} 
                                        />
                                    </div>

                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">Course Type *</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            {Object.entries(LESSON_TYPES).map(([k, v]) => (
                                                <button 
                                                    key={k} 
                                                    onClick={() => setLessonType(k)} 
                                                    className={`p-3 rounded border text-xs font-bold transition ${lessonType === k ? 'ring-2 ring-white scale-105' : 'opacity-70'} ${v.btnClass}`}
                                                >
                                                    {v.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <div className="flex justify-between items-center mb-2">
                                            <label className="text-xs text-slate-400">Time Slots ({lessonSlots.length})</label>
                                            <button 
                                                onClick={addLessonSlot}
                                                className="text-xs bg-emerald-600 text-white px-3 py-1 rounded hover:bg-emerald-500"
                                            >
                                                <i className="fas fa-plus mr-1"></i>Add
                                            </button>
                                        </div>
                                        
                                        <div className="space-y-3 max-h-60 overflow-y-auto">
                                            {lessonSlots.map((slot, idx) => (
                                                <div key={slot.id} className="bg-slate-900/50 p-3 rounded border border-slate-700">
                                                    <div className="flex justify-between items-center mb-2">
                                                        <span className="text-xs text-slate-400 font-bold">#{idx + 1}</span>
                                                        {lessonSlots.length > 1 && (
                                                            <button 
                                                                onClick={() => removeLessonSlot(slot.id)}
                                                                className="text-red-400 hover:text-red-300 text-xs"
                                                            >
                                                                <i className="fas fa-trash"></i>
                                                            </button>
                                                        )}
                                                    </div>
                                                    
                                                    <div className="space-y-2">
                                                        <select 
                                                            className="w-full input-dark p-2 rounded text-sm"
                                                            value={slot.day}
                                                            onChange={(e) => updateLessonSlot(slot.id, 'day', e.target.value)}
                                                        >
                                                            {DAYS_EN.map(day => <option key={day} value={day}>{day}</option>)}
                                                        </select>
                                                        
                                                        <div className="grid grid-cols-2 gap-2">
                                                            <input 
                                                                type="time" 
                                                                className="w-full input-dark p-2 rounded text-sm" 
                                                                value={slot.startTime}
                                                                onChange={(e) => updateLessonSlot(slot.id, 'startTime', e.target.value)}
                                                            />
                                                            <input 
                                                                type="time" 
                                                                className="w-full input-dark p-2 rounded text-sm" 
                                                                value={slot.endTime}
                                                                onChange={(e) => updateLessonSlot(slot.id, 'endTime', e.target.value)}
                                                            />
                                                        </div>
                                                        
                                                        <input 
                                                            className="w-full input-dark p-2 rounded text-sm" 
                                                            placeholder="Classroom (e.g. A101)"
                                                            value={slot.classroom}
                                                            onChange={(e) => updateLessonSlot(slot.id, 'classroom', e.target.value)}
                                                        />
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <div className="flex gap-2 mt-6">
                                    <button 
                                        onClick={() => {
                                            setActiveModal(null);
                                            setLessonSlots([{ id: Date.now(), day: "Monday", startTime: "09:00", endTime: "10:00", classroom: "" }]);
                                            setLessonName("");
                                            setLessonType("lisans");
                                        }} 
                                        className="flex-1 py-3 rounded bg-slate-700 text-slate-400 hover:bg-slate-600"
                                    >
                                        Cancel
                                    </button>
                                    <button 
                                        onClick={handleAddMultiLesson} 
                                        className="flex-1 py-3 rounded bg-emerald-600 text-white font-bold hover:bg-emerald-500"
                                    >
                                        <i className="fas fa-check mr-2"></i>
                                        Dersi Ekle
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* AI ARAÇLARI MODAL */}
                    {activeModal === 'aiLinks' && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[70] flex items-center justify-center p-4 animate-enter no-screenshot">
                            <div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl max-h-[85vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-white font-bold flex items-center gap-2"><i className="fas fa-robot text-violet-400"></i> AI Tools</h3>
                                    <button onClick={() => { setActiveModal(null); setEditingAiLinkId(null); }} className="text-slate-400 hover:text-white"><i className="fas fa-times"></i></button>
                                </div>
                                
                                <div className="space-y-2">
                                    {aiLinks.map((link) => (
                                        <div key={link.id}>
                                            {editingAiLinkId === link.id ? (
                                                <div className="bg-slate-700 p-3 rounded-lg border border-violet-500">
                                                    <div className="space-y-2">
                                                        <input 
                                                            type="text"
                                                            className="w-full input-dark p-2 rounded text-sm"
                                                            placeholder="Button name..."
                                                            value={tempAiLinkName}
                                                            onChange={(e) => setTempAiLinkName(e.target.value)}
                                                        />
                                                        <input 
                                                            type="url"
                                                            className="w-full input-dark p-2 rounded text-sm"
                                                            placeholder="https://..."
                                                            value={tempAiLinkUrl}
                                                            onChange={(e) => setTempAiLinkUrl(e.target.value)}
                                                        />
                                                        <div className="flex gap-2">
                                                            <button onClick={saveAiLink} className="flex-1 bg-violet-600 text-white py-2 rounded text-sm hover:bg-violet-500">
                                                                <i className="fas fa-check mr-1"></i> Save
                                                            </button>
                                                            <button onClick={() => { setEditingAiLinkId(null); setTempAiLinkName(""); setTempAiLinkUrl(""); }} className="flex-1 bg-slate-600 text-white py-2 rounded text-sm hover:bg-slate-500">Cancel</button>
                                                            <button onClick={() => { if(confirm("Are you sure you want to delete this AI tool?")) { setAiLinks(aiLinks.filter(l => l.id !== editingAiLinkId)); setEditingAiLinkId(null); } }} className="bg-red-700 text-white py-2 px-3 rounded text-sm hover:bg-red-600"><i className="fas fa-trash"></i></button>
                                                        </div>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="relative group">
                                                    <button 
                                                        onClick={() => handleAiLinkClick(link)}
                                                        className={`w-full bg-gradient-to-r ${link.color} p-3 rounded-lg text-white flex items-center justify-between hover:opacity-90 transition shadow`}
                                                    >
                                                        <div className="flex items-center gap-3">
                                                            <i className={`fas fa-${link.icon} text-lg`}></i>
                                                            <span className="font-semibold text-sm">{link.name}</span>
                                                        </div>
                                                        <i className="fas fa-external-link-alt text-xs opacity-70"></i>
                                                    </button>
                                                    <button 
                                                        onClick={(e) => { e.stopPropagation(); startEditAiLink(link); }}
                                                        className="absolute right-2 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 transition bg-white/20 hover:bg-white/30 text-white w-8 h-8 rounded-full flex items-center justify-center z-10"
                                                    >
                                                        <i className="fas fa-edit text-xs"></i>
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                                
                                <div className="mt-4 pt-4 border-t border-slate-700">
                                    <button 
                                        onClick={() => {
                                            const newLink = {id: Date.now(), name: "New AI Tool", url: "", icon: "robot", color: "from-slate-600 to-slate-700"};
                                            setAiLinks([...aiLinks, newLink]);
                                            setEditingAiLinkId(newLink.id);
                                            setTempAiLinkName("New AI Tool");
                                            setTempAiLinkUrl("");
                                        }}
                                        className="w-full bg-slate-700 hover:bg-slate-600 border border-dashed border-slate-500 text-slate-300 py-3 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition mb-3"
                                    >
                                        <i className="fas fa-plus"></i> Add New AI Tool
                                    </button>
                                    <p className="text-[10px] text-slate-500 text-center"><i className="fas fa-info-circle mr-1"></i>Swipe the button to access the edit icon</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* AYARLAR MODAL */}
                    {activeModal === 'p2pdf' && (
                        <P2PdfModal
                            images={p2pdfImages}
                            setImages={setP2pdfImages}
                            onClose={() => { setActiveModal(null); setP2pdfImages([]); }}
                            sendToNative={sendToNative}
                        />
                    )}

                    {activeModal === 'settings' && (<div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[70] flex items-center justify-center p-4 animate-enter no-screenshot"><div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl relative"><button onClick={() => setActiveModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-white"><i className="fas fa-times"></i></button><h3 className="text-white font-bold mb-4">Settings</h3><form onSubmit={handleUpdateUser} className="space-y-4"><div><label className="text-xs text-slate-400">Title</label><select name="title" defaultValue={user.title} className="w-full input-dark p-3 rounded-lg">{TITLES.map(t=><option key={t} value={t}>{t}</option>)}</select></div><div><label className="text-xs text-slate-400">Full Name</label><input name="name" defaultValue={user.name} required className="w-full input-dark p-3 rounded-lg" /></div><div><label className="text-xs text-slate-400">University</label><input name="uni" defaultValue={user.uni} placeholder="University Name" className="w-full input-dark p-3 rounded-lg" /></div><div><label className="text-xs text-slate-400">University URL</label><input name="uniUrl" defaultValue={user.uniUrl} placeholder="https://..." className="w-full input-dark p-3 rounded-lg" /></div><div className="grid grid-cols-2 gap-2"><div><label className="text-xs text-slate-400">Country</label><input name="country" defaultValue={user.country} required placeholder="e.g. Turkey" className="w-full input-dark p-3 rounded-lg" /></div><div><label className="text-xs text-slate-400">City</label><input name="city" defaultValue={user.city} required placeholder="e.g. Ankara" className="w-full input-dark p-3 rounded-lg" /></div></div><div className="flex items-center gap-3 pt-2"><input type="checkbox" name="enablePrayer" defaultChecked={user.enablePrayer} className="w-5 h-5 accent-blue-500" /><span className="text-sm text-slate-300">Show Prayer Times</span></div><button className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-500">Save</button></form><hr className="border-slate-700 my-4" />
                                <div className="mb-4">
                                    <label className="text-xs text-slate-400 block mb-2">🔔 Notification Sound</label>
                                    <div className="grid grid-cols-2 gap-2">
                                        {[
                                            {id:'default', label:'🔔 Default'},
                                            {id:'alarm', label:'⏰ Alarm'},
                                            {id:'chime', label:'🎵 Chime'},
                                            {id:'silent', label:'🔇 Silent'},
                                        ].map(s => (
                                            <button 
                                                key={s.id}
                                                onClick={() => { setNotifSound(s.id); sendToNative({type:'SET_NOTIF_SOUND', sound: s.id}); }}
                                                className={`p-2 rounded text-xs font-bold border transition ${notifSound===s.id ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-700 border-slate-600 text-slate-300 hover:bg-slate-600'}`}
                                            >{s.label}</button>
                                        ))}
                                    </div>
                                </div>
                                <hr className="border-slate-700 my-4" /><div className="flex gap-2"><button onClick={exportData} className="flex-1 bg-green-900/50 border border-green-800 text-green-100 text-xs py-2 rounded hover:bg-green-800">Download Backup (.json)</button><button onClick={importData} className="flex-1 bg-blue-900/50 border border-blue-800 text-blue-100 text-xs py-2 rounded hover:bg-blue-800">Import Backup</button></div></div></div>)}
                    
                    {/* GÖREV EKLEME/DÜZENLEME MODAL */}
                    {activeModal === 'task' && (<div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4 animate-enter no-screenshot"><div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl max-h-[90vh] overflow-y-auto"><h3 className="text-white font-bold mb-4">{editingTask ? 'Edit Task' : 'New Reminder'}</h3><div className="space-y-3"><input className="w-full input-dark p-3 rounded" placeholder="Title" value={newTask.title} onChange={e=>{setNewTask({...newTask,title:e.target.value}); setConflictWarn(null);}} /><div className="grid grid-cols-2 gap-2"><select className="w-full input-dark p-3 rounded" value={newTask.category} onChange={e=>setNewTask({...newTask,category:e.target.value})}><option value="daily">Daily Task (Blue)</option><option value="academic">Academic (Red)</option><option value="official">Official Meeting (Yellow)</option><option value="special">Special Day (Pink - Annual)</option></select><input type="time" className="w-full input-dark p-3 rounded" value={newTask.time} onChange={e=>{setNewTask({...newTask,time:e.target.value}); setConflictWarn(null);}} /></div><input type="date" className="w-full input-dark p-3 rounded" value={newTask.date} onChange={e=>{setNewTask({...newTask,date:e.target.value}); setConflictWarn(null);}} /><textarea className="w-full input-dark p-3 rounded h-20 resize-none" placeholder="Description..." value={newTask.desc} onChange={e=>setNewTask({...newTask,desc:e.target.value})}></textarea>{newTask.category !== 'special' && (<div className="bg-slate-900/50 p-3 rounded-lg border border-slate-700"><div className="mb-2"><span className="text-xs text-slate-300 font-bold">Recurring Option</span></div><select className="w-full input-dark p-2 rounded text-sm" value={recurringType} onChange={e=>setRecurringType(e.target.value)} disabled={!!editingTask}><option value="none">No Recurrence</option><option value="weekly">Weekly</option><option value="biweekly">Biweekly</option><option value="monthly">Monthly</option></select>{recurringType !== "none" && recurringType !== "monthly" && (<div className="flex items-center gap-2 mt-2 animate-enter"><span className="text-[10px] text-slate-400">How Many?</span><input type="number" value={recurringWeeks} onChange={e=>setRecurringWeeks(parseInt(e.target.value))} className="w-16 bg-slate-900 border border-slate-600 rounded p-1 text-center text-white text-xs" /></div>)}{recurringType === "monthly" && (<p className="text-[10px] text-slate-400 mt-2">Will repeat monthly for 12 months</p>)}</div>)}{newTask.category === 'special' && (<div className="bg-pink-900/20 p-3 rounded-lg border border-pink-700"><p className="text-xs text-pink-300"><i className="fas fa-info-circle mr-1"></i>Special days automatically repeat every year</p></div>)}</div><div className="flex gap-2 mt-4"><button onClick={()=>{setActiveModal(null); setEditingTask(null); setNewTask({title:"", date:"", time:"", desc:"", type:"task", category:"daily"}); setRecurringType("none");}} className="flex-1 py-3 rounded bg-slate-700 text-slate-400 hover:bg-slate-600">Cancel</button><button onClick={handleAddTask} className={`flex-1 py-3 rounded text-white font-bold transition ${conflictWarn ? 'bg-red-600 hover:bg-red-700 animate-pulse' : 'bg-blue-600 hover:bg-blue-500'}`}>{conflictWarn ? '⚠️ Add Anyway?' : (editingTask ? 'Update' : 'Save')}</button></div>{conflictWarn && <div className="mt-2 text-center text-xs text-red-300 bg-red-900/20 p-2 rounded">{conflictWarn}</div>}</div></div>)}
                    
                    {/* NOTLAR MODAL */}
                    {activeModal === 'notes' && (<div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4 animate-enter no-screenshot"><div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl h-[60vh] flex flex-col"><div className="flex justify-between mb-4"><h3 className="text-white font-bold">Notebook</h3><button onClick={()=>setActiveModal(null)}><i className="fas fa-times text-slate-400"></i></button></div><div className="flex gap-2 mb-4"><input className="flex-1 input-dark p-2 rounded" placeholder="Your note..." value={newNote} onChange={e=>setNewNote(e.target.value)} /><button onClick={handleAddNote} className="bg-blue-600 px-4 rounded text-white"><i className="fas fa-plus"></i></button></div><div className="flex-1 overflow-y-auto space-y-2">{notes.map(n=><div key={n.id} className="bg-slate-700 p-3 rounded flex justify-between items-start"><div><p className="text-sm text-white">{n.text}</p><p className="text-[10px] text-slate-400">{n.date}</p></div><button onClick={()=>setNotes(notes.filter(x=>x.id!==n.id))} className="text-red-400"><i className="fas fa-trash"></i></button></div>)}</div></div></div>)}
                    
                    {/* DERS DÜZENLEME MODALI */}
                    {activeModal === 'lesson' && editingLesson && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4 animate-enter no-screenshot">
                            <div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl max-h-[90vh] overflow-y-auto">
                                <h3 className="text-white font-bold mb-4">Edit Course</h3>
                                
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">Course Name</label>
                                        <input 
                                            className="w-full input-dark p-3 rounded" 
                                            value={editingLesson.data.name} 
                                            onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,name:e.target.value}})} 
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-xs text-slate-400 block mb-1">Start</label>
                                            <input 
                                                type="time" 
                                                className="w-full input-dark p-3 rounded" 
                                                value={editingLesson.data.startTime || ""} 
                                                onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,startTime:e.target.value}})} 
                                            />
                                        </div>
                                        <div>
                                            <label className="text-xs text-slate-400 block mb-1">End</label>
                                            <input 
                                                type="time" 
                                                className="w-full input-dark p-3 rounded" 
                                                value={editingLesson.data.endTime || ""} 
                                                onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,endTime:e.target.value}})} 
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">Classroom</label>
                                        <input 
                                            className="w-full input-dark p-3 rounded" 
                                            placeholder="e.g. A101" 
                                            value={editingLesson.data.classroom || ""} 
                                            onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,classroom:e.target.value}})} 
                                        />
                                    </div>

                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">Duration (Hours)</label>
                                        <input 
                                            type="number" 
                                            min="1" 
                                            max="8" 
                                            className="w-full input-dark p-3 rounded" 
                                            value={editingLesson.data.duration || ""} 
                                            onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,duration:e.target.value}})} 
                                        />
                                    </div>

                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">Type (Color)</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            {Object.entries(LESSON_TYPES).map(([k,v])=>(
                                                <button 
                                                    key={k} 
                                                    onClick={()=>setEditingLesson({...editingLesson,data:{...editingLesson.data,type:k}})} 
                                                    className={`p-2 rounded border text-xs font-bold transition ${editingLesson.data.type===k?'ring-2 ring-white scale-105':'opacity-80'} ${v.btnClass}`}
                                                >
                                                    {v.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-3 gap-2 mt-6">
                                    <button 
                                        onClick={() => {setActiveModal(null); setEditingLesson(null);}}
                                        className="py-3 rounded bg-slate-700 text-slate-400 hover:bg-slate-600"
                                    >
                                        Cancel
                                    </button>
                                    <button 
                                        onClick={deleteLesson} 
                                        className="py-3 rounded bg-red-900/50 text-red-400 hover:bg-red-900/70 border border-red-800"
                                    >
                                        Delete
                                    </button>
                                    <button 
                                        onClick={saveLesson} 
                                        className="py-3 rounded bg-blue-600 text-white font-bold hover:bg-blue-500"
                                    >
                                        Save
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* GÜN DETAY MODALI */}
                    {activeModal === 'dayDetail' && dayDetailData && (<div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[70] flex items-center justify-center p-4 animate-enter no-screenshot"><div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl max-h-[80vh] overflow-y-auto"><div className="flex justify-between items-center mb-4"><h3 className="text-white font-bold">{dayDetailData.date} Details</h3><button onClick={() => { setActiveModal(null); setDayDetailData(null); }} className="text-slate-400 hover:text-white"><i className="fas fa-times"></i></button></div><div className="space-y-3">{dayDetailData.events.map((ev, i) => (<div key={i} className={`p-3 rounded border-l-4 flex justify-between items-center ${ev.category==='academic'?'bg-red-900/30 border-red-500': ev.category==='official'?'bg-amber-900/30 border-amber-500': ev.category==='special'?'bg-pink-900/30 border-pink-500':'bg-blue-900/30 border-blue-500'}`} onClick={() => { if(ev.origin === 'personal' && !ev.isRecurring) { openEditTask(ev); setDayDetailData(null); } }}><div><div className="text-sm font-bold text-white">{ev.event}{ev.isRecurring && <span className="text-[10px] ml-2 bg-pink-600 px-2 py-0.5 rounded">Recurring</span>}</div>{ev.time && <div className="text-xs text-slate-400 mt-1"><i className="far fa-clock mr-1"></i>{ev.time}</div>}<div className="text-[10px] text-slate-500 mt-1 uppercase">{ev.origin}</div></div>{ev.origin === 'personal' && !ev.isRecurring && <button onClick={(e) => deleteTask(e, ev.id)} className="text-red-400 hover:text-red-300 px-2 ml-2"><i className="fas fa-trash"></i></button>}</div>))}</div><div className="mt-6 pt-4 border-t border-slate-700"><button onClick={() => { setNewTask({ title: "", date: dayDetailData.date, time: "09:00", desc: "", type: "task", category: "daily" }); setActiveModal('task'); }} className="w-full bg-slate-700 text-white py-2 rounded-lg text-sm hover:bg-slate-600 transition flex items-center justify-center gap-2"><i className="fas fa-plus"></i> Add Reminder to This Day</button></div></div></div>)}
                </div>
            );
        }; // App fonksiyon kapanışı
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
