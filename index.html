<body>

        <h2 style="color:white; margin-top:20px; font-weight:bold; font-size:20px; letter-spacing:2px;">ZAPHYROS</h2>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, Component } = React;

        class ErrorBoundary extends Component {
            constructor(props) { super(props); this.state = { hasError: false, errorMsg: '' }; }
            static getDerivedStateFromError(error) { return { hasError: true, errorMsg: error.message }; }
            componentDidCatch(error, info) { console.error("Yakalanan Hata:", error); }
            render() {
                if (this.state.hasError) return <div className="p-8 text-center mt-20"><h2 className="text-red-500 font-bold mb-2">Sistem Hatası</h2><p className="text-xs text-slate-400 mb-6">{this.state.errorMsg}</p><button onClick={()=>window.location.reload()} className="bg-blue-600 px-4 py-2 rounded text-white">Uygulamayı Yenile</button></div>;
                return this.props.children;
            }
        }

        const safeGet = (key, def) => { 
            try { 
                const val = localStorage.getItem(key); 
                if(!val || val === "undefined" || val === "null") return def; 
                const parsed = JSON.parse(val);
                return parsed != null ? parsed : def;
            } catch (e) { return def; } 
        };

        const UNIVERSITIES = [{name:"Abant İzzet Baysal Üni.",city:"Bolu"},{name:"Adıyaman Üni.",city:"Adiyaman"},{name:"Adnan Menderes Üni.",city:"Aydin"},{name:"Afyon Kocatepe Üni.",city:"Afyonkarahisar"},{name:"Ağrı İbrahim Çeçen Üni.",city:"Agri"},{name:"Akdeniz Üni.",city:"Antalya"},{name:"Aksaray Üni.",city:"Aksaray"},{name:"Alanya Alaaddin Keykubat Üni.",city:"Antalya"},{name:"Amasya Üni.",city:"Amasya"},{name:"Anadolu Üni.",city:"Eskisehir"},{name:"Ankara Hacı Bayram Veli Üni.",city:"Ankara"},{name:"Ankara Sosyal Bilimler Üni.",city:"Ankara"},{name:"Ankara Üni.",city:"Ankara"},{name:"Ankara Yıldırım Beyazıt Üni.",city:"Ankara"},{name:"Ardahan Üni.",city:"Ardahan"},{name:"Artvin Çoruh Üni.",city:"Artvin"},{name:"Atatürk Üni.",city:"Erzurum"},{name:"Balıkesir Üni.",city:"Balikesir"},{name:"Bandırma Onyedi Eylül Üni.",city:"Balikesir"},{name:"Bartın Üni.",city:"Bartin"},{name:"Batman Üni.",city:"Batman"},{name:"Bayburt Üni.",city:"Bayburt"},{name:"Bilecik Şeyh Edebali Üni.",city:"Bilecik"},{name:"Bingöl Üni.",city:"Bingol"},{name:"Bitlis Eren Üni.",city:"Bitlis"},{name:"Boğaziçi Üni.",city:"Istanbul"},{name:"Bozok Üni.",city:"Yozgat"},{name:"Bursa Teknik Üni.",city:"Bursa"},{name:"Bülent Ecevit Üni.",city:"Zonguldak"},{name:"Celal Bayar Üni.",city:"Manisa"},{name:"Cumhuriyet Üni.",city:"Sivas"},{name:"Çanakkale Onsekiz Mart Üni.",city:"Canakkale"},{name:"Çankırı Karatekin Üni.",city:"Cankiri"},{name:"Çukurova Üni.",city:"Adana"},{name:"Dicle Üni.",city:"Diyarbakir"},{name:"Dokuz Eylül Üni.",city:"Izmir"},{name:"Dumlupınar Üni.",city:"Kutahya"},{name:"Düzce Üni.",city:"Duzce"},{name:"Ege Üni.",city:"Izmir"},{name:"Erciyes Üni.",city:"Kayseri"},{name:"Erzincan Binali Yıldırım Üni.",city:"Erzincan"},{name:"Erzurum Teknik Üni.",city:"Erzurum"},{name:"Eskişehir Osmangazi Üni.",city:"Eskisehir"},{name:"Fırat Üni.",city:"Elazig"},{name:"Galatasaray Üni.",city:"Istanbul"},{name:"Gazi Üni.",city:"Ankara"},{name:"Gaziantep Üni.",city:"Gaziantep"},{name:"Gebze Teknik Üni.",city:"Kocaeli"},{name:"Giresun Üni.",city:"Giresun"},{name:"Gümüşhane Üni.",city:"Gumushane"},{name:"Hacettepe Üni.",city:"Ankara"},{name:"Hakkari Üni.",city:"Hakkari"},{name:"Harran Üni.",city:"Sanliurfa"},{name:"Hitit Üni.",city:"Corum"},{name:"Iğdır Üni.",city:"Igdir"},{name:"İnönü Üni.",city:"Malatya"},{name:"İskenderun Teknik Üni.",city:"Hatay"},{name:"İstanbul Medeniyet Üni.",city:"Istanbul"},{name:"İstanbul Teknik Üni. (İTÜ)",city:"Istanbul"},{name:"İstanbul Üni.",city:"Istanbul"},{name:"İzmir Katip Çelebi Üni.",city:"Izmir"},{name:"İzmir Yüksek Teknoloji Enstitüsü",city:"Izmir"},{name:"Kafkas Üni.",city:"Kars"},{name:"Kahramanmaraş Sütçü İmam Üni.",city:"Kahramanmaras"},{name:"Karabük Üni.",city:"Karabuk"},{name:"Karadeniz Teknik Üni. (KTÜ)",city:"Trabzon"},{name:"Karamanoğlu Mehmetbey Üni.",city:"Karaman"},{name:"Kastamonu Üni.",city:"Kastamonu"},{name:"Kırıkkale Üni.",city:"Kirikkale"},{name:"Kırklareli Üni.",city:"Kirklareli"},{name:"Kilis 7 Aralık Üni.",city:"Kilis"},{name:"Kocaeli Üni.",city:"Kocaeli"},{name:"Konya Teknik Üni.",city:"Konya"},{name:"KTO Karatay Üni.",city:"Konya"},{name:"Marmara Üni.",city:"Istanbul"},{name:"Mehmet Akif Ersoy Üni.",city:"Burdur"},{name:"Mersin Üni.",city:"Mersin"},{name:"Mimar Sinan Güzel Sanatlar Üni.",city:"Istanbul"},{name:"Muğla Sıtkı Koçman Üni.",city:"Mugla"},{name:"Mustafa Kemal Üni.",city:"Hatay"},{name:"Muş Alparslan Üni.",city:"Mus"},{name:"Namık Kemal Üni.",city:"Tekirdag"},{name:"Necmettin Erbakan Üni.",city:"Konya"},{name:"Nevşehir Hacı Bektaş Veli Üni.",city:"Nevsehir"},{name:"Niğde Ömer Halisdemir Üni.",city:"Nigde"},{name:"Ondokuz Mayıs Üni.",city:"Samsun"},{name:"Ordu Üni.",city:"Ordu"},{name:"Orta Doğu Teknik Üni. (ODTÜ)",city:"Ankara"},{name:"Osmaniye Korkut Ata Üni.",city:"Osmaniye"},{name:"Pamukkale Üni.",city:"Denizli"},{name:"Recep Tayyip Erdoğan Üni.",city:"Rize"},{name:"Sakarya Uygulamalı Bilimler Üni.",city:"Sakarya"},{name:"Sakarya Üni.",city:"Sakarya"},{name:"Selçuk Üni.",city:"Konya"},{name:"Siirt Üni.",city:"Siirt"},{name:"Sinop Üni.",city:"Sinop"},{name:"Süleyman Demirel Üni.",city:"Isparta"},{name:"Şırnak Üni.",city:"Sirnak"},{name:"Trakya Üni.",city:"Edirne"},{name:"TOBB ETU.",city:"Ankara"},{name:"Tunceli Üni.",city:"Tunceli"},{name:"Uludağ Üni.",city:"Bursa"},{name:"Uşak Üni.",city:"Usak"},{name:"Yalova Üni.",city:"Yalova"},{name:"Yıldız Teknik Üni.",city:"Istanbul"},{name:"Yüzüncü Yıl Üni.",city:"Van"}];

        const TITLES = ["Arş. Gör.", "Öğr. Gör.", "Dr. Öğr. Üyesi", "Doç. Dr.", "Prof. Dr."];
        const ACADEMIC_DATA = { "default": [{ id: 1, event: "Güz Başlangıcı", date: "2024-09-23", category: "academic" }, { id: 2, event: "Vize Haftası", date: "2024-11-16", category: "academic" }, { id: 3, event: "Final Haftası", date: "2025-01-06", category: "academic" }, { id: 4, event: "Bahar Başlangıcı", date: "2025-02-17", category: "academic" }] };
        const LESSON_TYPES = { "lisans": { label: "Lisans", className: "lesson-lisans", btnClass: "btn-lisans" }, "yuksek": { label: "Y. Lisans", className: "lesson-yuksek", btnClass: "btn-yuksek" }, "doktora": { label: "Doktora", className: "lesson-doktora", btnClass: "btn-doktora" }, "seminer": { label: "Seminer", className: "lesson-seminer", btnClass: "btn-seminer" } };
        const DAYS_TR = ["Pazartesi", "Sali", "Carsamba", "Persembe", "Cuma", "Cumartesi", "Pazar"];

        const App = () => {
            const [user, setUser] = useState(() => safeGet('user_v46', null));
            const [academicCalendarLink, setAcademicCalendarLink] = useState(() => safeGet('academic_calendar_link_v46', ''));
            const [tasks, setTasks] = useState(() => safeGet('tasks_v46', []) || []);
            const [notes, setNotes] = useState(() => safeGet('notes_v46', []) || []);
            const [schedule, setSchedule] = useState(() => safeGet('schedule_v46', { Pazartesi: Array(13).fill(null), Sali: Array(13).fill(null), Carsamba: Array(13).fill(null), Persembe: Array(13).fill(null), Cuma: Array(13).fill(null), Cumartesi: Array(13).fill(null), Pazar: Array(13).fill(null) }));
            const [timeSlots, setTimeSlots] = useState(() => safeGet('timeslots_v46', ["08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00"]) || []);
            const [customScores, setCustomScores] = useState(() => safeGet('scores_v46', [{ id: 1, name: "Makale", value: 20, count: 0 }]) || []);
            const [targetScore, setTargetScore] = useState(() => safeGet('target_score_v46', 100));
            const [calendarEvents, setCalendarEvents] = useState(() => safeGet('calendar_v46', ACADEMIC_DATA['default']) || ACADEMIC_DATA['default']);
            
            const [view, setView] = useState("flow");
            const [activeModal, setActiveModal] = useState(null); 
            const [isScreenshotMode, setIsScreenshotMode] = useState(false);
            const [newTask, setNewTask] = useState({ title: "", date: "", time: "", desc: "", type: "task", category: "daily" });
            const [newNote, setNewNote] = useState("");
            const [editingTask, setEditingTask] = useState(null);
            const [editingLesson, setEditingLesson] = useState(null);
            const [newLesson, setNewLesson] = useState({ name: "", type: "lisans", daySchedules: [] });
            const [prayerTimes, setPrayerTimes] = useState(null);
            const [currentTimeStr, setCurrentTimeStr] = useState("00:00");
            const [pomodoro, setPomodoro] = useState({ active: false, time: 25 * 60 });
            const [dayDetailData, setDayDetailData] = useState(null);const fileInputRef = useRef(null);

            useEffect(() => {
                const loader = document.getElementById('app-loader');
                if (loader) { setTimeout(() => { loader.style.opacity = '0'; setTimeout(() => loader.style.display = 'none', 500); }, 500); }
            }, []);

            useEffect(() => { if(user) localStorage.setItem('user_v46', JSON.stringify(user)); }, [user]);
            useEffect(() => { localStorage.setItem('tasks_v46', JSON.stringify(tasks)); }, [tasks]);
            useEffect(() => { localStorage.setItem('schedule_v46', JSON.stringify(schedule)); }, [schedule]);
            useEffect(() => { localStorage.setItem('notes_v46', JSON.stringify(notes)); }, [notes]);
            useEffect(() => { localStorage.setItem('scores_v46', JSON.stringify(customScores)); }, [customScores]);
            useEffect(() => { localStorage.setItem('target_score_v46', JSON.stringify(targetScore)); }, [targetScore]);
            useEffect(() => { localStorage.setItem('timeslots_v46', JSON.stringify(timeSlots)); }, [timeSlots]);
            useEffect(() => { localStorage.setItem('academic_calendar_link_v46', JSON.stringify(academicCalendarLink)); }, [academicCalendarLink]);
            useEffect(() => { localStorage.setItem('calendar_v46', JSON.stringify(calendarEvents)); }, [calendarEvents]);

            useEffect(() => {
                const tick = () => {
                    const now = new Date();
                    setCurrentTimeStr(now.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'}));
                    if(pomodoro.active && pomodoro.time > 0) setPomodoro(prev => ({...prev, time: prev.time - 1}));
                    else if (pomodoro.active && pomodoro.time === 0) { setPomodoro({active: false, time: 25 * 60}); alert("Odaklanma Bitti!"); }
                };
                const timer = setInterval(tick, 1000);
                if (user?.enablePrayer && user?.city && !prayerTimes) fetchPrayerTimes(user.city);
                return () => clearInterval(timer);
            }, [pomodoro.active, user]);

            const fetchPrayerTimes = async (city) => { try { const d = new Date(); const res = await fetch(`https://api.aladhan.com/v1/timingsByCity/${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()}?city=${city}&country=Turkey&method=13`); const json = await res.json(); if(json.data) setPrayerTimes(json.data.timings); } catch (e) { } };
            const getMinutes = (t) => { if(!t) return 0; const [h,m] = t.split(':').map(Number); return h*60+m; };

            const getTimelineEvents = useCallback(() => {
                const now = new Date(); const nowMinTotal = now.getHours() * 60 + now.getMinutes();
                const windowStart = nowMinTotal - (6 * 60); const windowEnd = nowMinTotal + (18 * 60);
                let events = [];
                tasks.forEach(t => {
                    if(!t.date || !t.time) return;
                    const tDate = new Date(t.date); const tMin = getMinutes(t.time); const diffDays = Math.round((tDate.setHours(0,0,0,0) - new Date().setHours(0,0,0,0)) / (1000*60*60*24));
                    let relativeMin = tMin + (diffDays * 1440);
                    if (relativeMin >= windowStart && relativeMin <= windowEnd) events.push({ ...t, relativeMin, displayType: t.category });
                });
                if (prayerTimes && user?.enablePrayer) {
                    const map = { Fajr: "İmsak", Sunrise: "Güneş", Dhuhr: "Öğle", Asr: "İkindi", Maghrib: "Akşam", Isha: "Yatsı" };
                    [-1, 0, 1].forEach(dayOffset => { Object.keys(map).forEach(k => { if(prayerTimes[k]) { const tMin = getMinutes(prayerTimes[k]) + (dayOffset * 1440); if (tMin >= windowStart && tMin <= windowEnd) events.push({ id: `p-${k}-${dayOffset}`, title: map[k], time: prayerTimes[k], relativeMin: tMin, displayType: "prayer" }); } }); });
                }
                [-1, 0, 1].forEach(dayOffset => {
                    const d = new Date(); d.setDate(d.getDate() + dayOffset);
                    const dayKey = ["Pazar", "Pazartesi", "Sali", "Carsamba", "Persembe", "Cuma", "Cumartesi"][d.getDay()];
                    if (schedule[dayKey]) schedule[dayKey].forEach((l, i) => { if (l) { const tMin = getMinutes(timeSlots[i]) + (dayOffset * 1440); if (tMin >= windowStart && tMin <= windowEnd) events.push({ id: `l-${dayOffset}-${i}`, title: l.name, time: timeSlots[i], relativeMin: tMin, displayType: "class", classroom: l.classroom }); } });
                });
                return events.sort((a, b) => a.relativeMin - b.relativeMin);
            }, [tasks, prayerTimes, user, schedule, timeSlots]);

            const getAllEvents = () => { 
                const academicEvents = calendarEvents.map(e => ({ ...e, origin: 'academic', title: e.event })); 
                const userEvents = tasks.map(t => ({ ...t, event: t.title, origin: 'personal' }));
                return [...academicEvents, ...userEvents]; 
            };

            const exportToPDF = () => {
                try {
                    const { jsPDF } = window.jspdf; const doc = new jsPDF();
                    doc.setFontSize(16); doc.text(`${user.name} - Ders Programi`, 105, 15, { align: 'center' }); doc.setFontSize(10); doc.text(`${user.uni}`, 105, 22, { align: 'center' });
                    let yPos = 35; const colWidth = 24; const rowHeight = 12;
                    doc.setFontSize(8); doc.text('Saat', 15, yPos); Object.keys(schedule).forEach((day, i) => doc.text(day.substring(0, 3), 42 + (i * colWidth), yPos)); yPos += 6;
                    timeSlots.forEach((time, slotIndex) => { 
                        doc.text(time, 15, yPos); 
                        Object.keys(schedule).forEach((day, dayIndex) => { 
                            const l = schedule[day][slotIndex]; 
                            if (l) { 
                                const x = 40 + (dayIndex * colWidth); const y = yPos - 4; 
                                if (l.type === 'lisans') doc.setFillColor(13, 148, 136); else if (l.type === 'yuksek') doc.setFillColor(79, 70, 229); else if (l.type === 'doktora') doc.setFillColor(147, 51, 234); else doc.setFillColor(245, 158, 11); 
                                doc.rect(x, y, colWidth - 2, rowHeight - 2, 'F'); doc.setTextColor(255, 255, 255); doc.setFontSize(7); doc.text(l.name.substring(0, 10), x + 1, yPos); 
                                if(l.classroom || (l.startTime && l.endTime)) { 
                                    doc.setFontSize(5); let infoText = ""; if(l.startTime && l.endTime) infoText += `${l.startTime}-${l.endTime} `; if(l.classroom) infoText += l.classroom; 
                                    if(infoText) doc.text(infoText, x+1, yPos+3); 
                                } 
                            } 
                        }); 
                        yPos += rowHeight; doc.setTextColor(0,0,0); doc.setFontSize(8); if (yPos > 270) { doc.addPage(); yPos = 20; } 
                    });
                    doc.save(`${user.name}_program.pdf`);
                } catch (err) { alert(err.message); }
            };

            const exportData = () => { const data = JSON.stringify({ version: "3.2", user, tasks, schedule, timeSlots, customScores, targetScore, notes, academicCalendarLink, calendarEvents }, null, 2); const blob = new Blob([data], {type: "text/plain"}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `yedek.txt`; a.click(); };
            
            // DÜZELTME 1: YEDEK YÜKLEME KESİN ÇÖZÜM
            const handleImportFile = (e) => { 
                const file = e.target.files[0]; if(!file) return; const reader = new FileReader(); 
                reader.onload = (ev) => { 
                    try { 
                        const data = JSON.parse(ev.target.result); 
                        if(data.user) localStorage.setItem('user_v46', JSON.stringify(data.user)); 
                        if(data.tasks) localStorage.setItem('tasks_v46', JSON.stringify(data.tasks)); 
                        if(data.schedule) localStorage.setItem('schedule_v46', JSON.stringify(data.schedule)); 
                        if(data.notes) localStorage.setItem('notes_v46', JSON.stringify(data.notes)); 
                        if(data.calendarEvents) localStorage.setItem('calendar_v46', JSON.stringify(data.calendarEvents)); 
                        if(data.academicCalendarLink) localStorage.setItem('academic_calendar_link_v46', JSON.stringify(data.academicCalendarLink)); 
                        if(data.customScores) localStorage.setItem('scores_v46', JSON.stringify(data.customScores));
                        if(data.targetScore) localStorage.setItem('target_score_v46', JSON.stringify(data.targetScore));
                        if(data.timeSlots) localStorage.setItem('timeslots_v46', JSON.stringify(data.timeSlots));
                        alert("Yedek başarıyla yüklendi! Sistem yenileniyor..."); window.location.reload();
                    } catch(err) { alert("Dosya bozuk."); } 
                }; 
                reader.readAsText(file); 
            };

            const handleAddTask = () => { 
                if(!newTask.title || !newTask.date) return; 
                if (editingTask) { setTasks(prev => prev.map(t => t.id === editingTask.id ? { ...newTask, id: t.id } : t)); setEditingTask(null); } 
                else setTasks(prev => [...prev, { ...newTask, id: Date.now() }]); 
                setActiveModal(null); setNewTask({title:"", date:"", time:"", desc:"", type:"task", category:"daily"}); 
            };
            
            const openEditTask = (task) => { setNewTask(task); setEditingTask(task); setActiveModal('task'); };
            
            // DÜZELTME 3: SİLİNCE ANINDA GÜNCELLENMESİ
            const deleteTask = (e, id) => { 
                e.stopPropagation(); 
                if(confirm("Silinsin mi?")) {
                    setTasks(prev=>prev.filter(t=>t.id!==id)); 
                    if(dayDetailData) {
                        const newEvents = dayDetailData.events.filter(ev => ev.id !== id);
                        if(newEvents.length === 0) { setActiveModal(null); setDayDetailData(null); }
                        else { setDayDetailData(prev => ({...prev, events: newEvents})); }
                    }
                } 
            };
            
            const handleAddNote = () => { if(newNote) { setNotes([{id: Date.now(), text: newNote, date: new Date().toLocaleDateString()}, ...notes]); setNewNote(""); } };
            const handleDayClick = (dateStr, events) => { if (events.length > 0) { setDayDetailData({date: dateStr, events}); setActiveModal('dayDetail'); } else { setNewTask({ title: "", date: dateStr, time: "09:00", desc: "", type: "task", category: "daily" }); setActiveModal('task'); } };

            const saveLesson = () => { const { day, index, data } = editingLesson; const newSchedule = { ...schedule }; const duration = data.duration ? parseInt(data.duration) : 1; if (index + duration > 13) { alert("Gün bitiyor!"); return; } const batchId = data.batchId || Date.now(); for (let i = 0; i < duration; i++) { newSchedule[day][index + i] = { ...data, duration: 1, batchId: batchId }; } setSchedule(newSchedule); setActiveModal(null); };
            const deleteLesson = () => { const { day, index, data } = editingLesson; const newSchedule = { ...schedule }; if(data.batchId && confirm("Tüm bloğu sil?")) { Object.keys(newSchedule).forEach(d => { newSchedule[d] = newSchedule[d].map(l => (l && l.batchId === data.batchId) ? null : l); }); } else newSchedule[day][index] = null; setSchedule(newSchedule); setActiveModal(null); };
            const handleAddNewLesson = () => { if (!newLesson.name || newLesson.daySchedules.length === 0) return alert("Bilgileri doldurun"); const batchId = Date.now(); const newSchedule = { ...schedule }; newLesson.daySchedules.forEach(ds => { const startMin = getMinutes(ds.startTime); const endMin = getMinutes(ds.endTime); const dur = Math.ceil((endMin - startMin) / 60); let startIdx = timeSlots.findIndex(t => getMinutes(t) >= startMin); if(startIdx===-1) startIdx=0; for (let i = 0; i < dur && (startIdx + i) < timeSlots.length; i++) { newSchedule[ds.day][startIdx + i] = { name: newLesson.name, type: newLesson.type, classroom: ds.classroom || "", duration: 1, batchId, startTime: ds.startTime, endTime: ds.endTime }; } }); setSchedule(newSchedule); setActiveModal(null); setNewLesson({ name: "", type: "lisans", daySchedules: [] }); };
            const handleUpdateUser = (e) => { e.preventDefault(); const fd = new FormData(e.target); const u = UNIVERSITIES.find(x => x.name === fd.get('uni')) || {name: fd.get('uni'), city: '', url: ''}; setUser({ ...user, name: fd.get('name'), uni: u.name, city: u.city, url: u.url, enablePrayer: fd.get('enablePrayer') === 'on' }); setActiveModal(null); };

                        </div>)}

tegory === 'official')) { bg = "bg-amber-700"; text = "text-white font-bold"; } else if(events.length>0) { bg = "bg-blue-900"; text = "text-white font-bold"; } return (<button key={d} onClick={() => handleDayClick(dStr, events)} className={`h-6 flex items-center justify-center text-[9px] ${bg} ${text}`}>{d}</button>) })}</div></div>) })}</div></div>)}

lic">{l.classroom}</span>}</div>}</td>) })}</tr>))}</tbody></table></div></div>)}
                        
                        {view === 'promotion' && !isScreenshotMode && (<div className="glass p-4 rounded-xl border border-blue-500/20"><div className="flex justify-between items-center mb-4"><h3 className="font-bold text-slate-300 text-sm">PUAN CETVELİ</h3><button onClick={() => setCustomScores([...customScores, {id:Date.now(), name:"", value:0, count:0}])} className="text-[10px] bg-blue-600 px-3 py-1.5 rounded text-white">Ekle</button></div><div className="space-y-2">{customScores.map(s => (<div key={s.id} className="grid grid-cols-12 gap-2 items-center bg-slate-900/50 p-2 rounded border border-slate-700"><div className="col-span-5"><input className="w-full bg-transparent text-sm" placeholder="Faaliyet" value={s.name} onChange={e=>setCustomScores(customScores.map(x=>x.id===s.id?{...x,name:e.target.value}:x))} /></div><div className="col-span-2"><input type="number" className="w-full bg-slate-900 text-center text-xs text-white" value={s.value} onChange={e=>setCustomScores(customScores.map(x=>x.id===s.id?{...x,value:e.target.value}:x))} /></div><div className="col-span-2"><input type="number" className="w-full bg-slate-900 text-center text-xs text-white" value={s.count} onChange={e=>setCustomScores(customScores.map(x=>x.id===s.id?{...x,count:e.target.value}:x))} /></div><div className="col-span-2 text-center text-xs font-bold text-blue-400">{(parseInt(s.value)||0)*(parseInt(s.count)||0)}</div><div className="col-span-1"><button onClick={()=>setCustomScores(customScores.filter(x=>x.id!==s.id))} className="text-red-400"><i className="fas fa-trash"></i></button></div></div>))}</div><div className="mt-6 bg-slate-900 p-4 rounded-xl"><div className="flex justify-between items-center"><span className="text-xs text-slate-400 uppercase font-bold">Hedef:</span><input type="number" className="w-20 bg-slate-900 border border-slate-600 rounded p-1 text-center text-sm font-bold text-white" value={targetScore} onChange={e => setTargetScore(parseInt(e.target.value)||0)} /></div><div className="h-3 bg-slate-900 rounded-full overflow-hidden mt-2 border border-slate-700/50"><div className="h-full bg-emerald-500" style={{width: `${Math.min((customScores.reduce((a,b)=>a+((b.value||0)*(b.count||0)),0)/targetScore)*100, 100)}%`}}></div></div></div></div>)}

                    {activeModal === 'lesson' && editingLesson && (<div className="fixed inset-0 bg-black/80 z-[60] flex items-center justify-center p-4"><div className="bg-slate-800 w-full max-w-sm rounded-xl p-6"><h3 className="font-bold mb-4 text-white">Ders Düzenle</h3><input className="w-full input-dark p-2 mb-2 rounded" placeholder="Ders Adı" value={editingLesson.data.name} onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,name:e.target.value}})} /><div className="grid grid-cols-2 gap-2 mb-2"><div><label className="text-[10px] text-slate-400">Başlangıç</label><input type="time" className="w-full input-dark p-2 rounded" value={editingLesson.data.startTime||""} onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,startTime:e.target.value}})} /></div><div><label className="text-[10px] text-slate-400">Bitiş</label><input type="time" className="w-full input-dark p-2 rounded" value={editingLesson.data.endTime||""} onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,endTime:e.target.value}})} /></div></div><input className="w-full input-dark p-2 mb-2 rounded" placeholder="Sınıf" value={editingLesson.data.classroom} onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,classroom:e.target.value}})} /><div><label className="text-[10px] text-slate-400">Süre (Saat)</label><input type="number" min="1" max="8" className="w-full input-dark p-2 mb-4 rounded" value={editingLesson.data.duration||1} onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,duration:e.target.value}})} /></div><div className="grid grid-cols-2 gap-2 mb-4">{Object.keys(LESSON_TYPES).map(k=><button key={k} onClick={()=>setEditingLesson({...editingLesson,data:{...editingLesson.data,type:k}})} className={`p-1 text-[10px] rounded border font-bold ${editingLesson.data.type===k?'ring-2 ring-white':'opacity-70'} ${LESSON_TYPES[k].btnClass}`}>{LESSON_TYPES[k].label}</button>)}</div><div className="flex gap-2"><button onClick={()=>setActiveModal(null)} className="flex-1 bg-slate-600 py-2 rounded text-white">Vazgeç</button><button onClick={deleteLesson} className="flex-1 bg-red-600 py-2 rounded text-white">Sil</button><button onClick={saveLesson} className="flex-1 bg-emerald-600 py-2 rounded font-bold text-white">Kaydet</button></div></div></div>)}
                    {activeModal === 'addLesson' && (<div className="fixed inset-0 bg-black/80 z-[60] flex items-center justify-center p-4"><div className="bg-slate-800 w-full max-w-sm rounded-xl p-6 max-h-[80vh] overflow-y-auto"><h3 className="font-bold mb-4 text-white">Yeni Ders Ekle</h3><input className="w-full input-dark p-2 mb-2 rounded" placeholder="Ders Adı" value={newLesson.name} onChange={e=>setNewLesson({...newLesson,name:e.target.value})} /><div className="grid grid-cols-2 gap-2 mb-4">{Object.keys(LESSON_TYPES).map(k=><button key={k} onClick={()=>setNewLesson({...newLesson,type:k})} className={`p-1 text-[10px] rounded border font-bold ${newLesson.type===k?'ring-2 ring-white':'opacity-70'} ${LESSON_TYPES[k].btnClass}`}>{LESSON_TYPES[k].label}</button>)}</div><div className="border border-slate-700 p-2 rounded mb-4"><div className="flex justify-between mb-2"><span className="text-xs text-white">Ders Saatleri</span><button onClick={()=>setNewLesson({...newLesson, daySchedules:[...newLesson.daySchedules, {day:'Pazartesi', startTime:'09:00', endTime:'10:00', classroom:''}]})} className="text-xs bg-green-700 px-2 rounded text-white">+</button></div>{newLesson.daySchedules.map((ds, i) => (<div key={i} className="bg-slate-900 p-2 mb-1 rounded text-xs space-y-2"><div className="flex justify-between"><select value={ds.day} onChange={e=>{const n=[...newLesson.daySchedules];n[i].day=e.target.value;setNewLesson({...newLesson,daySchedules:n})}} className="bg-slate-800 rounded text-white border-none p-1 w-24">{DAYS_TR.map(d=><option key={d}>{d}</option>)}</select><button onClick={()=>{const n=[...newLesson.daySchedules];n.splice(i,1);setNewLesson({...newLesson,daySchedules:n})}} className="text-red-400"><i className="fas fa-trash"></i></button></div><div className="flex gap-1"><input type="time" value={ds.startTime} onChange={e=>{const n=[...newLesson.daySchedules];n[i].startTime=e.target.value;setNewLesson({...newLesson,daySchedules:n})}} className="bg-slate-800 rounded p-1 w-16 text-white" /><input type="time" value={ds.endTime} onChange={e=>{const n=[...newLesson.daySchedules];n[i].endTime=e.target.value;setNewLesson({...newLesson,daySchedules:n})}} className="bg-slate-800 rounded p-1 w-16 text-white" /><input placeholder="Sınıf" value={ds.classroom} onChange={e=>{const n=[...newLesson.daySchedules];n[i].classroom=e.target.value;setNewLesson({...newLesson,daySchedules:n})}} className="bg-slate-800 rounded p-1 flex-1 text-white" /></div></div>))}</div><div className="flex gap-2"><button onClick={()=>setActiveModal(null)} className="flex-1 bg-slate-600 py-2 rounded text-white">İptal</button><button onClick={handleAddNewLesson} className="flex-1 bg-emerald-600 py-2 rounded font-bold text-white">Dersi Ekle</button></div></div></div>)}
                    {activeModal === 'settings' && (<div className="fixed inset-0 bg-black/80 z-[60] flex items-center justify-center p-4"><div className="bg-slate-800 w-full max-w-sm rounded-xl p-6"><div className="flex justify-between mb-4"><h3 className="font-bold text-white">Ayarlar</h3><button onClick={()=>setActiveModal(null)} className="text-slate-400">X</button></div><form onSubmit={handleUpdateUser} className="space-y-4"><input name="name" defaultValue={user.name} required className="w-full input-dark p-2 rounded" /><select name="uni" defaultValue={user.uni} className="w-full input-dark p-2 rounded">{UNIVERSITIES.map(u => <option key={u.name} value={u.name}>{u.name}</option>)}</select><div className="flex items-center gap-3 pt-2"><input type="checkbox" name="enablePrayer" defaultChecked={user.enablePrayer} className="w-5 h-5 accent-blue-500" /><span className="text-sm text-slate-300">Namaz Vakitlerini Göster</span></div><button className="w-full bg-blue-600 py-2 rounded text-white font-bold">Güncelle</button></form><hr className="my-4 border-slate-700"/><div className="space-y-2"><div className="flex gap-2"><button onClick={exportData} className="flex-1 bg-green-900/50 py-2 rounded text-xs text-green-300 border border-green-800">Yedek Al</button><button onClick={()=>fileInputRef.current.click()} className="flex-1 bg-blue-900/50 py-2 rounded text-xs text-blue-300 border border-blue-800">Yedek Yükle</button></div><button onClick={exportToPDF} className="w-full bg-red-900/50 py-2 rounded text-xs text-red-300 border border-red-800">Renkli PDF İndir (Sınıf Bilgili)</button><button onClick={()=>{if(confirm("Tüm veriler silinecek emin misiniz?")){localStorage.clear(); location.reload();}}} className="w-full bg-slate-800 py-2 rounded text-xs text-red-500 hover:bg-slate-700">Tüm Verileri Sıfırla</button></div></div></div>)}
                    {activeModal === 'dayDetail' && dayDetailData && (<div className="fixed inset-0 bg-black/80 z-[60] flex items-center justify-center p-4"><div className="bg-slate-800 w-full max-w-sm rounded-xl p-6 max-h-[80vh] overflow-y-auto"><div className="flex justify-between items-center mb-4"><h3 className="font-bold text-white">{dayDetailData.date} Detayı</h3><button onClick={() => { setActiveModal(null); setDayDetailData(null); }} className="text-slate-400"><i className="fas fa-times"></i></button></div><div className="space-y-3">{dayDetailData.events.map((ev, i) => (<div key={i} className={`p-3 rounded border-l-4 flex justify-between items-center ${ev.category==='academic'?'bg-red-900/30 border-red-500': ev.category==='official'?'bg-amber-900/30 border-amber-500': ev.category==='special'?'bg-pink-900/30 border-pink-500':'bg-blue-900/30 border-blue-500'}`} onClick={() => { if(ev.origin === 'personal') { openEditTask(ev); setDayDetailData(null); } }}><div><div className="text-sm font-bold text-white">{ev.event}</div>{ev.time && <div className="text-xs text-slate-400 mt-1"><i className="far fa-clock mr-1"></i>{ev.time}</div>}<div className="text-[10px] text-slate-500 mt-1 uppercase">{ev.origin}</div></div>{ev.origin === 'personal' && <button onClick={(e) => deleteTask(e, ev.id)} className="text-red-400 hover:text-red-300 px-2 ml-2"><i className="fas fa-trash"></i></button>}</div>))}</div><div className="mt-6 pt-4 border-t border-slate-700"><button onClick={() => { setNewTask({ title: "", date: dayDetailData.date, time: "09:00", desc: "", type: "task", category: "daily" }); setActiveModal('task'); }} className="w-full bg-slate-700 text-white py-2 rounded-lg text-sm flex items-center justify-center gap-2"><i className="fas fa-plus"></i> Bu Güne Hatırlatıcı Ekle</button></div></div></div>)}
                </div>
                </ErrorBoundary>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        
        setTimeout(() => {
            try {
                root.render(<App />);
            } catch(e) { console.error("Render hatası:", e); }
        }, 1500);

        setTimeout(() => {
            const loader = document.getElementById('app-loader');
            if(loader && loader.style.display !== 'none') loader.style.display = 'none';
        }, 6000);
    </script>
</body>
</html>
