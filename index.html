<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Academic Assistant V2.0</title>

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a; 
            color: #e2e8f0; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none;
            overflow-x: hidden;
        }
        
        .glass { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }

        .input-dark { 
            background: #1e293b; 
            border: 1px solid #334155; 
            color: white; 
            transition: all 0.3s; 
        }
        .input-dark:focus { border-color: #3b82f6; outline: none; }

        .signature { 
            font-family: 'Orbitron', monospace; 
            letter-spacing: 2px; 
            font-weight: 900;
            text-transform: uppercase;
        }
        
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .urgent-pulse { animation: pulse-red 2s infinite; }
        
        /* Kalp Atışı Animasyonları */
        @keyframes heartbeat-slow {
            0%, 100% { transform: scale(1); }
            10% { transform: scale(1.1); }
            20% { transform: scale(1); }
            30% { transform: scale(1.1); }
            40% { transform: scale(1); }
        }
        
        @keyframes heartbeat-fast {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.2); }
            50% { transform: scale(1); }
            75% { transform: scale(1.2); }
        }
        
        .heartbeat-slow {
            animation: heartbeat-slow 2s ease-in-out infinite;
        }
        
        .heartbeat-fast {
            animation: heartbeat-fast 1s ease-in-out infinite;
        }
        
        /* Ekran Görüntüsü Modu */
        .screenshot-mode { background-color: #ffffff !important; color: #000000 !important; }
        .screenshot-mode .app-container { background-color: #ffffff !important; box-shadow: none !important; }
        .screenshot-mode .no-screenshot { display: none !important; }
        .screenshot-mode .glass { 
            background: white !important; 
            border: 1px solid #000 !important; 
            color: black !important; 
            box-shadow: none !important; 
            backdrop-filter: none !important;
        }
        .screenshot-mode th { background-color: #f3f4f6 !important; color: black !important; border: 1px solid #000 !important; }
        .screenshot-mode td { border: 1px solid #000 !important; color: black !important; }
        .screenshot-mode input { color: black !important; background: transparent !important; border: none !important; text-align: center; }

        /* Ders Renkleri */
        .lesson-lisans { background: linear-gradient(135deg, #0d9488 0%, #115e59 100%) !important; border-left: 3px solid #5eead4 !important; color: white !important; } 
        .lesson-yuksek { background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%) !important; border-left: 3px solid #a5b4fc !important; color: white !important; } 
        .lesson-doktora { background: linear-gradient(135deg, #e11d48 0%, #be123c 100%) !important; border-left: 3px solid #fda4af !important; color: white !important; } 
        .lesson-seminer { background: linear-gradient(135deg, #d97706 0%, #b45309 100%) !important; border-left: 3px solid #fcd34d !important; color: white !important; } 
        
        /* Buton Renkleri */
        .btn-lisans { background-color: #0d9488; color: white; border: 1px solid #5eead4; }
        .btn-yuksek { background-color: #4f46e5; color: white; border: 1px solid #a5b4fc; }
        .btn-doktora { background-color: #e11d48; color: white; border: 1px solid #fda4af; }
        .btn-seminer { background-color: #d97706; color: white; border: 1px solid #fcd34d; }

        /* Drag & Drop */
        .dragging { opacity: 0.5; }
        .drag-over { border: 2px dashed #3b82f6 !important; background: rgba(59, 130, 246, 0.1); }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
        ::-webkit-calendar-picker-indicator { filter: invert(1); }
    </style>

    <script>
    // ============================================================
    // EXPO NATIVE BRIDGE - React Native WebView ile haberleşme
    // ============================================================
    
    // Native taraftan gelen mesajları dinle - Android için her iki yöntem
    function handleNativeMessage(event) {
        try {
            var msg = JSON.parse(event.data);
            if (msg.type === 'IMPORT_DATA' && msg.data) {
                // Native dosya seçiminden gelen veriyi işle
                try {
                    var data = JSON.parse(msg.data);
                    if(data.user) { localStorage.setItem('user_v48', JSON.stringify(data.user)); }
                    if(data.tasks) { localStorage.setItem('tasks_v48', JSON.stringify(data.tasks)); }
                    if(data.completedTasks) { localStorage.setItem('completed_tasks_v48', JSON.stringify(data.completedTasks)); }
                    if(data.schedule) { localStorage.setItem('schedule_v48', JSON.stringify(data.schedule)); }
                    if(data.customScores) { localStorage.setItem('scores_v48', JSON.stringify(data.customScores)); }
                    if(data.notes) { localStorage.setItem('notes_v48', JSON.stringify(data.notes)); }
                    if(data.academicCalendarUrl) { localStorage.setItem('academic_calendar_url_v48', JSON.stringify(data.academicCalendarUrl)); }
                    alert("✅ Backup loaded successfully! Restarting app...");
                    setTimeout(function() { window.location.reload(); }, 1000);
                } catch(err) {
                    alert("❌ Error: File is corrupted or invalid format.");
                }
            } else if (msg.type === 'IMPORT_ERROR') {
                alert("❌ File could not be opened: " + (msg.error || 'Unknown error'));
            } else if (msg.type === 'EXPORT_SUCCESS') {
                alert("✅ Backup file saved and share menu opened.");
            } else if (msg.type === 'PHOTO_SELECTED' && msg.images) {
                if (window.__addPhotos) window.__addPhotos(msg.images);
            }
        } catch(e) { console.error('Bridge hata:', e); }
    }
    
    // Android ve iOS için her iki event dinleyiciyi ekle
    window.addEventListener('message', handleNativeMessage);
    document.addEventListener('message', handleNativeMessage);
    
    // Native'e mesaj gönder (güvenli wrapper)
    function sendToNative(message) {
        try {
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify(message));
                return true;
            }
            return false;
        } catch(e) {
            return false;
        }
    }
    
    // Uygulama yüklenince tüm bildirimleri planla
    window.addEventListener('load', function() {
        setTimeout(function() {
            sendToNative({ type: 'APP_READY' });
            scheduleAllNotifications();
        }, 2000);
    });
    
    // Geri tuşu native'den gelince React'a ilet
    window.addEventListener('popstate', function() {
        if (window.__reactNavigateBack) window.__reactNavigateBack();
    });

    // Tüm görev bildirimlerini planla (10 dk önce)
    function scheduleAllNotifications() {
        try {
            var tasks = JSON.parse(localStorage.getItem('tasks_v48') || '[]');
            var schedule = JSON.parse(localStorage.getItem('schedule_v48') || '{}');
            var now = new Date();
            var minTime = new Date(now.getTime() + 11 * 60 * 1000); // en az 11 dk sonrası
            
            // Sadece gerçekten gelecekteki görevleri filtrele (tarih + saat bazlı)
            var upcoming = tasks.filter(function(t) {
                if (!t.date || !t.time || !t.title) return false;
                var parts = t.time.split(':');
                var taskDate = new Date(t.date + 'T00:00:00');
                taskDate.setHours(parseInt(parts[0]), parseInt(parts[1]), 0, 0);
                return taskDate.getTime() > minTime.getTime();
            });
            
            // Haftalık ders programından bildirim oluştur (7 gün için)
            var dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
            var timeSlots = JSON.parse(localStorage.getItem('timeslots_v48') || '["08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00"]');
            
            for (var dayOffset = 0; dayOffset < 7; dayOffset++) {
                var d = new Date(now);
                d.setDate(d.getDate() + dayOffset);
                var dayKey = dayNames[d.getDay()];
                var dateStr = d.toISOString().split('T')[0];
                var dayLessons = schedule[dayKey];
                if (dayLessons) {
                    dayLessons.forEach(function(lesson, i) {
                        if (lesson && lesson.name && timeSlots[i]) {
                            var lessonTime = lesson.startTime || timeSlots[i];
                            upcoming.push({
                                id: 'lesson-' + dayOffset + '-' + i,
                                title: '📚 ' + lesson.name + (lesson.classroom ? ' (' + lesson.classroom + ')' : ''),
                                date: dateStr,
                                time: lessonTime
                            });
                        }
                    });
                }
            }
            
            // Namaz vakitlerini de ekle (bugün ve yarın)
            try {
                var prayerData = localStorage.getItem('prayer_cache_v48');
                var prayerMap = {'Fajr':'Fajr','Sunrise':'Sunrise','Dhuhr':'Dhuhr','Asr':'Asr','Maghrib':'Maghrib','Isha':'Isha'};
                if (prayerData) {
                    var pt = JSON.parse(prayerData);
                    var todayStr = now.toISOString().split('T')[0];
                    var tomorrow = new Date(now); tomorrow.setDate(tomorrow.getDate() + 1);
                    var tomorrowStr = tomorrow.toISOString().split('T')[0];
                    Object.keys(prayerMap).forEach(function(k) {
                        if (pt[k]) {
                            var time = pt[k].substring(0, 5); // HH:MM
                            upcoming.push({ id: 'prayer-today-' + k, title: '🕌 ' + prayerMap[k], date: todayStr, time: time });
                            upcoming.push({ id: 'prayer-tmrw-' + k, title: '🕌 ' + prayerMap[k], date: tomorrowStr, time: time });
                        }
                    });
                }
            } catch(pe) {}
            
            if (upcoming.length > 0) {
                sendToNative({ type: 'SCHEDULE_FUTURE_NOTIFICATIONS', tasks: upcoming, sound: localStorage.getItem('notif_sound_v48') ? JSON.parse(localStorage.getItem('notif_sound_v48')) : 'default' });
            }
        } catch(e) { console.error('scheduleAllNotifications hata:', e); }
    }
    </script>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const safeGet = (key, def) => { 
            try { 
                const val = localStorage.getItem(key);
                return val ? JSON.parse(val) : def; 
            } catch (e) { return def; } 
        };

        const safeSave = (key, val) => { 
            try { 
                localStorage.setItem(key, JSON.stringify(val)); 
            } catch(e) { 
                console.error('localStorage save failed:', e); 
            } 
        };

        // University autocomplete with multi-source search + custom entry
        const UniAutocomplete = ({ value, onChange, inputClass }) => {
            const [query, setQuery] = React.useState(value || '');
            const [results, setResults] = React.useState([]);
            const [loading, setLoading] = React.useState(false);
            const [open, setOpen] = React.useState(false);
            const [confirmed, setConfirmed] = React.useState(!!value);
            const [apiError, setApiError] = React.useState(false);
            const debounceRef = React.useRef(null);
            const containerRef = React.useRef(null);

            React.useEffect(() => {
                if (value && value !== query) { setQuery(value); setConfirmed(true); }
            }, [value]);

            React.useEffect(() => {
                const handler = (e) => {
                    if (containerRef.current && !containerRef.current.contains(e.target)) setOpen(false);
                };
                document.addEventListener('mousedown', handler);
                document.addEventListener('touchstart', handler);
                return () => { document.removeEventListener('mousedown', handler); document.removeEventListener('touchstart', handler); };
            }, []);

            const searchUni = async (q) => {
                setLoading(true); setApiError(false);
                const tryFetch = async (url) => {
                    const ctrl = new AbortController();
                    const timer = setTimeout(() => ctrl.abort(), 5000);
                    try {
                        const res = await fetch(url, { signal: ctrl.signal });
                        clearTimeout(timer);
                        if (!res.ok) throw new Error();
                        return await res.json();
                    } catch(e) { clearTimeout(timer); return null; }
                };

                // Try direct API first
                let data = await tryFetch('https://universities.hipolabs.com/search?name=' + encodeURIComponent(q));
                
                // Fallback: CORS proxy
                if (!data || !Array.isArray(data)) {
                    const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent('https://universities.hipolabs.com/search?name=' + encodeURIComponent(q));
                    data = await tryFetch(proxyUrl);
                }

                setLoading(false);
                if (data && Array.isArray(data) && data.length > 0) {
                    const mapped = data.slice(0, 8).map(u => ({
                        name: u.name,
                        city: u.state_province || '',
                        url: (u.web_pages && u.web_pages[0]) ? u.web_pages[0].replace(/\/$/, '') : '',
                        country: u.country || ''
                    }));
                    setResults(mapped); setOpen(true); setApiError(false);
                } else {
                    setResults([]); setApiError(true); setOpen(true);
                }
            };

            const handleChange = (e) => {
                const q = e.target.value;
                setQuery(q); setConfirmed(false);
                onChange({ name: q, city: '', url: '' });
                if (debounceRef.current) clearTimeout(debounceRef.current);
                if (q.trim().length >= 2) {
                    debounceRef.current = setTimeout(() => searchUni(q.trim()), 400);
                } else { setResults([]); setOpen(false); setApiError(false); }
            };

            const handleSelect = (u) => {
                setQuery(u.name); setConfirmed(true); setOpen(false); setResults([]);
                onChange(u);
            };

            const handleCustom = () => {
                setConfirmed(true); setOpen(false);
                onChange({ name: query, city: '', url: '' });
            };

            return (
                <div ref={containerRef} style={{position:'relative'}}>
                    <div style={{position:'relative'}}>
                        <input
                            value={query}
                            onChange={handleChange}
                            onFocus={() => { if (results.length > 0 || apiError) setOpen(true); }}
                            placeholder="Type your university name..."
                            className={inputClass}
                            style={{paddingRight:'36px'}}
                            autoComplete="off"
                        />
                        <span style={{position:'absolute',right:'10px',top:'50%',transform:'translateY(-50%)',fontSize:'15px',pointerEvents:'none',color: confirmed?'#10b981':'#64748b'}}>
                            {loading ? '⏳' : confirmed ? '✓' : query.length >= 2 ? '🔍' : '🏫'}
                        </span>
                    </div>
                    {open && (
                        <div style={{position:'absolute',top:'calc(100% + 4px)',left:0,right:0,background:'#1e293b',border:'1px solid #475569',borderRadius:'10px',zIndex:99999,maxHeight:'280px',overflowY:'auto',boxShadow:'0 16px 40px rgba(0,0,0,0.7)'}}>
                            {/* Always show "use as typed" at top */}
                            {query.length >= 2 && (
                                <div
                                    onPointerDown={e=>{e.preventDefault();handleCustom();}}
                                    style={{padding:'10px 14px',cursor:'pointer',borderBottom:'1px solid #475569',background:'rgba(59,130,246,0.1)'}}
                                    onMouseEnter={e=>e.currentTarget.style.background='rgba(59,130,246,0.2)'}
                                    onMouseLeave={e=>e.currentTarget.style.background='rgba(59,130,246,0.1)'}
                                >
                                    <div style={{color:'#60a5fa',fontSize:'12px',fontWeight:'700'}}>✏️ Use as typed: <span style={{color:'white'}}>{query}</span></div>
                                </div>
                            )}
                            {results.map((u, i) => (
                                <div key={i}
                                    onPointerDown={e=>{e.preventDefault();handleSelect(u);}}
                                    style={{padding:'10px 14px',cursor:'pointer',borderBottom:'1px solid #334155'}}
                                    onMouseEnter={e=>e.currentTarget.style.background='#334155'}
                                    onMouseLeave={e=>e.currentTarget.style.background='transparent'}
                                >
                                    <div style={{color:'white',fontSize:'13px',fontWeight:'600'}}>{u.name}</div>
                                    <div style={{color:'#94a3b8',fontSize:'11px',marginTop:'2px'}}>{u.country}{u.city?' — '+u.city:''}</div>
                                </div>
                            ))}
                            {apiError && (
                                <div style={{padding:'12px 14px',color:'#94a3b8',fontSize:'12px',textAlign:'center'}}>
                                    No results found. Use "Use as typed" above or try a different spelling.
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };



        const TITLES = ["Res. Asst.", "Lecturer", "Asst. Prof. Dr.", "Assoc. Prof. Dr.", "Prof. Dr."];

        const ACADEMIC_DATA = {
            "default": [
                { id: 1, event: "Fall Start", date: "2024-09-23", category: "academic" },
                { id: 2, event: "Midterm Week", date: "2024-11-16", category: "academic" },
                { id: 3, event: "Final Week", date: "2025-01-06", category: "academic" },
                { id: 4, event: "Spring Start", date: "2025-02-17", category: "academic" },
                { id: 5, event: "Assoc. Prof. Exam (Mar)", date: "2025-03-20", type: "critical", category: "academic" },
                { id: 6, event: "Assoc. Prof. Exam (Oct)", date: "2025-10-20", type: "critical", category: "academic" }
            ]
        };

        // Normalize lesson type: converts legacy Turkish keys to English
        const normType = (t) => {
            const map = { lisans:'undergraduate', yuksek:'graduate', doktora:'doctoral', seminer:'seminar' };
            return map[t] || t || 'undergraduate';
        };

        // Only 4 types used for UI rendering
        const LESSON_TYPES = {
            "undergraduate": { label: "Undergrad", className: "lesson-lisans", btnClass: "btn-lisans", tag: "UG" },
            "graduate":      { label: "Graduate",  className: "lesson-yuksek", btnClass: "btn-yuksek", tag: "GR" },
            "doctoral":      { label: "Doctoral",  className: "lesson-doktora", btnClass: "btn-doktora", tag: "DR" },
            "seminar":       { label: "Seminar",   className: "lesson-seminer", btnClass: "btn-seminer", tag: "SEM" }
        };
        
        // Safe lookup: always resolve through normType first
        const getLessonType = (t) => LESSON_TYPES[normType(t)] || LESSON_TYPES['undergraduate'];

        const P2PdfModal = ({ images, setImages, onClose, sendToNative }) => {
            const moveUp = (idx) => {
                if (idx === 0) return;
                setImages(prev => {
                    const arr = [...prev];
                    [arr[idx-1], arr[idx]] = [arr[idx], arr[idx-1]];
                    return arr;
                });
            };
            const moveDown = (idx) => {
                setImages(prev => {
                    if (idx === prev.length-1) return prev;
                    const arr = [...prev];
                    [arr[idx+1], arr[idx]] = [arr[idx], arr[idx+1]];
                    return arr;
                });
            };
            const removeImg = (idx) => {
                setImages(prev => prev.filter((_,i) => i !== idx));
            };
            const generatePdf = async () => {
                try {
                    if (!window.jspdf) { alert("PDF library loading, please try again..."); return; }
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    const w = doc.internal.pageSize.getWidth();
                    const h = doc.internal.pageSize.getHeight();
                    if (!images.length) { alert("No photos!"); return; }
                    for (let i = 0; i < images.length; i++) {
                        if (i > 0) doc.addPage();
                        try {
                            const props = doc.getImageProperties(images[i]);
                            const pw = w - 20;
                            const ph = Math.min((props.height * pw) / props.width, h - 25);
                            doc.addImage(images[i], 'JPEG', 10, 10, pw, ph);
                        } catch(e) {
                            try { doc.addImage(images[i], 'PNG', 10, 10, w-20, h-30); } catch(e2) {}
                        }
                        doc.setFontSize(10); doc.setTextColor(120,120,120);
                        doc.text('Page '+(i+1), w/2, h-8, {align:'center'});
                    }
                    sendToNative({ type: 'SAVE_PDF', data: doc.output('datauristring'), filename: 'photos.pdf' });
                } catch(e) { alert('PDF error: ' + e.message); }
            };
            return (
                <div style={{position:'fixed',inset:0,zIndex:9999,display:'flex',flexDirection:'column',background:'#0f172a'}}>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 16px',background:'#1e293b',borderBottom:'1px solid #334155',flexShrink:0}}>
                        <div>
                            <div style={{color:'white',fontWeight:'bold',fontSize:'16px'}}>📸 Fotoğraf → PDF</div>
                            {images.length > 0 && <div style={{color:'#94a3b8',fontSize:'12px'}}>{images.length} fotoğraf • ↑↓ ile sırala</div>}
                        </div>
                        <button onClick={onClose} style={{background:'#334155',border:'none',color:'#94a3b8',width:'36px',height:'36px',borderRadius:'50%',fontSize:'18px',cursor:'pointer'}}>×</button>
                    </div>
                    <div style={{flex:1,overflowY:'auto',padding:'16px'}}>
                        {images.length === 0 ? (
                            <div onClick={() => sendToNative({type:'PICK_PHOTOS'})} style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'240px',border:'2px dashed #6d28d9',borderRadius:'16px',cursor:'pointer',gap:'12px'}}>
                                <span style={{fontSize:'48px'}}>🖼️</span>
                                <span style={{color:'#e2e8f0',fontWeight:'bold'}}>Buraya dokun, fotoğraf seç</span>
                                <span style={{color:'#64748b',fontSize:'13px'}}>Çoklu seçim yapabilirsin</span>
                            </div>
                        ) : (
                            <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
                                {images.map((img, idx) => (
                                    <div key={idx} style={{display:'flex',alignItems:'center',gap:'8px',background:'#1e293b',borderRadius:'12px',padding:'8px',border:'1px solid #334155'}}>
                                        <img src={img} style={{width:'72px',height:'72px',objectFit:'cover',borderRadius:'8px',flexShrink:0}} />
                                        <div style={{flex:1,display:'flex',flexDirection:'column',gap:'4px'}}>
                                            <span style={{color:'#94a3b8',fontSize:'12px'}}>Photo {idx+1}</span>

                                                            <div className="text-left overflow-hidden">
                                                                <div className="font-semibold text-sm truncate">{link.name}</div>
                                                                {link.isSearch && <div className="text-[10px] opacity-60">searches: {user.name}</div>}
                                                                {!link.url && <div className="text-[10px] text-blue-300">tap to add URL</div>}
                                                            </div>
                                                        </div>
                                                        <i className={`fas ${link.url ? 'fa-external-link-alt' : 'fa-edit'} text-xs shrink-0 ml-2 opacity-70`}></i>
                                                    </button>
                                                    <button
                                                        onClick={() => { setEditingLinkId(link.id); setTempLinkName(link.name); setTempLinkUrl(link.url); }}
                                                        className="bg-slate-700 hover:bg-blue-600 text-slate-400 hover:text-white w-10 rounded-xl flex items-center justify-center transition shrink-0"
                                                        title="Edit"
                                                    >
                                                        <i className="fas fa-pen text-xs"></i>
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}


                    {/* AKADEMİK TAKVİM MODAL */}
                    {activeModal === 'academicCalendar' && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[70] flex items-center justify-center p-4 animate-enter no-screenshot">
                            <div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-white font-bold">Academic Calendar</h3>
                                    <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-white">
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-xs text-slate-400 block mb-2">Academic Calendar Link</label>
                                        <input 
                                            type="text" 
                                            className="w-full input-dark p-3 rounded text-sm" 
                                            placeholder="Link starting with https:// or www."
                                            value={academicCalendarUrl}
                                            onChange={(e) => setAcademicCalendarUrl(e.target.value)}
                                        />
                                    </div>
                                    
                                    <div className="flex gap-2">
                                        {academicCalendarUrl && (
                                            <button 
                                                onClick={() => { setAcademicCalendarUrl(fixUrl(academicCalendarUrl)); window.open(fixUrl(academicCalendarUrl), '_blank'); }}
                                                className="flex-1 bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-500 transition"
                                            >
                                                <i className="fas fa-external-link-alt mr-2"></i>
                                                Open Calendar
                                            </button>
                                        )}
                                        <button 
                                            onClick={() => { setAcademicCalendarUrl(fixUrl(academicCalendarUrl)); setActiveModal(null); }}
                                            className="flex-1 bg-slate-700 text-slate-300 py-3 rounded-lg hover:bg-slate-600 transition"
                                        >
                                            Save
                                        </button>
                                    </div>
                                    
                                    {!academicCalendarUrl && (
                                        <p className="text-xs text-slate-500 text-center mt-2">
                                            Addresses starting with www. will automatically get https://
                                        </p>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ADD COURSEME MODALI */}
                    {activeModal === 'addLesson' && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4 animate-enter no-screenshot overflow-y-auto">
                            <div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl my-8">
                                <h3 className="text-white font-bold mb-4 text-lg">Add New Course</h3>
                                
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">Course Name *</label>
                                        <input 
                                            className="w-full input-dark p-3 rounded" 
                                            placeholder="e.g. Algorithms and Data Structures"
                                            value={lessonName} 
                                            onChange={e => setLessonName(e.target.value)} 
                                        />
                                    </div>

                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">Course Type *</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            {Object.entries(LESSON_TYPES).map(([k, v]) => (
                                                <button 
                                                    key={k} 
                                                    onClick={() => setLessonType(k)} 
                                                    className={`p-3 rounded border text-xs font-bold transition ${lessonType === k ? 'ring-2 ring-white scale-105' : 'opacity-70'} ${v.btnClass}`}
                                                >
                                                    {v.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <div className="flex justify-between items-center mb-2">
                                            <label className="text-xs text-slate-400">Time Slots ({lessonSlots.length})</label>
                                            <button 
                                                onClick={addLessonSlot}
                                                className="text-xs bg-emerald-600 text-white px-3 py-1 rounded hover:bg-emerald-500"
                                            >
                                                <i className="fas fa-plus mr-1"></i>Add
                                            </button>
                                        </div>
                                        
                                        <div className="space-y-3 max-h-60 overflow-y-auto">
                                            {lessonSlots.map((slot, idx) => (
                                                <div key={slot.id} className="bg-slate-900/50 p-3 rounded border border-slate-700">
                                                    <div className="flex justify-between items-center mb-2">
                                                        <span className="text-xs text-slate-400 font-bold">#{idx + 1}</span>
                                                        {lessonSlots.length > 1 && (
                                                            <button 
                                                                onClick={() => removeLessonSlot(slot.id)}
                                                                className="text-red-400 hover:text-red-300 text-xs"
                                                            >
                                                                <i className="fas fa-trash"></i>
                                                            </button>
                                                        )}
                                                    </div>
                                                    
                                                    <div className="space-y-2">
                                                        <select 
                                                            className="w-full input-dark p-2 rounded text-sm"
                                                            value={slot.day}
                                                            onChange={(e) => updateLessonSlot(slot.id, 'day', e.target.value)}
                                                        >
                                                            {DAYS_TR.map(day => <option key={day} value={day}>{day}</option>)}
                                                        </select>
                                                        
                                                        <div className="grid grid-cols-2 gap-2">
                                                            <input 
                                                                type="time" 
                                                                className="w-full input-dark p-2 rounded text-sm" 
                                                                value={slot.startTime}
                                                                onChange={(e) => updateLessonSlot(slot.id, 'startTime', e.target.value)}
                                                            />
                                                            <input 
                                                                type="time" 
                                                                className="w-full input-dark p-2 rounded text-sm" 
                                                                value={slot.endTime}
                                                                onChange={(e) => updateLessonSlot(slot.id, 'endTime', e.target.value)}
                                                            />
                                                        </div>
                                                        
                                                        <input 
                                                            className="w-full input-dark p-2 rounded text-sm" 
                                                            placeholder="Room (e.g. A101)"
                                                            value={slot.classroom}
                                                            onChange={(e) => updateLessonSlot(slot.id, 'classroom', e.target.value)}
                                                        />
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <div className="flex gap-2 mt-6">
                                    <button 
                                        onClick={() => {
                                            setActiveModal(null);
                                            setLessonSlots([{ id: Date.now(), day: "Monday", startTime: "09:00", endTime: "10:00", classroom: "" }]);
                                            setLessonName("");
                                            setLessonType("undergraduate");
                                        }} 
                                        className="flex-1 py-3 rounded bg-slate-700 text-slate-400 hover:bg-slate-600"
                                    >
                                        Cancel
                                    </button>
                                    <button 
                                        onClick={handleAddMultiLesson} 
                                        className="flex-1 py-3 rounded bg-emerald-600 text-white font-bold hover:bg-emerald-500"
                                    >
                                        <i className="fas fa-check mr-2"></i>
                                        Add Course
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* AYARLAR MODAL */}
                    {activeModal === 'p2pdf' && (
                        <P2PdfModal
                            images={p2pdfImages}
                            setImages={setP2pdfImages}
                            onClose={() => { setActiveModal(null); setP2pdfImages([]); }}
                            sendToNative={sendToNative}
                        />
                    )}

                    {activeModal === 'settings' && <SettingsForm user={user} setUser={setUser} setActiveModal={setActiveModal} updateAcademicCalendar={updateAcademicCalendar} notifSound={notifSound} setNotifSound={setNotifSound} sendToNative={sendToNative} exportData={exportData} importData={importData} />}
                    
                    {/* GÖREV EKLEME/DÜZENLEME MODAL */}
                    {activeModal === 'task' && (<div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4 animate-enter no-screenshot"><div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl max-h-[90vh] overflow-y-auto"><h3 className="text-white font-bold mb-4">{editingTask ? 'Edit Task' : 'New Reminder'}</h3><div className="space-y-3"><input className="w-full input-dark p-3 rounded" placeholder="Title" value={newTask.title} onChange={e=>{setNewTask({...newTask,title:e.target.value}); setConflictWarn(null);}} /><div className="grid grid-cols-2 gap-2"><select className="w-full input-dark p-3 rounded" value={newTask.category} onChange={e=>setNewTask({...newTask,category:e.target.value})}><option value="daily">Daily Task (Blue)</option><option value="official">Official Meeting (Yellow)</option><option value="special">Special Day (Pink - Annual Repeat)</option></select><input type="time" className="w-full input-dark p-3 rounded" value={newTask.time} onChange={e=>{setNewTask({...newTask,time:e.target.value}); setConflictWarn(null);}} /></div><input type="date" className="w-full input-dark p-3 rounded" value={newTask.date} onChange={e=>{setNewTask({...newTask,date:e.target.value}); setConflictWarn(null);}} /><textarea className="w-full input-dark p-3 rounded h-20 resize-none" placeholder="Description..." value={newTask.desc} onChange={e=>setNewTask({...newTask,desc:e.target.value})}></textarea>{newTask.category !== 'special' && (<div className="bg-slate-900/50 p-3 rounded-lg border border-slate-700"><div className="mb-2"><span className="text-xs text-slate-300 font-bold">Rutin Tekrar Seçeneği</span></div><select className="w-full input-dark p-2 rounded text-sm" value={recurringType} onChange={e=>setRecurringType(e.target.value)} disabled={!!editingTask}><option value="none">No Repeat</option><option value="weekly">Weekly</option><option value="biweekly">Bi-Weekly</option><option value="monthly">Monthly</option></select>{recurringType !== "none" && recurringType !== "monthly" && (<div className="flex items-center gap-2 mt-2 animate-enter"><span className="text-[10px] text-slate-400">Kaç Kez?</span><input type="number" value={recurringWeeks} onChange={e=>setRecurringWeeks(parseInt(e.target.value))} className="w-16 bg-slate-900 border border-slate-600 rounded p-1 text-center text-white text-xs" /></div>)}{recurringType === "monthly" && (<p className="text-[10px] text-slate-400 mt-2">12 ay boyunca her ay tekrarlanacak</p>)}</div>)}{newTask.category === 'special' && (<div className="bg-pink-900/20 p-3 rounded-lg border border-pink-700"><p className="text-xs text-pink-300"><i className="fas fa-info-circle mr-1"></i>Özel günler her yıl otomatik olarak tekrarlanır</p></div>)}</div><div className="flex gap-2 mt-4"><button onClick={()=>{setActiveModal(null); setEditingTask(null); setNewTask({title:"", date:"", time:"", desc:"", type:"task", category:"daily"}); setRecurringType("none");}} className="flex-1 py-3 rounded bg-slate-700 text-slate-400 hover:bg-slate-600">Cancel</button><button onClick={handleAddTask} className={`flex-1 py-3 rounded text-white font-bold transition ${conflictWarn ? 'bg-red-600 hover:bg-red-700 animate-pulse' : 'bg-blue-600 hover:bg-blue-500'}`}>{conflictWarn ? '⚠️ Add Anyway?' : (editingTask ? 'Update' : 'Save')}</button></div>{conflictWarn && <div className="mt-2 text-center text-xs text-red-300 bg-red-900/20 p-2 rounded">{conflictWarn}</div>}</div></div>)}
                    
                    {/* NOTLAR MODAL */}
                    {activeModal === 'notes' && (<div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4 animate-enter no-screenshot"><div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl h-[60vh] flex flex-col"><div className="flex justify-between mb-4"><h3 className="text-white font-bold">Notebook</h3><button onClick={()=>setActiveModal(null)}><i className="fas fa-times text-slate-400"></i></button></div><div className="flex gap-2 mb-4"><input className="flex-1 input-dark p-2 rounded" placeholder="Your note..." value={newNote} onChange={e=>setNewNote(e.target.value)} /><button onClick={handleAddNote} className="bg-blue-600 px-4 rounded text-white"><i className="fas fa-plus"></i></button></div><div className="flex-1 overflow-y-auto space-y-2">{notes.map(n=><div key={n.id} className="bg-slate-700 p-3 rounded flex justify-between items-start"><div><p className="text-sm text-white">{n.text}</p><p className="text-[10px] text-slate-400">{n.date}</p></div><button onClick={()=>setNotes(notes.filter(x=>x.id!==n.id))} className="text-red-400"><i className="fas fa-trash"></i></button></div>)}</div></div></div>)}
                    
                    {/* DERS DÜZENLEME MODALI */}
                    {activeModal === 'lesson' && editingLesson && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4 animate-enter no-screenshot">
                            <div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl max-h-[90vh] overflow-y-auto">
                                <h3 className="text-white font-bold mb-4">Edit Course</h3>
                                
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">Course Name</label>
                                        <input 
                                            className="w-full input-dark p-3 rounded" 
                                            value={editingLesson.data.name} 
                                            onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,name:e.target.value}})} 
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-xs text-slate-400 block mb-1">Start</label>
                                            <input 
                                                type="time" 
                                                className="w-full input-dark p-3 rounded" 
                                                value={editingLesson.data.startTime || ""} 
                                                onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,startTime:e.target.value}})} 
                                            />
                                        </div>
                                        <div>
                                            <label className="text-xs text-slate-400 block mb-1">End</label>
                                            <input 
                                                type="time" 
                                                className="w-full input-dark p-3 rounded" 
                                                value={editingLesson.data.endTime || ""} 
                                                onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,endTime:e.target.value}})} 
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">Room/Classroom</label>
                                        <input 
                                            className="w-full input-dark p-3 rounded" 
                                            placeholder="e.g. A101" 
                                            value={editingLesson.data.classroom || ""} 
                                            onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,classroom:e.target.value}})} 
                                        />
                                    </div>

                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">Duration (Hours)</label>
                                        <input 
                                            type="number" 
                                            min="1" 
                                            max="8" 
                                            className="w-full input-dark p-3 rounded" 
                                            value={editingLesson.data.duration || ""} 
                                            onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,duration:e.target.value}})} 
                                        />
                                    </div>

                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">Type (Color)</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            {Object.entries(LESSON_TYPES).map(([k,v])=>(
                                                <button 
                                                    key={k} 
                                                    onClick={()=>setEditingLesson({...editingLesson,data:{...editingLesson.data,type:k}})} 
                                                    className={`p-2 rounded border text-xs font-bold transition ${normType(editingLesson.data.type)===k?'ring-2 ring-white scale-105':'opacity-80'} ${v.btnClass}`}
                                                >
                                                    {v.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-3 gap-2 mt-6">
                                    <button 
                                        onClick={() => {setActiveModal(null); setEditingLesson(null);}}
                                        className="py-3 rounded bg-slate-700 text-slate-400 hover:bg-slate-600"
                                    >
                                        Vazgeç
                                    </button>
                                    <button 
                                        onClick={deleteLesson} 
                                        className="py-3 rounded bg-red-900/50 text-red-400 hover:bg-red-900/70 border border-red-800"
                                    >
                                        Delete
                                    </button>
                                    <button 
                                        onClick={saveLesson} 
                                        className="py-3 rounded bg-blue-600 text-white font-bold hover:bg-blue-500"
                                    >
                                        Save
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* GÜN DETAY MODALI */}
                    {activeModal === 'dayDetail' && dayDetailData && (<div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[70] flex items-center justify-center p-4 animate-enter no-screenshot"><div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl max-h-[80vh] overflow-y-auto"><div className="flex justify-between items-center mb-4"><h3 className="text-white font-bold">{dayDetailData.date} Details</h3><button onClick={() => { setActiveModal(null); setDayDetailData(null); }} className="text-slate-400 hover:text-white"><i className="fas fa-times"></i></button></div><div className="space-y-3">{dayDetailData.events.map((ev, i) => (<div key={i} className={`p-3 rounded border-l-4 flex justify-between items-center ${ev.category==='academic'?'bg-red-900/30 border-red-500': ev.category==='official'?'bg-amber-900/30 border-amber-500': ev.category==='special'?'bg-pink-900/30 border-pink-500':'bg-blue-900/30 border-blue-500'}`} onClick={() => { if(ev.origin === 'personal' && !ev.isRecurring) { openEditTask(ev); setDayDetailData(null); } }}><div><div className="text-sm font-bold text-white">{ev.event}{ev.isRecurring && <span className="text-[10px] ml-2 bg-pink-600 px-2 py-0.5 rounded">Döngüsel</span>}</div>{ev.time && <div className="text-xs text-slate-400 mt-1"><i className="far fa-clock mr-1"></i>{ev.time}</div>}<div className="text-[10px] text-slate-500 mt-1 uppercase">{ev.origin}</div></div>{ev.origin === 'personal' && !ev.isRecurring && <button onClick={(e) => deleteTask(e, ev.id)} className="text-red-400 hover:text-red-300 px-2 ml-2"><i className="fas fa-trash"></i></button>}</div>))}</div><div className="mt-6 pt-4 border-t border-slate-700"><button onClick={() => { setNewTask({ title: "", date: dayDetailData.date, time: "09:00", desc: "", type: "task", category: "daily" }); setActiveModal('task'); }} className="w-full bg-slate-700 text-white py-2 rounded-lg text-sm hover:bg-slate-600 transition flex items-center justify-center gap-2"><i className="fas fa-plus"></i> Bu Güne Hatırlatıcı Ekle</button></div></div></div>)}
                </div>
            );
        }; // App fonksiyon kapanışı
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
