<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Akademik Asistan V3.2 FIXED</title>
    
    <script crossorigin="anonymous" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; -webkit-tap-highlight-color: transparent; user-select: none; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .input-dark { background: #1e293b; border: 1px solid #334155; color: white; transition: all 0.3s; }
        .signature { font-family: 'Sacramento', cursive; }
        .lesson-lisans { background: linear-gradient(135deg, #0d9488 0%, #115e59 100%) !important; color: white !important; } 
        .lesson-yuksek { background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%) !important; color: white !important; } 
        .lesson-doktora { background: linear-gradient(135deg, #e11d48 0%, #be123c 100%) !important; color: white !important; } 
        .lesson-seminer { background: linear-gradient(135deg, #d97706 0%, #b45309 100%) !important; color: white !important; } 
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // APK Kilitlenmesini önleyen güvenli veri okuma
        const safeGet = (key, def) => { 
            try { 
                const val = localStorage.getItem(key);
                if (!val || val === "undefined") return def;
                return JSON.parse(val); 
            } catch (e) { return def; } 
        };

        const UNIVERSITIES = [
            { name: "Selçuk Üni.", city: "Konya", url: "https://www.selcuk.edu.tr/Duyurular" },
            { name: "Necmettin Erbakan Üni.", city: "Konya", url: "https://www.erbakan.edu.tr/duyurular" },
            { name: "Akdeniz Üni.", city: "Antalya", url: "https://www.akdeniz.edu.tr/duyurular" }
            // ... Diğer üniversiteler buraya eklenebilir
        ].sort((a, b) => a.name.localeCompare(b.name));

        const LESSON_TYPES = {
            "lisans": { label: "Lisans", className: "lesson-lisans", btnClass: "bg-teal-600" },
            "yuksek": { label: "Y. Lisans", className: "lesson-yuksek", btnClass: "bg-indigo-600" },
            "doktora": { label: "Doktora", className: "lesson-doktora", btnClass: "bg-rose-600" },
            "seminer": { label: "Seminer", className: "lesson-seminer", btnClass: "bg-amber-600" }
        };

        const App = () => {
            const [user, setUser] = useState(() => safeGet('user_v46', null));
            const [tasks, setTasks] = useState(() => safeGet('tasks_v46', []));
            const [schedule, setSchedule] = useState(() => safeGet('schedule_v46', {
                Pazartesi: Array(13).fill(null), Sali: Array(13).fill(null), Carsamba: Array(13).fill(null), Persembe: Array(13).fill(null), Cuma: Array(13).fill(null), Cumartesi: Array(13).fill(null), Pazar: Array(13).fill(null)
            }));
            const [timeSlots, setTimeSlots] = useState(() => safeGet('timeslots_v46', ["08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00"]));
            const [view, setView] = useState("home");
            const [activeModal, setActiveModal] = useState(null);
            const [currentTime, setCurrentTime] = useState(new Date());

            // Kayıt İşlemleri
            useEffect(() => { localStorage.setItem('user_v46', JSON.stringify(user)); }, [user]);
            useEffect(() => { localStorage.setItem('tasks_v46', JSON.stringify(tasks)); }, [tasks]);
            useEffect(() => { localStorage.setItem('schedule_v46', JSON.stringify(schedule)); }, [schedule]);

            // Saat Güncelleme
            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-[#0f172a]">
                        <div className="w-full max-w-md glass p-8 rounded-2xl shadow-2xl">
                            <h1 className="text-2xl font-bold text-white mb-6 text-center">Akademik Asistan</h1>
                            <form onSubmit={(e) => {
                                e.preventDefault();
                                const fd = new FormData(e.target);
                                setUser({ name: fd.get('name'), uni: fd.get('uni'), title: fd.get('title') });
                            }} className="space-y-4">
                                <input name="name" required placeholder="Ad Soyad" className="w-full input-dark p-3 rounded-lg" />
                                <select name="title" className="w-full input-dark p-3 rounded-lg">
                                    <option>Arş. Gör.</option><option>Dr. Öğr. Üyesi</option><option>Doç. Dr.</option><option>Prof. Dr.</option>
                                </select>
                                <select name="uni" className="w-full input-dark p-3 rounded-lg">
                                    {UNIVERSITIES.map(u => <option key={u.name}>{u.name}</option>)}
                                </select>
                                <button className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl">BAŞLAT</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-md mx-auto min-h-screen bg-[#0f172a] pb-24 text-slate-100">
                    <div className="pt-10 pb-6 px-6 bg-slate-900 rounded-b-[40px] border-b border-blue-900/30">
                        <div className="flex justify-between items-center">
                            <div>
                                <h2 className="text-xl font-bold">{user.name}</h2>
                                <p className="text-xs text-blue-400">{user.uni}</p>
                            </div>
                            <button onClick={() => setView('settings')} className="p-2 bg-slate-800 rounded-full"><i className="fas fa-cog"></i></button>
                        </div>
                    </div>

                    <div className="p-4 space-y-6">
                        {view === 'home' && (
                            <div className="grid grid-cols-2 gap-4 animate-in fade-in">
                                <button onClick={() => setView('schedule')} className="glass p-6 rounded-2xl flex flex-col items-center gap-3">
                                    <i className="fas fa-calendar-alt text-2xl text-blue-400"></i>
                                    <span className="text-xs font-bold">PROGRAM</span>
                                </button>
                                <button onClick={() => setActiveModal('task')} className="glass p-6 rounded-2xl flex flex-col items-center gap-3">
                                    <i className="fas fa-plus-circle text-2xl text-emerald-400"></i>
                                    <span className="text-xs font-bold">GÖREV EKLE</span>
                                </button>
                            </div>
                        )}

                        {view === 'schedule' && (
                            <div className="glass rounded-xl overflow-hidden">
                                <table className="w-full text-[10px]">
                                    <thead className="bg-slate-800">
                                        <tr>
                                            <th className="p-2">Saat</th>
                                            {Object.keys(schedule).map(d => <th key={d}>{d.substring(0,3)}</th>)}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {timeSlots.map((t, i) => (
                                            <tr key={i} className="border-t border-slate-800">
                                                <td className="p-2 text-center font-mono">{t}</td>
                                                {Object.keys(schedule).map(d => (
                                                    <td key={d} className="p-1 h-10 border-l border-slate-800">
                                                        {schedule[d][i] && <div className={`w-full h-full rounded ${LESSON_TYPES[schedule[d][i].type].className} p-1`}>{schedule[d][i].name}</div>}
                                                    </td>
                                                ))}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>

                    {/* Navigasyon */}
