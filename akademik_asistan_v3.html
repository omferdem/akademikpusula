<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">
    <title>Akademik Asistan V3</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a;
            color: #e2e8f0; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none;
            overflow-x: hidden;
        }
        
        .glass { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }

        .input-dark { 
            background: #1e293b; 
            border: 1px solid #334155; 
            color: white; 
            transition: all 0.3s; 
        }
        .input-dark:focus { border-color: #3b82f6; outline: none; }

        .signature { font-family: 'Sacramento', cursive; letter-spacing: -1px; }
        
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .urgent-pulse { animation: pulse-red 2s infinite; }
        
        /* Ekran Görüntüsü Modu */
        .screenshot-mode { background-color: #ffffff !important; color: #000000 !important; }
        .screenshot-mode .app-container { background-color: #ffffff !important; box-shadow: none !important; }
        .screenshot-mode .no-screenshot { display: none !important; }
        .screenshot-mode .glass { 
            background: white !important; 
            border: 1px solid #000 !important; 
            color: black !important; 
            box-shadow: none !important; 
            backdrop-filter: none !important;
        }
        .screenshot-mode th { background-color: #f3f4f6 !important; color: black !important; border: 1px solid #000 !important; }
        .screenshot-mode td { border: 1px solid #000 !important; color: black !important; }
        .screenshot-mode input { color: black !important; background: transparent !important; border: none !important; text-align: center; }

        /* Ders Renkleri */
        .lesson-lisans { background: linear-gradient(135deg, #0d9488 0%, #115e59 100%) !important; border-left: 3px solid #5eead4 !important; color: white !important; } 
        .lesson-yuksek { background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%) !important; border-left: 3px solid #a5b4fc !important; color: white !important; } 
        .lesson-doktora { background: linear-gradient(135deg, #e11d48 0%, #be123c 100%) !important; border-left: 3px solid #fda4af !important; color: white !important; } 
        .lesson-seminer { background: linear-gradient(135deg, #d97706 0%, #b45309 100%) !important; border-left: 3px solid #fcd34d !important; color: white !important; } 
        
        .btn-lisans { background-color: #0d9488; color: white; border: 1px solid #5eead4; }
        .btn-yuksek { background-color: #4f46e5; color: white; border: 1px solid #a5b4fc; }
        .btn-doktora { background-color: #e11d48; color: white; border: 1px solid #fda4af; }
        .btn-seminer { background-color: #d97706; color: white; border: 1px solid #fcd34d; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
        ::-webkit-calendar-picker-indicator { filter: invert(1); }

        /* Bildirim Stilleri */
        @keyframes slideInRight {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .notification-enter { animation: slideInRight 0.3s ease-out; }
        
        .notification-daily { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        .notification-official { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .notification-special { background: linear-gradient(135deg, #ec4899, #db2777); }
        .notification-class { background: linear-gradient(135deg, #10b981, #059669); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const safeGet = (key, def) => { 
            try { 
                const val = localStorage.getItem(key);
                return val ? JSON.parse(val) : def; 
            } catch (e) { return def; } 
        };

        // Yarım saatlik zaman dilimleri oluştur (08:00 - 20:30)
        const generateTimeSlots = () => {
            const slots = [];
            for (let h = 8; h <= 20; h++) {
                slots.push(`${String(h).padStart(2, '0')}:00`);
                if (h < 20) slots.push(`${String(h).padStart(2, '0')}:30`);
            }
            return slots;
        };

        const DEFAULT_TIME_SLOTS = generateTimeSlots();

        const UNIVERSITIES = [
            { name: "Necmettin Erbakan Üni.", city: "Konya", url: "https://www.erbakan.edu.tr/duyurular" },
            { name: "Selçuk Üni.", city: "Konya", url: "https://www.selcuk.edu.tr/Duyurular" },
            { name: "Konya Teknik Üni.", city: "Konya", url: "https://www.ktun.edu.tr/tr/Universite/Duyurular" },
            { name: "KTO Karatay Üni.", city: "Konya", url: "https://www.karatay.edu.tr/duyurular" },
        ].sort((a, b) => a.name.localeCompare(b.name));

        const TITLES = ["Arş. Gör.", "Öğr. Gör.", "Dr. Öğr. Üyesi", "Doç. Dr.", "Prof. Dr."];

        const ACADEMIC_DATA = {
            "default": [
                { id: 1, event: "Güz Başlangıcı", date: "2024-09-23", category: "academic" },
                { id: 2, event: "Vize Haftası", date: "2024-11-16", category: "academic" },
                { id: 3, event: "Final Haftası", date: "2025-01-06", category: "academic" },
                { id: 4, event: "Bahar Başlangıcı", date: "2025-02-17", category: "academic" },
                { id: 5, event: "Doçentlik (Mart)", date: "2025-03-20", type: "critical", category: "academic" },
                { id: 6, event: "Doçentlik (Ekim)", date: "2025-10-20", type: "critical", category: "academic" }
            ]
        };

        const LESSON_TYPES = {
            "lisans": { label: "Lisans", className: "lesson-lisans", btnClass: "btn-lisans", tag: "L" },
            "yuksek": { label: "Y. Lisans", className: "lesson-yuksek", btnClass: "btn-yuksek", tag: "YL" },
            "doktora": { label: "Doktora", className: "lesson-doktora", btnClass: "btn-doktora", tag: "DR" },
            "seminer": { label: "Seminer", className: "lesson-seminer", btnClass: "btn-seminer", tag: "SEM" }
        };

        const DAYS_TR = ["Pazartesi", "Sali", "Carsamba", "Persembe", "Cuma", "Cumartesi", "Pazar"];

        const NOTIFICATION_ICONS = {
            daily: "📌",
            official: "📋",
            special: "⭐",
            class: "📚"
        };

        const App = () => {
            const [user, setUser] = useState(() => safeGet('user_v50', null));
            const [tasks, setTasks] = useState(() => safeGet('tasks_v50', []));
            const [notes, setNotes] = useState(() => safeGet('notes_v50', []));
            const [schedule, setSchedule] = useState(() => safeGet('schedule_v50', {
                Pazartesi: Array(DEFAULT_TIME_SLOTS.length).fill(null), 
                Sali: Array(DEFAULT_TIME_SLOTS.length).fill(null), 
                Carsamba: Array(DEFAULT_TIME_SLOTS.length).fill(null), 
                Persembe: Array(DEFAULT_TIME_SLOTS.length).fill(null), 
                Cuma: Array(DEFAULT_TIME_SLOTS.length).fill(null), 
                Cumartesi: Array(DEFAULT_TIME_SLOTS.length).fill(null), 
                Pazar: Array(DEFAULT_TIME_SLOTS.length).fill(null)
            }));
            const [timeSlots] = useState(DEFAULT_TIME_SLOTS);
            const [customScores, setCustomScores] = useState(() => safeGet('scores_v50', [{ id: 1, name: "Makale", value: 20, count: 0 }]));
            const [targetScore, setTargetScore] = useState(() => safeGet('target_score_v50', 100));
            const [calendarEvents, setCalendarEvents] = useState(() => safeGet('calendar_v50', ACADEMIC_DATA['default']));
            
            const [view, setView] = useState("flow");
            const [activeModal, setActiveModal] = useState(null); 
            const [dayDetailData, setDayDetailData] = useState(null); 
            const [selectedNode, setSelectedNode] = useState(null);
            const [isScreenshotMode, setIsScreenshotMode] = useState(false);
            const [alertState, setAlertState] = useState(null); 
            const [conflictWarn, setConflictWarn] = useState(null);
            const [dismissedAlerts, setDismissedAlerts] = useState([]);
            const [notifications, setNotifications] = useState([]);
            
            const [editingTask, setEditingTask] = useState(null);
            const [newTask, setNewTask] = useState({ title: "", date: "", time: "", desc: "", type: "task", category: "daily" });
            const [newNote, setNewNote] = useState("");
            const [isRecurring, setIsRecurring] = useState(false);
            const [recurringWeeks, setRecurringWeeks] = useState(14);
            const [editingLesson, setEditingLesson] = useState(null);
            
            // Gelişmiş ders ekleme
            const [lessonWizardStep, setLessonWizardStep] = useState(0);
            const [newLesson, setNewLesson] = useState({
                name: "",
                classroom: "",
                type: "lisans",
                schedule: {} // { Pazartesi: { start: "09:00", end: "10:30" }, ... }
            });
            
            const [prayerTimes, setPrayerTimes] = useState(null);
            const [currentTimeStr, setCurrentTimeStr] = useState("00:00");
            const [cursorColor, setCursorColor] = useState("bg-emerald-500 shadow-[0_0_10px_#10b981]");
            const [pomodoro, setPomodoro] = useState({ active: false, time: 25 * 60 });
            const [notificationPermission, setNotificationPermission] = useState("default");
            
            const fileInputRef = useRef(null);
            const audioRef = useRef(null);
            const [currentTime, setCurrentTime] = useState(new Date());

            // SAVE
            useEffect(() => { localStorage.setItem('user_v50', JSON.stringify(user)); }, [user]);
            useEffect(() => { localStorage.setItem('tasks_v50', JSON.stringify(tasks)); }, [tasks]);
            useEffect(() => { localStorage.setItem('schedule_v50', JSON.stringify(schedule)); }, [schedule]);
            useEffect(() => { localStorage.setItem('notes_v50', JSON.stringify(notes)); }, [notes]);
            useEffect(() => { localStorage.setItem('calendar_v50', JSON.stringify(calendarEvents)); }, [calendarEvents]);
            useEffect(() => { localStorage.setItem('scores_v50', JSON.stringify(customScores)); }, [customScores]);
            useEffect(() => { localStorage.setItem('target_score_v50', JSON.stringify(targetScore)); }, [targetScore]);

            // Bildirim izni iste
            useEffect(() => {
                if ('Notification' in window) {
                    setNotificationPermission(Notification.permission);
                    if (Notification.permission === 'default') {
                        Notification.requestPermission().then(permission => {
                            setNotificationPermission(permission);
                        });
                    }
                }
            }, []);

            const getMinutes = (timeStr) => { 
                if(!timeStr) return 0; 
                const [h, m] = timeStr.split(':').map(Number); 
                return h * 60 + m; 
            };

            const getDayKey = (dateStr) => { 
                const d = new Date(dateStr); 
                const map = ["Pazar", "Pazartesi", "Sali", "Carsamba", "Persembe", "Cuma", "Cumartesi"]; 
                return map[d.getDay()]; 
            };

            const showNotification = (event) => {
                const notifId = Date.now();
                const notif = {
                    id: notifId,
                    ...event,
                    timestamp: new Date()
                };

                setNotifications(prev => [...prev, notif]);

                // Browser bildirim
                if (notificationPermission === 'granted') {
                    const icon = NOTIFICATION_ICONS[event.category] || "🔔";
                    new Notification(`${icon} ${event.title}`, {
                        body: `${event.time} - ${event.desc || ''}`,
                        icon: '/icon-192.png',
                        badge: '/icon-192.png',
                        tag: event.id,
                        requireInteraction: true
                    });
                }

                // Ses çal
                try { audioRef.current.play(); } catch(e) {}

                // 10 saniye sonra kaldır
                setTimeout(() => {
                    setNotifications(prev => prev.filter(n => n.id !== notifId));
                }, 10000);
            };

            const dismissNotification = (id) => {
                setNotifications(prev => prev.filter(n => n.id !== id));
            };

            const getTimelineEvents = useCallback(() => {
                const now = new Date();
                const nowMinTotal = now.getHours() * 60 + now.getMinutes();
                const windowStart = nowMinTotal - (12 * 60); 
                const windowEnd = nowMinTotal + (12 * 60);
                let events = [];

                tasks.forEach(t => {
                    const tDate = new Date(t.date); 
                    const tMin = getMinutes(t.time); 
                    const diffDays = Math.round((tDate.setHours(0,0,0,0) - new Date().setHours(0,0,0,0)) / (1000*60*60*24));
                    let relativeMin = tMin + (diffDays * 1440);
                    if (relativeMin >= windowStart && relativeMin <= windowEnd) {
                        events.push({ ...t, relativeMin, displayType: t.category });
                    }
                });

                if (prayerTimes && user?.enablePrayer) {
                    const map = { Fajr: "İmsak", Sunrise: "Güneş", Dhuhr: "Öğle", Asr: "İkindi", Maghrib: "Akşam", Isha: "Yatsı" };
                    [-1, 0, 1].forEach(dayOffset => {
                        Object.keys(map).forEach(k => {
                            if(prayerTimes[k]) {
                                const tMin = getMinutes(prayerTimes[k]) + (dayOffset * 1440);
                                if (tMin >= windowStart && tMin <= windowEnd) {
                                    events.push({ 
                                        id: `p-${k}-${dayOffset}`, 
                                        title: map[k], 
                                        time: prayerTimes[k], 
                                        relativeMin: tMin, 
                                        displayType: "prayer", 
                                        category: "prayer",
                                        desc: dayOffset === 0 ? "Bugün" : (dayOffset === 1 ? "Yarın" : "Dün") 
                                    });
                                }
                            }
                        });
                    });
                }

                [-1, 0, 1].forEach(dayOffset => {
                    const d = new Date(); 
                    d.setDate(d.getDate() + dayOffset);
                    const dayKey = ["Pazar", "Pazartesi", "Sali", "Carsamba", "Persembe", "Cuma", "Cumartesi"][d.getDay()];
                    const dayLessons = schedule[dayKey];
                    if (dayLessons) {
                        dayLessons.forEach((l, i) => {
                            if (l && l.name) {
                                const tMin = getMinutes(timeSlots[i]) + (dayOffset * 1440);
                                if (tMin >= windowStart && tMin <= windowEnd) {
                                    events.push({ 
                                        id: `l-${dayOffset}-${i}`, 
                                        title: l.name, 
                                        time: timeSlots[i], 
                                        relativeMin: tMin, 
                                        displayType: "class", 
                                        category: "class",
                                        lType: l.type, 
                                        desc: LESSON_TYPES[l.type].label, 
                                        classroom: l.classroom,
                                        timeRange: l.timeRange
                                    });
                                }
                            }
                        });
                    }
                });

                return events.sort((a, b) => a.relativeMin - b.relativeMin);
            }, [tasks, prayerTimes, user, schedule, timeSlots]);

            const getTimelineList = () => {
                const events = getTimelineEvents();
                const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
                return events.filter(e => e.relativeMin >= nowMin).slice(0, 20); 
            };

            useEffect(() => {
                const tick = () => {
                    const now = new Date(); 
                    setCurrentTime(now);
                    setCurrentTimeStr(now.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'}));
                    
                    const events = getTimelineEvents();
                    const nowTotalMin = now.getHours() * 60 + now.getMinutes();

                    // Cursor Color
                    const nextEvent = events.find(ev => ev.relativeMin > nowTotalMin && ev.displayType !== 'prayer');
                    if (nextEvent) {
                        const diff = nextEvent.relativeMin - nowTotalMin;
                        if (diff <= 60) setCursorColor("bg-red-500 shadow-[0_0_15px_red]");
                        else if (diff <= 120) setCursorColor("bg-yellow-500 shadow-[0_0_10px_yellow]");
                        else setCursorColor("bg-emerald-500 shadow-[0_0_10px_#10b981]");
                    } else setCursorColor("bg-emerald-500 shadow-[0_0_10px_#10b981]");

                    // Bildirim kontrolü - 5 dakika önceden
                    const upcoming = events.find(ev => {
                        const diff = ev.relativeMin - nowTotalMin;
                        return diff > 0 && diff <= 5 && ev.displayType !== 'prayer';
                    });

                    if (upcoming && !dismissedAlerts.includes(upcoming.id)) {
                        if (!alertState || alertState.id !== upcoming.id) {
                            setAlertState(upcoming);
                            showNotification(upcoming);
                            setDismissedAlerts(prev => [...prev, upcoming.id]);
                        }
                    }

                    if(pomodoro.active && pomodoro.time > 0) setPomodoro(prev => ({...prev, time: prev.time - 1}));
                    else if (pomodoro.active && pomodoro.time === 0) { 
                        setPomodoro({active: false, time: 25 * 60}); 
                        showNotification({ title: "Pomodoro Tamamlandı!", desc: "25 dakikalık odaklanma süresi bitti.", category: "special" });
                    }
                };
                tick(); 
                const timer = setInterval(tick, 1000); 
                if (user?.enablePrayer && user?.city && !prayerTimes) fetchPrayerTimes(user.city);
                return () => clearInterval(timer);
            }, [getTimelineEvents, alertState, pomodoro.active, user, dismissedAlerts]);

            const dismissAlert = () => { 
                if (alertState) { 
                    setAlertState(null); 
                    if(audioRef.current) { 
                        audioRef.current.pause(); 
                        audioRef.current.currentTime = 0; 
                    } 
                } 
            };

            const fetchPrayerTimes = async (city) => { 
                try { 
                    const d = new Date(); 
                    const res = await fetch(`https://api.aladhan.com/v1/timingsByCity/${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()}?city=${city}&country=Turkey&method=13`); 
                    const json = await res.json(); 
                    if(json.data) setPrayerTimes(json.data.timings); 
                } catch (e) { 
                    console.error(e); 
                } 
            };

            const handleUpdateUser = (e) => { 
                e.preventDefault(); 
                const fd = new FormData(e.target); 
                const u = UNIVERSITIES.find(x => x.name === fd.get('uni')); 
                if (!u) return; 
                setUser({ 
                    ...user, 
                    title: fd.get('title'), 
                    name: fd.get('name'), 
                    uni: u.name, 
                    city: u.city, 
                    url: u.url, 
                    enablePrayer: fd.get('enablePrayer') === 'on' 
                }); 
                setActiveModal(null); 
            };

            const handleAddTask = () => { 
                if(!newTask.title || !newTask.date) return;

                if (editingTask) {
                    setTasks(prev => prev.map(t => t.id === editingTask.id ? { ...newTask, id: t.id } : t));
                    setEditingTask(null);
                } else {
                    let newTasks = []; 
                    if (isRecurring) { 
                        let currentDate = new Date(newTask.date); 
                        for(let i=0; i<recurringWeeks; i++) { 
                            newTasks.push({
                                ...newTask, 
                                id: Date.now()+i, 
                                date: currentDate.toISOString().split('T')[0]
                            }); 
                            currentDate.setDate(currentDate.getDate() + 7); 
                        } 
                    } else { 
                        newTasks.push({...newTask, id: Date.now()}); 
                    } 
                    setTasks(prev => [...prev, ...newTasks]); 
                }
                
                setActiveModal(null); 
                setConflictWarn(null); 
                setNewTask({title:"", date:"", time:"", desc:"", type:"task", category:"daily"}); 
                setIsRecurring(false);
            };

            const openEditTask = (task) => {
                setNewTask(task);
                setEditingTask(task);
                setActiveModal('task');
                setConflictWarn(null);
            };

            const deleteTask = (e, id) => { 
                e.stopPropagation();
                if(confirm("Görevi silmek istediğinize emin misiniz?")) { 
                    setTasks(prev => prev.filter(t => t.id !== id)); 
                } 
            };

            const handleAddNote = () => { 
                if(!newNote) return; 
                setNotes([{id: Date.now(), text: newNote, date: new Date().toLocaleDateString()}, ...notes]); 
                setNewNote(""); 
            };

            // YENİ DERS EKLEME - Adım adım
            const handleLessonNext = () => {
                if (lessonWizardStep === 0 && !newLesson.name) {
                    alert("Lütfen ders adını girin!");
                    return;
                }
                if (lessonWizardStep < DAYS_TR.length) {
                    setLessonWizardStep(lessonWizardStep + 1);
                }
            };

            const handleLessonBack = () => {
                if (lessonWizardStep > 0) {
                    setLessonWizardStep(lessonWizardStep - 1);
                }
            };

            const handleLessonFinish = () => {
                if (!newLesson.name || Object.keys(newLesson.schedule).length === 0) {
                    alert("En az bir güne ders eklemelisiniz!");
                    return;
                }

                const batchId = Date.now();
                const newSchedule = { ...schedule };

                Object.keys(newLesson.schedule).forEach(day => {
                    const { start, end } = newLesson.schedule[day];
                    const startMin = getMinutes(start);
                    const endMin = getMinutes(end);

                    // Hangi slot'lara denk geliyor bul
                    timeSlots.forEach((slot, index) => {
                        const slotMin = getMinutes(slot);
                        if (slotMin >= startMin && slotMin < endMin) {
                            newSchedule[day][index] = {
                                name: newLesson.name,
                                type: newLesson.type,
                                classroom: newLesson.classroom,
                                batchId: batchId,
                                timeRange: `${start} - ${end}`
                            };
                        }
                    });
                });

                setSchedule(newSchedule);
                setActiveModal(null);
                setNewLesson({
                    name: "",
                    classroom: "",
                    type: "lisans",
                    schedule: {}
                });
                setLessonWizardStep(0);
            };

            const toggleDaySchedule = (day, enabled) => {
                if (!enabled) {
                    const newSch = { ...newLesson.schedule };
                    delete newSch[day];
                    setNewLesson({ ...newLesson, schedule: newSch });
                }
            };

            const setDayTime = (day, field, value) => {
                const newSch = { 
                    ...newLesson.schedule, 
                    [day]: { 
                        ...(newLesson.schedule[day] || { start: "09:00", end: "10:30" }),
                        [field]: value
                    } 
                };
                setNewLesson({ ...newLesson, schedule: newSch });
            };

            const saveLesson = () => { 
                const { day, index, data } = editingLesson; 
                const newSchedule = { ...schedule }; 
                newSchedule[day][index] = data;
                setSchedule(newSchedule); 
                setActiveModal(null); 
            };
            
            const deleteLesson = () => { 
                const { day, index, data } = editingLesson; 
                if (!data) { setActiveModal(null); return; } 
                const newSchedule = { ...schedule }; 
                if (data.batchId) { 
                    if (confirm(`"${data.name}" dersinin tümünü sil?`)) { 
                        Object.keys(newSchedule).forEach(d => { 
                            newSchedule[d] = newSchedule[d].map(l => (l && l.batchId === data.batchId) ? null : l); 
                        }); 
                    } else { 
                        newSchedule[day][index] = null; 
                    } 
                } else { 
                    newSchedule[day][index] = null; 
                } 
                setSchedule(newSchedule); 
                setActiveModal(null); 
            };

            const renderTimelineBar = () => {
                const events = getTimelineEvents(); 
                const nowMin = currentTime.getHours() * 60 + currentTime.getMinutes();

                                className={`flex flex-col items-center gap-1 ${view === t.id ? 'text-blue-400' : 'text-slate-500 hover:text-slate-400'}`}
                            >
                                <i className={`fas fa-${t.icon} text-lg`}></i>
                                <span className="text-[10px] uppercase font-bold">{t.label}</span>
                            </button>
                        ))}
                    </div>

                    {/* Pomodoro */}
                    {!isScreenshotMode && (
                        <button 
                            onClick={() => setPomodoro(prev => ({...prev, active: !prev.active}))} 
                            className={`fixed bottom-24 left-4 z-50 w-12 h-12 rounded-full flex items-center justify-center shadow-lg transition-all border border-slate-700 no-screenshot ${pomodoro.active ? 'bg-red-600 animate-pulse' : 'bg-slate-800 text-slate-400 hover:text-white'}`}
                        >
                            {pomodoro.active ? (
                                <span className="text-xs font-bold text-white">
                                    {Math.floor(pomodoro.time/60)}:{String(pomodoro.time%60).padStart(2,'0')}
                                </span>
                            ) : (
                                <i className="fas fa-stopwatch text-xl"></i>
                            )}
                        </button>
                    )}

                    {/* MODALLER */}
                    
                    {/* YENİ DERS EKLEME WIZARD */}
                    {activeModal === 'addLesson' && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4 animate-enter no-screenshot">
                            <div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl max-h-[90vh] overflow-y-auto">
                                
                                {/* İlerleme Göstergesi */}
                                <div className="mb-6">
                                    <div className="flex justify-between items-center mb-2">
                                        <h3 className="text-white font-bold text-lg">Yeni Ders Ekle</h3>
                                        <span className="text-xs text-slate-400">
                                            {lessonWizardStep === 0 ? "Genel Bilgiler" : `${DAYS_TR[lessonWizardStep - 1]}`}
                                        </span>
                                    </div>
                                    <div className="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                                        <div 
                                            className="h-full bg-emerald-500 transition-all duration-300"
                                            style={{width: `${(lessonWizardStep / (DAYS_TR.length + 1)) * 100}%`}}
                                        ></div>
                                    </div>
                                </div>

                                {/* Adım 0: Genel Bilgiler */}
                                {lessonWizardStep === 0 && (
                                    <div className="space-y-4">
                                        <div>
                                            <label className="text-xs text-slate-400 block mb-1">Ders Adı *</label>
                                            <input 
                                                className="w-full input-dark p-3 rounded" 
                                                placeholder="örn: Algoritma ve Veri Yapıları"
                                                value={newLesson.name} 
                                                onChange={e => setNewLesson({...newLesson, name: e.target.value})} 
                                            />
                                        </div>

                                        <div>
                                            <label className="text-xs text-slate-400 block mb-1">Sınıf/Derslik</label>
                                            <input 
                                                className="w-full input-dark p-3 rounded" 
                                                placeholder="örn: A101, Lab-2"
                                                value={newLesson.classroom} 
                                                onChange={e => setNewLesson({...newLesson, classroom: e.target.value})} 
                                            />
                                        </div>

                                        <div>
                                            <label className="text-xs text-slate-400 block mb-1">Ders Tipi *</label>
                                            <div className="grid grid-cols-2 gap-2">
                                                {Object.entries(LESSON_TYPES).map(([k, v]) => (
                                                    <button 
                                                        key={k} 
                                                        onClick={() => setNewLesson({...newLesson, type: k})} 
                                                        className={`p-3 rounded border text-xs font-bold transition ${newLesson.type === k ? 'ring-2 ring-white scale-105' : 'opacity-70'} ${v.btnClass}`}
                                                    >
                                                        {v.label}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* Adım 1-7: Her gün için saat bilgisi */}
                                {lessonWizardStep > 0 && lessonWizardStep <= DAYS_TR.length && (
                                    <div className="space-y-4">
                                        <div className="text-center mb-4">
                                            <h4 className="text-xl font-bold text-white mb-2">
                                                {DAYS_TR[lessonWizardStep - 1]}
                                            </h4>
                                            <p className="text-xs text-slate-400">
                                                Bu gün "{newLesson.name}" dersi var mı?
                                            </p>
                                        </div>

                                        <div className="flex gap-2">
                                            <button
                                                onClick={() => toggleDaySchedule(DAYS_TR[lessonWizardStep - 1], false)}
                                                className={`flex-1 p-4 rounded-xl border-2 transition ${!newLesson.schedule[DAYS_TR[lessonWizardStep - 1]] ? 'bg-slate-700 border-slate-500 text-white' : 'bg-slate-900 border-slate-700 text-slate-500'}`}
                                            >
                                                <i className="fas fa-times text-2xl mb-2"></i>
                                                <div className="text-xs font-bold">YOK</div>
                                            </button>
                                            <button
                                                onClick={() => {
                                                    const day = DAYS_TR[lessonWizardStep - 1];
                                                    if (!newLesson.schedule[day]) {
                                                        setDayTime(day, 'start', '09:00');
                                                        setDayTime(day, 'end', '10:30');
                                                    }
                                                }}
                                                className={`flex-1 p-4 rounded-xl border-2 transition ${newLesson.schedule[DAYS_TR[lessonWizardStep - 1]] ? 'bg-emerald-600 border-emerald-400 text-white' : 'bg-slate-900 border-slate-700 text-slate-500'}`}
                                            >
                                                <i className="fas fa-check text-2xl mb-2"></i>
                                                <div className="text-xs font-bold">VAR</div>
                                            </button>
                                        </div>

                                        {newLesson.schedule[DAYS_TR[lessonWizardStep - 1]] && (
                                            <div className="space-y-3 animate-enter">
                                                <div>
                                                    <label className="text-xs text-slate-400 block mb-1">Başlangıç Saati</label>
                                                    <input 
                                                        type="time" 
                                                        className="w-full input-dark p-3 rounded font-mono" 
                                                        value={newLesson.schedule[DAYS_TR[lessonWizardStep - 1]].start} 
                                                        onChange={e => setDayTime(DAYS_TR[lessonWizardStep - 1], 'start', e.target.value)} 
                                                    />
                                                </div>
                                                <div>
                                                    <label className="text-xs text-slate-400 block mb-1">Bitiş Saati</label>
                                                    <input 
                                                        type="time" 
                                                        className="w-full input-dark p-3 rounded font-mono" 
                                                        value={newLesson.schedule[DAYS_TR[lessonWizardStep - 1]].end} 
                                                        onChange={e => setDayTime(DAYS_TR[lessonWizardStep - 1], 'end', e.target.value)} 
                                                    />
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Navigasyon Butonları */}
                                <div className="flex gap-2 mt-6">
                                    {lessonWizardStep > 0 && (
                                        <button 
                                            onClick={handleLessonBack} 
                                            className="flex-1 py-3 rounded bg-slate-700 text-slate-300 hover:bg-slate-600 font-bold"
                                        >
                                            <i className="fas fa-arrow-left mr-2"></i>
                                            Geri
                                        </button>
                                    )}
                                    
                                    {lessonWizardStep < DAYS_TR.length ? (
                                        <button 
                                            onClick={handleLessonNext} 
                                            className="flex-1 py-3 rounded bg-blue-600 text-white font-bold hover:bg-blue-500"
                                        >
                                            İleri
                                            <i className="fas fa-arrow-right ml-2"></i>
                                        </button>
                                    ) : (
                                        <button 
                                            onClick={handleLessonFinish} 
                                            className="flex-1 py-3 rounded bg-emerald-600 text-white font-bold hover:bg-emerald-500"
                                        >
                                            <i className="fas fa-check mr-2"></i>
                                            Tamamla
                                        </button>
                                    )}
                                    
                                    <button 
                                        onClick={() => {
                                            setActiveModal(null);
                                            setNewLesson({ name: "", classroom: "", type: "lisans", schedule: {} });
                                            setLessonWizardStep(0);
                                        }} 
                                        className="py-3 px-4 rounded bg-red-900/50 text-red-200 hover:bg-red-900"
                                    >
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>

                                {/* Özet Bilgi */}
                                {Object.keys(newLesson.schedule).length > 0 && (
                                    <div className="mt-4 p-3 bg-slate-900/50 rounded border border-slate-700 text-xs">
                                        <div className="text-slate-400 mb-1">Eklenen Günler:</div>
                                        <div className="text-white font-bold">
                                            {Object.keys(newLesson.schedule).join(', ')}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Diğer modaller... */}
                    {activeModal === 'settings' && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[70] flex items-center justify-center p-4 animate-enter no-screenshot">
                            <div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl relative">
                                <button onClick={() => setActiveModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-white">
                                    <i className="fas fa-times"></i>
                                </button>
                                <h3 className="text-white font-bold mb-4">Ayarlar</h3>
                                <form onSubmit={handleUpdateUser} className="space-y-4">
                                    <div>
                                        <label className="text-xs text-slate-400">Ad Soyad</label>
                                        <input name="name" defaultValue={user.name} required className="w-full input-dark p-3 rounded-lg" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-slate-400">Üniversite</label>
                                        <select name="uni" defaultValue={user.uni} className="w-full input-dark p-3 rounded-lg">
                                            {UNIVERSITIES.map(u => <option key={u.name} value={u.name}>{u.name}</option>)}
                                        </select>
                                    </div>
                                    <div className="flex items-center gap-3 pt-2">
                                        <input type="checkbox" name="enablePrayer" defaultChecked={user.enablePrayer} className="w-5 h-5 accent-blue-500" />
                                        <span className="text-sm text-slate-300">Namaz Vakitlerini Göster</span>
                                    </div>
                                    <button className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-500">
                                        Kaydet
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {activeModal === 'task' && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4 animate-enter no-screenshot">
                            <div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl">
                                <h3 className="text-white font-bold mb-4">{editingTask ? 'Görevi Düzenle' : 'Yeni Hatırlatıcı'}</h3>
                                <div className="space-y-3">
                                    <input 
                                        className="w-full input-dark p-3 rounded" 
                                        placeholder="Başlık" 
                                        value={newTask.title} 
                                        onChange={e => setNewTask({...newTask, title: e.target.value})} 
                                    />
                                    <div className="grid grid-cols-2 gap-2">
                                        <select 
                                            className="w-full input-dark p-3 rounded" 
                                            value={newTask.category} 
                                            onChange={e => setNewTask({...newTask, category: e.target.value})}
                                        >
                                            <option value="daily">Gündelik İş (Mavi)</option>
                                            <option value="official">Resmi Toplantı (Sarı)</option>
                                            <option value="special">Özel Gün (Pembe)</option>
                                        </select>
                                        <input 
                                            type="time" 
                                            className="w-full input-dark p-3 rounded" 
                                            value={newTask.time} 
                                            onChange={e => setNewTask({...newTask, time: e.target.value})} 
                                        />
                                    </div>
                                    <input 
                                        type="date" 
                                        className="w-full input-dark p-3 rounded" 
                                        value={newTask.date} 
                                        onChange={e => setNewTask({...newTask, date: e.target.value})} 
                                    />
                                    <textarea 
                                        className="w-full input-dark p-3 rounded h-20 resize-none" 
                                        placeholder="Açıklama..." 
                                        value={newTask.desc} 
                                        onChange={e => setNewTask({...newTask, desc: e.target.value})}
                                    ></textarea>
                                    <div className="bg-slate-900/50 p-3 rounded-lg border border-slate-700">
                                        <div className="flex items-center justify-between mb-2">
                                            <span className="text-xs text-slate-300">Rutin Tekrar?</span>
                                            <input 
                                                type="checkbox" 
                                                checked={isRecurring} 
                                                onChange={e => setIsRecurring(e.target.checked)} 
                                                className="w-4 h-4 accent-blue-500" 
                                                disabled={!!editingTask} 
                                            />
                                        </div>
                                        {isRecurring && (
                                            <div className="flex items-center gap-2 animate-enter">
                                                <span className="text-[10px] text-slate-400">Kaç Hafta?</span>
                                                <input 
                                                    type="number" 
                                                    value={recurringWeeks} 
                                                    onChange={e => setRecurringWeeks(parseInt(e.target.value))} 
                                                    className="w-16 bg-slate-900 border border-slate-600 rounded p-1 text-center text-white text-xs" 
                                                />
                                            </div>
                                        )}
                                    </div>
                                </div>
                                <div className="flex gap-2 mt-4">
                                    <button 
                                        onClick={() => setActiveModal(null)} 
                                        className="flex-1 py-3 rounded bg-slate-700 text-slate-400 hover:bg-slate-600"
                                    >
                                        İptal
                                    </button>
                                    <button 
                                        onClick={handleAddTask} 
                                        className="flex-1 py-3 rounded bg-blue-600 text-white font-bold hover:bg-blue-500"
                                    >
                                        {editingTask ? 'Güncelle' : 'Kaydet'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeModal === 'notes' && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4 animate-enter no-screenshot">
                            <div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl h-[60vh] flex flex-col">
                                <div className="flex justify-between mb-4">
                                    <h3 className="text-white font-bold">Not Defteri</h3>
                                    <button onClick={() => setActiveModal(null)}>
                                        <i className="fas fa-times text-slate-400"></i>
                                    </button>
                                </div>
                                <div className="flex gap-2 mb-4">
                                    <input 
                                        className="flex-1 input-dark p-2 rounded" 
                                        placeholder="Notunuz..." 
                                        value={newNote} 
                                        onChange={e => setNewNote(e.target.value)} 
                                    />
                                    <button onClick={handleAddNote} className="bg-blue-600 px-4 rounded text-white">
                                        <i className="fas fa-plus"></i>
                                    </button>
                                </div>
                                <div className="flex-1 overflow-y-auto space-y-2">
                                    {notes.map(n => (
                                        <div key={n.id} className="bg-slate-700 p-3 rounded flex justify-between items-start">
                                            <div>
                                                <p className="text-sm text-white">{n.text}</p>
                                                <p className="text-[10px] text-slate-400">{n.date}</p>
                                            </div>
                                            <button 
                                                onClick={() => setNotes(notes.filter(x => x.id !== n.id))} 
                                                className="text-red-400"
                                            >
                                                <i className="fas fa-trash"></i>
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {activeModal === 'lesson' && editingLesson && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4 animate-enter no-screenshot">
                            <div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl">
                                <h3 className="text-white font-bold mb-4">Ders Düzenle</h3>
                                <div className="mb-4">
                                    <label className="text-xs text-slate-400 block mb-1">Ders Adı</label>
                                    <input 
                                        className="w-full input-dark p-3 rounded" 
                                        value={editingLesson.data.name} 
                                        onChange={e => setEditingLesson({...editingLesson, data: {...editingLesson.data, name: e.target.value}})} 
                                    />
                                </div>
                                <div className="mb-4">
                                    <label className="text-xs text-slate-400 block mb-1">Sınıf/Derslik</label>
                                    <input 
                                        className="w-full input-dark p-3 rounded" 
                                        placeholder="örn: A101" 
                                        value={editingLesson.data.classroom || ""} 
                                        onChange={e => setEditingLesson({...editingLesson, data: {...editingLesson.data, classroom: e.target.value}})} 
                                    />
                                </div>
                                <div className="mb-6">
                                    <label className="text-xs text-slate-400 block mb-1">Tür</label>
                                    <div className="grid grid-cols-2 gap-2">
                                        {Object.entries(LESSON_TYPES).map(([k,v]) => (
                                            <button 
                                                key={k} 
                                                onClick={() => setEditingLesson({...editingLesson, data: {...editingLesson.data, type: k}})} 
                                                className={`p-2 rounded border text-xs font-bold transition ${editingLesson.data.type === k ? 'ring-2 ring-white scale-105' : 'opacity-80'} ${v.btnClass}`}
                                            >
                                                {v.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="flex gap-2">
                                    <button 
                                        onClick={deleteLesson} 
                                        className="flex-1 py-3 rounded bg-slate-700 text-red-400 hover:bg-slate-600"
                                    >
                                        Sil
                                    </button>
                                    <button 
                                        onClick={saveLesson} 
                                        className="flex-1 py-3 rounded bg-blue-600 text-white font-bold hover:bg-blue-500"
                                    >
                                        Kaydet
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').then(registration => {
                console.log('ServiceWorker registered:', registration);
            }).catch(err => {
                console.log('ServiceWorker registration failed:', err);
            });
        }
    </script>
</body>
</html>
